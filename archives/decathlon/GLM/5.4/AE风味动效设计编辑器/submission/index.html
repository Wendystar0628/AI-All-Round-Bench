<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>锻字 · 动效设计编辑器</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 菜单栏 -->
  <div id="menubar">
    <div class="brand"><span class="logo">◈</span> 锻字 <em>MOTION</em></div>
    <div class="menus" id="menus"></div>
    <div class="menubar-right">
      <span id="mb-project">未命名工程</span>
      <span class="sep"></span>
      <button class="mbtn" id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
      <button class="mbtn" id="btn-redo" title="重做 (Ctrl+Shift+Z)">↷</button>
      <span class="sep"></span>
      <button class="mbtn" id="btn-save" title="保存工程 (Ctrl+S)">保存</button>
      <button class="mbtn" id="btn-load" title="打开工程">打开</button>
    </div>
  </div>

  <div id="main">
    <!-- 左：项目 -->
    <div id="left">
      <div class="panel">
        <div class="panel-head">项目 <span class="ph-btns"><button id="btn-new-comp" title="新建合成">＋</button></span></div>
        <div class="panel-body" id="project-tree"></div>
      </div>
      <div class="panel grow">
        <div class="panel-head">预设与生成器</div>
        <div class="panel-body" id="preset-list"></div>
      </div>
    </div>

    <!-- 中：查看器 + 时间轴 -->
    <div id="center">
      <div id="viewer">
        <div class="viewer-tabs" id="viewer-tabs">
          <div class="vtabs" id="comp-tabs"></div>
          <div class="viewer-tools">
            <button class="tbtn" id="btn-grid" title="网格">▦</button>
            <button class="tbtn" id="btn-guides" title="辅助线">▤</button>
            <button class="tbtn" id="btn-overlays" title="显示图层控制">◎</button>
            <button class="tbtn" id="btn-zoom-fit" title="适合窗口 (\\)">⤢</button>
            <select id="zoom-select" title="缩放">
              <option value="fit">适合</option><option value="0.25">25%</option><option value="0.5">50%</option>
              <option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option>
            </select>
            <select id="res-select" title="预览分辨率">
              <option value="1">完整</option><option value="0.5">一半</option><option value="0.25">四分之一</option>
            </select>
          </div>
        </div>
        <div id="canvas-wrap">
          <canvas id="glcanvas"></canvas>
          <canvas id="overlay"></canvas>
          <div id="viewer-hud"></div>
          <div id="drop-hint">拖放工程文件到此处打开</div>
        </div>
        <div id="transport">
          <div class="tp-left">
            <button class="tbtn" id="btn-first" title="转到开头 (Home)">⏮</button>
            <button class="tbtn" id="btn-prev-key" title="上一关键帧 (J)">⏪</button>
            <button class="tbtn big" id="btn-play" title="播放/暂停 (空格)">▶</button>
            <button class="tbtn" id="btn-next-key" title="下一关键帧 (K)">⏩</button>
            <button class="tbtn" id="btn-last" title="转到结尾 (End)">⏭</button>
            <button class="tbtn" id="btn-loop" title="循环工作区">∞</button>
          </div>
          <div class="tp-center">
            <span class="timecode" id="timecode">0:00:00:00</span>
            <span class="framecode" id="framecode">帧 0</span>
          </div>
          <div class="tp-right">
            <span id="preview-info">—</span>
          </div>
        </div>
      </div>
      <div id="timeline">
        <div class="tl-toolbar">
          <div class="tl-tabs">
            <button class="tab active" data-tab="keys">时间轴</button>
            <button class="tab" data-tab="curves">曲线</button>
          </div>
          <div class="tl-tools">
            <button class="tbtn" id="btn-tl-zoomin" title="放大时间轴">＋</button>
            <button class="tbtn" id="btn-tl-zoomout" title="缩小时间轴">－</button>
            <button class="tbtn" id="btn-kf-easy" title="缓入缓出 (F9)">◦●◦</button>
            <button class="tbtn" id="btn-kf-linear" title="线性 (Ctrl+Shift+L)">╱</button>
            <button class="tbtn" id="btn-kf-hold" title="定格">■</button>
            <button class="tbtn" id="btn-kf-copy" title="复制关键帧">⧉</button>
            <button class="tbtn" id="btn-kf-paste" title="粘贴关键帧">⇲</button>
            <button class="tbtn" id="btn-kf-del" title="删除关键帧">✕</button>
            <button class="tbtn" id="btn-workarea" title="设置工作区为播放范围">[ ]</button>
          </div>
        </div>
        <div id="tl-body">
          <div id="layer-list">
            <div class="ll-head">
              <span class="col-vis"></span><span class="col-lock"></span><span class="col-solo"></span>
              <span class="col-name">图层名称</span><span class="col-mode">混合模式</span>
            </div>
            <div id="layer-rows"></div>
          </div>
          <div id="key-area">
            <div class="ruler" id="ruler"><canvas id="ruler-canvas"></canvas></div>
            <div id="key-canvas-wrap"><canvas id="key-canvas"></canvas></div>
            <div id="graph-wrap" class="hidden"><canvas id="graph-canvas"></canvas></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：属性 -->
    <div id="right">
      <div class="right-tabs" id="right-tabs">
        <button class="tab active" data-rtab="props">属性</button>
        <button class="tab" data-rtab="material">材质</button>
        <button class="tab" data-rtab="nodes">节点</button>
        <button class="tab" data-rtab="fields">场与模拟</button>
      </div>
      <div id="right-body">
        <div id="inspector" class="rpanel active"></div>
        <div id="material-panel" class="rpanel"></div>
        <div id="node-panel" class="rpanel">
          <div class="node-toolbar">
            <select id="node-add-select"></select>
            <button class="tbtn" id="node-add">添加节点</button>
            <button class="tbtn" id="node-group" title="封装选中节点 (Ctrl+G)">组</button>
            <button class="tbtn" id="node-del" title="删除">✕</button>
            <span class="hint">拖动端口连线 · 右键断开</span>
          </div>
          <canvas id="node-canvas"></canvas>
        </div>
        <div id="field-panel" class="rpanel"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-text">就绪</span>
    <span class="status-right">
      <span id="status-hint">空格 播放 · F9 缓入缓出 · Ctrl+Z 撤销 · V 选择 · H 抓手 · G 钢笔</span>
      <span id="status-fps"></span>
    </span>
  </div>
</div>
<div id="ctx-menu" class="ctx-menu hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<input type="file" id="file-open" accept=".json" class="hidden">
<div id="toast" class="toast"></div>

<script src="js/util.js"></script>
<script src="js/path.js"></script>
<script src="js/font.js"></script>
<script src="js/expr.js"></script>
<script src="js/model.js"></script>
<script src="js/eval.js"></script>
<script src="js/fields.js"></script>
<script src="js/nodes.js"></script>
<script src="js/geo3d.js"></script>
<script src="js/render2d.js"></script>
<script src="js/render3d.js"></script>
<script src="js/composite.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui_timeline.js"></script>
<script src="js/ui_nodes.js"></script>
<script src="js/demo.js"></script>
<script src="js/main.js"></script>
</body>
</html>
