<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网络安全攻防战 · 动态路由塔防</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<script>
  // 按窗口尺寸自适应界面比例（1080p → 1，4K → 最大 1.35）
  (function () { var s = Math.max(0.85, Math.min(1.35, window.innerWidth / 1920)); try { var v = localStorage.getItem('td_uiscale'); if (v) s = parseFloat(v); } catch (e) { } document.documentElement.style.setProperty('--ui', s); })();
</script>
</head>
<body>
<div id="scene"></div>
<div id="ui"></div>
<script src="lib/three.global.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/models.js"></script>
<script src="js/scene.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/demos.js"></script>
<script src="js/main.js"></script>
<script>
  window.addEventListener('load', function () {
    try { G.App.init(); } catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;left:10px;top:10px;color:#f66;background:#000;padding:10px;z-index:9999">' + (e && e.stack || e) + '</pre>'); }
  });
</script>
</body>
</html>
