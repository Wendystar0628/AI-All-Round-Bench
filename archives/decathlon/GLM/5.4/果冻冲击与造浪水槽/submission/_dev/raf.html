<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script>
(async () => {
  const c = document.getElementById('c');
  const adapter = await navigator.gpu.requestAdapter();
  const dev = await adapter.requestDevice();
  const ctx = c.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({device: dev, format: fmt, alphaMode: 'opaque'});
  c.width = 1920; c.height = 1080;
  const mod = dev.createShaderModule({code:`
    @vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4f {
      var p = array<vec2f,3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
      return vec4f(p[i],0,1);
    }
    @fragment fn fs() -> @location(0) vec4f { return vec4f(0.2,0.5,0.8,1.0); }`});
  const pipe = await dev.createRenderPipelineAsync({layout:'auto', vertex:{module:mod, entryPoint:'vs'}, fragment:{module:mod, entryPoint:'fs', targets:[{format:fmt}]}, primitive:{topology:'triangle-list'}});
  const times=[]; let last=performance.now();
  function frame(){
    const now=performance.now(); times.push(now-last); last=now;
    const enc = dev.createCommandEncoder();
    const pass = enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(), loadOp:'clear', storeOp:'store', clearValue:{r:0.1,g:0.2,b:0.3,a:1}}]});
    pass.setPipeline(pipe); pass.draw(3); pass.end();
    dev.queue.submit([enc.finish()]);
    if (times.length < 8) requestAnimationFrame(frame); else window.__times = times.map(x=>x.toFixed(1));
  }
  requestAnimationFrame(frame);
})();
</script></body></html>
