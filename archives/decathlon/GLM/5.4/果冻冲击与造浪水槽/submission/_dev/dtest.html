<!doctype html><html><body><script>
(async () => {
  const out = {};
  const adapter = await navigator.gpu.requestAdapter();
  out.float32Blendable = adapter.features.has('float32-blendable');
  out.float32Filterable = adapter.features.has('float32-filterable');
  const dev = await adapter.requestDevice({features: adapter.features.has('float32-blendable') ? ['float32-blendable'] : []});
  const tryCode = async (code, label) => {
    const m = dev.createShaderModule({code, label});
    const info = await m.getCompilationInfo();
    return info.messages.filter(x=>x.type==='error').map(e=>e.lineNum+':'+e.message).join(' | ') || 'OK';
  };
  out.vec4 = await tryCode(`
    struct FOut { @builtin(position) p : vec4f, @location(0) c : vec4f };
    @vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4f {
      var p = array<vec2f,3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
      return vec4f(p[i],0.5,1.0);
    }
    @fragment fn fs() -> FOut { var o:FOut; o.p = vec4f(0.0,0.0,0.5,1.0); o.c = vec4f(1.0); return o; }
  `);
  out.f32 = await tryCode(`
    struct FOut { @builtin(position) p : f32, @location(0) c : vec4f };
    @vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4f {
      var p = array<vec2f,3>(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3));
      return vec4f(p[i],0.5,1.0);
    }
    @fragment fn fs() -> FOut { var o:FOut; o.p = 0.5; o.c = vec4f(1.0); return o; }
  `);
  // r32float renderable + blend test
  try {
    const tex = dev.createTexture({size:[4,4], format:'r32float', usage: GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING});
    out.r32created = true;
  } catch(e) { out.r32created = e.message; }
  window.__out = out;
  console.log(JSON.stringify(out));
})();
</script></body></html>
