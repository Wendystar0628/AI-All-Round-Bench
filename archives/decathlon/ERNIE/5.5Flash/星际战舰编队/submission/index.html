<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际战舰编队：旗舰与护卫舰</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#03060c;}
  #gl{display:block;width:100vw;height:100vh;background:#03060c;}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#03060c;color:#8fd8e8;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
    letter-spacing:2px;transition:opacity .8s ease;z-index:10;}
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .box{text-align:center;}
  #loading .bar{width:220px;height:2px;background:#123040;margin-top:18px;overflow:hidden;}
  #loading .bar i{display:block;height:100%;width:40%;background:#62e8ff;animation:load 1.2s infinite ease-in-out;}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><div class="box">舰队组装中<div class="bar"><i></i></div></div></div>
<script src="js/engine.js"></script>
<script src="js/voxel.js"></script>
<script src="js/models.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
