<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested OS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot-screen">
  <div class="boot-mark">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#bg1)"></rect>
      <rect x="18" y="18" width="28" height="28" rx="7" fill="none" stroke="#fff" stroke-width="2.5" opacity=".92"></rect>
      <rect x="26" y="26" width="12" height="12" rx="3" fill="#fff" opacity=".9"></rect>
      <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d8bff"></stop><stop offset="1" stop-color="#a06bff"></stop></linearGradient></defs>
    </svg>
    <div class="boot-title">Nested OS</div>
    <div class="boot-sub">嵌套图形操作系统</div>
    <div class="boot-bar"><span></span></div>
    <div class="boot-tip" id="boot-tip">正在载入根系统…</div>
  </div>
</div>
<div id="os-root"></div>
<div id="debug-hud" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
