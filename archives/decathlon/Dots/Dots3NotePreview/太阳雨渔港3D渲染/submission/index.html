<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  太阳雨中的小渔港堤岸  —  三渲二 微缩模型
// ============================================================

const app = document.getElementById('app');

// ---------- 尺寸与布局常量 ----------
const B = 18;                 // 半宽
const DOCK_X0 = 0.4;          // 码头/海水 分界（防波堤墙体占 [-0.4,0.4]）
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();

// ---------- 天空（浅青白渐变）----------
function makeSkyTexture(){
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,256,0,0);
  g.addColorStop(0.00,'#dfeef7');
  g.addColorStop(0.55,'#eaf6fd');
  g.addColorStop(1.00,'#f4faff');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const skyTex = makeSkyTexture();
const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide });
const skySphere = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), skyMat);
scene.add(skySphere);

// ---------- 摄像机 / 控制 ----------

camera.position.set(15, 13, -26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, -1);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.62;

// ---------- 光照（高调通透）----------
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(14, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.bias = -0.0004;
scene.add(sun);
const sunTarget = new THREE.Vector3(0, 0, 0);
const sunDir = new THREE.Vector3();

const ambient = new THREE.AmbientLight(0xbfd9ea, 0.85);
scene.add(ambient);
const fillLight = new THREE.DirectionalLight(0x9fc4e0, 0.5);
fillLight.position.set(-18, 8, -12);
scene.add(fillLight);

// 云层（薄云）—— 几片半透明云饼，缓慢漂移
const cloudGroup = new THREE.Group(); scene.add(cloudGroup);
function makeCloudTexture(){
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const x = c.getContext('2d');

  g.addColorStop(0,'rgba(255,255,255,0.95)');
  g.addColorStop(0.5,'rgba(255,255,255,0.55)');

  x.fillStyle=g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); return t;
}
const cloudTex = makeCloudTexture();
const cloudMat = new THREE.MeshBasicMaterial({ map: cloudTex, transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending });
function addCloud(x,z,s){
  const m = new THREE.Mesh(new THREE.CircleGeometry(s,32), cloudMat);
  m.position.set(x, 26 + Math.sin(x*0.3)*2, z);

}
addCloud(-8, -6, 7); addCloud(6, 2, 5.5); addCloud(12, -14, 6);
addCloud(-12, 12, 5); addCloud(2, 16, 4.5); addCloud(-4, 22, 6);

// 云隙淡金色光柱 —— 半透明径向渐变平面
function makeBeamTexture(){
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,236,180,0.55)');

}
const beamTex = makeBeamTexture();
const beamMat = new THREE.MeshBasicMaterial({ map: beamTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.0 });
const beamGroup = new THREE.Group(); scene.add(beamGroup);
function addBeam(x,z,w){

  m.position.set(x, 14, z);
  m.rotation.x = Math.PI/2;

}
addBeam(-10, -8, 9); addBeam(4, 4, 7); addBeam(12, -12, 6);

// ---------- 三渲二：toon 渐变色阶 ----------
function makeToonRamp(){
  const c = document.createElement('canvas'); c.width=64; c.height=1;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,64,0);
  g.addColorStop(0.00,'#16202a'); g.addColorStop(0.22,'#3c4a56');
  g.addColorStop(0.45,'#748290'); g.addColorStop(0.68,'#aebcc8');
  g.addColorStop(0.85,'#d7e0e8'); g.addColorStop(1.00,'#f6fafd');
  x.fillStyle=g; x.fillRect(0,0,64,1);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
const toonRamp = makeToonRamp();
const _mats = {};
function M(color, opts={}){
  const key = color+'|'+(opts.emissive||0)+'|'+(opts.alpha||1);
  if(_mats[key]) return _mats[key];
  const m = new THREE.MeshToonMaterial({
    color: new THREE.Color(color),
    emissive: opts.emissive || 0x000000,
    emissiveIntensity: opts.emissiveIntensity || 0,
    gradientMap: toonRamp,
    transparent: !!opts.alpha && opts.alpha < 1,
    opacity: opts.alpha || 1,
    side: opts.side || THREE.FrontSide,
    shininess: opts.shininess || 0,
  });
  _mats[key] = m; return m;
}

// ---------- 贴图：警示条纹 / 木纹 / 云纹 ----------
function makeStripeTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const x = c.getContext('2d');
  for(let i=0;i<8;i++){ x.fillStyle = i%2? '#f0d020':'#1a1a1a'; x.fillRect(i*8,0,8,64); }
  const t = new THREE.CanvasTexture(c); t.repeat.set(4,1); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const stripeTex = makeStripeTexture();
function makeRoughTexture(base, dark){
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const x = c.getContext('2d'); x.fillStyle=base; x.fillRect(0,0,128,128);
  for(let i=0;i<2600;i++){ x.fillStyle = Math.random()<0.5?dark:base; x.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*4,1+Math.random()*3); }
  const t = new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const concreteTex = makeRoughTexture('#9aa0a4','#6f757b');
const concreteTex2 = makeRoughTexture('#8f949a','#62686e');
const woodTex = makeRoughTexture('#7a5238','#4a3220');

// ============================================================
//  地基方台 + 剖面
// ============================================================
const baseGroup = new THREE.Group(); scene.add(baseGroup);

// 地基层（可见剖面：水平层理 + 潮线）
const strataMat = new THREE.MeshToonMaterial({ color: 0x8c9298, gradientMap: toonRamp });
const strataGeo = new THREE.BoxGeometry(2*B, 3, 2*B);
const strata = new THREE.Mesh(strataGeo, strataMat);
strata.position.y = -1.5; baseGroup.add(strata);

// 混凝土码头板
const dockMat = new THREE.MeshToonMaterial({ map: concreteTex, color: 0xb8bec4, gradientMap: toonRamp });
const dockGeo = new THREE.BoxGeometry(2*B-DOCK_X0, 0.3, 2*B);
const dock = new THREE.Mesh(dockGeo, dockMat);
dock.position.set((DOCK_X0+B)/2, -0.15, 0); baseGroup.add(dock);

// 码头岸壁（防波堤式矮墙，靠水侧 X=-DOCK_X0）
const wallMat = new THREE.MeshToonMaterial({ map: concreteTex2, color: 0x9aa0a4, gradientMap: toonRamp });
const wall = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.7, 2*B), wallMat);
wall.position.set(-DOCK_X0+0.35, 0.55, 0); baseGroup.add(wall);

// 岸壁顶缘 警示条
const curbMat = new THREE.MeshToonMaterial({ map: stripeTex, color: 0xffffff, gradientMap: toonRamp });
const curb = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.22, 2*B), curbMat);
curb.position.set(-DOCK_X0+0.35, 1.35, 0); baseGroup.add(curb);

// 码头近水台阶（低矮，靠岸壁）
for(let i=0;i<3;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.18-0.06*i, 1.1), wallMat);
  s.position.set(-DOCK_X0+0.35+0.5, 0.18-0.06*i, -11.5+i*0.0);
  s.rotation.z = 0.06*i;
  baseGroup.add(s);
}
// 小船台（登船平台）
const plat = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.25, 1.6), wallMat);
plat.position.set(-DOCK_X0+1.4, 0.3, -6.5); baseGroup.add(plat);

// 远端防波堤（L形另一臂）沿 Z=15
const breakMat = new THREE.MeshToonMaterial({ map: concreteTex2, color: 0x9aa0a4, gradientMap: toonRank });
const breakGeo = new THREE.BoxGeometry(B+0.6, 1.3, 0.9);
const breakwater = new THREE.Mesh(breakGeo, breakMat);
breakwater.position.set(-7.5, 0.4, 15); baseGroup.add(breakwater);
// 防波堤消波块（四脚锥）堆叠
function tetrapod(x,z,s,rot){
  const g = new THREE.Group();
  const legMat = M('#7a8288');
  for(let i=0;i<4;i++){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.18*s,0.32*s,1.6*s,6), legMat);
    const ang = i*Math.PI/2 + rot;
    leg.position.set(Math.cos(ang)*0.5*s, 0.4*s, Math.sin(ang)*0.5*s);
    leg.rotation.set(Math.PI/2 - 0.5, 0, ang);
    g.add(leg);
  }
  g.position.set(x,0,z); return g;
}
const tetraGroup = new THREE.Group(); baseGroup.add(tetraGroup);
const tetraPositions = [
  [-15.5,13.4,1.0,0],[-15.5,16.6,1.0,0.5],
  [-12.0,12.6,0.85,0.3],[-12.0,17.4,0.85,0.3],
  [-8.5,12.2,0.75,0.1],[-8.5,17.8,0.75,0.1],
  [-15.0,10.0,0.9,0.7],[-10.0,9.6,0.8,0.4]
];
tetraPositions.forEach(p=>tetraGroup.add(tetrapod(p[0],p[1],p[2],p[3])));

// 岸壁系船柱（黑铸铁）+ 缆绳
const bollardMat = M('#1a1d22', {emissive:0x10141a, emissiveIntensity:0.4});
const bollardGroup = new THREE.Group(); baseGroup.add(bollardGroup);
for(let z=-13; z<13; z+=2.6){
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.34,0.7,14), bollardMat);
  b.position.set(-DOCK_X0+0.35, 0.35, z); bollardGroup.add(b);
}

// ============================================================
//  水面（着色反射 + 涟漪 + 海草/小鱼/沉物）
// ============================================================
// 水下物体（可见于剖面与水面下）
const underGroup = new THREE.Group(); scene.add(underGroup);
// 水底碎石
const gravelMat = M('#6e7a74');
for(let i=0;i<220;i++){
  const g = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06+Math.random()*0.18,1), gravelMat);
  g.position.set(-17+Math.random()*16, -2.6+Math.random()*0.6, -17+Math.random()*34);
  underGroup.add(g);
}
// 沉胎
const tireMat = M('#2a2622');
for(let i=0;i<3;i++){
  const t = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.16,10,24), tireMat);
  t.position.set(-10-Math.random()*5, -1.8, -4+Math.random()*22);
  t.rotation.x = Math.PI/2; underGroup.add(t);
}
// 海草
const weedMat = M('#3f7a5e', {emissive:0x103020, emissiveIntensity:0.3});
for(let i=0;i<40;i++){
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.05,0.5+Math.random()*1.2,5), weedMat);
  w.position.set(-16+Math.random()*15, -1.2+Math.random()*0.8, -16+Math.random()*34);
  underGroup.add(w);
}
// 小鱼
const fishMat = M('#d8e8ec');
const fishGroup = new THREE.Group(); scene.add(fishGroup);
for(let i=0;i<26;i++){
  const f = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8), fishMat);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.1,0.22,8), M('#b8c8cc'));
  tail.position.z = -0.22; tail.rotation.x = Math.PI/2;
  f.add(body); f.add(tail);
  f.position.set(-16+Math.random()*15, -1.5+Math.random()*1.0, -16+Math.random()*34);
  fishGroup.add(f);
}

// 水面平面（自定义着色器）
const waterUniforms = {
  uTime: { value: 0 },
  uReflection: { value: null },
  uWaterColor: { value: new THREE.Color(0x2f8a8a) },
  uDeepColor:   { value: new THREE.Color(0x1c5558) },
  uShallowColor:{ value: new THREE.Color(0x4fb6b0) },
  uTexScale: { value: new THREE.Vector2(1/36, 1/36) },
  uTexOffset:{ value: new THREE.Vector2(0.5,0.5) },
  uPosterN: { value: 5.0 },
  uSun: { value: 1.0 },
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: `
    varying vec3 vWorldPos;
    varying vec3 vViewDir;
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorldPos = wp.xyz;
      vViewDir = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform sampler2D uReflection;
    uniform vec3 uWaterColor, uDeepColor, uShallowColor;
    uniform vec2 uTexScale, uTexOffset;
    uniform float uPosterN, uSun;
    varying vec3 vWorldPos;
    varying vec3 vViewDir;
    float rand(vec2 n){ return fract(sin(dot(n, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 pos = vWorldPos.xz;
      float t = uTime;
      // 涟漪扭曲反射
      vec2 ripple = vec2(
        sin(pos.x*1.3 + t*0.7)*0.018 + sin(pos.z*1.4 + t*0.5)*0.015,
        cos(pos.x*1.1 + t*0.8)*0.015 + cos(pos.z*1.2 + t*0.6)*0.018
      );
      vec2 refUV = pos*uTexScale + uTexOffset + ripple;
      vec3 ref = texture2D(uReflection, refUV).rgb;
      vec3 poster = floor(ref * uPosterN) / uPosterN;
      float depth = smoothstep(-16.0, -2.0, pos.x);
      vec3 col = mix(uShallowColor, uDeepColor, depth);
      col = mix(col, poster, 0.58);
      // 闪光
      vec2 gs = pos*0.5 + vec2(t*0.25);
      float n = rand(gs);
      float glint = step(0.975, n) * (0.3+0.7*n) * uSun;
      col += glint * vec3(1.0,0.96,0.85) * 0.7;
      // 近岸白沫（消波块前）
      float foam = 0.0;
      for(int i=0;i<8;i++){
        float fx = -15.5 + float(i)*1.4;
        float d = abs(pos.x-fx) + abs(pos.z-(12.0+fract(float(i)*0.37)*4.0));
        float w = 1.6 + 0.6*sin(t*1.5+float(i));
        foam += smoothstep(w, w-0.6, d) * 0.5;
      }
      col += vec3(0.95,0.97,0.98) * foam * 0.8;
      gl_FragColor = vec4(col, 0.90);
    }`,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(2*B-DOCK_X0-0.35, 2*B, 64, 64), waterMat);
water.rotation.x = -Math.PI/2;
water.position.set(-(DOCK_X0+0.35)/2, 0.01, 0);
scene.add(water);

// 反射渲染目标（俯视 RTT）
const waterRT = new THREE.WebGLRenderTarget(512, 512, {
  format: THREE.RGBAFormat, internalColorSpace: THREE.SRGBColorSpace,
});
const waterCam = new THREE.OrthographicCamera(-B, B, B, -B, 0.1, 60);
waterCam.position.set(0, 40, 0); waterCam.lookAt(0,0,0);
const waterHelper = new THREE.OrthographicHelper(-B, B, B, -B);
function renderReflection(){
  const wasWater = water.visible, wasRain = rain.visible, wasSky = skySphere.visible;
  water.visible = false; rain.visible = false; skySphere.visible = false;
  underGroup.visible = false; fishGroup.visible = false;
  renderer.setRenderTarget(waterRT);
  renderer.render(scene, waterCam);
  renderer.setRenderTarget(null);
  water.visible = wasWater; rain.visible = wasRain; skySphere.visible = wasSky;
  underGroup.visible = true; fishGroup.visible = true;
}

// 水洼（码头面，带同心涟漪）
const puddleMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:{value:0}, uReflection:{value:null},
    uColor:{value:new THREE.Color(0x245052)},
    uScale:{value:new THREE.Vector2(1/20,1/20)}, uOff:{value:new THREE.Vector2(0.5,0.5)},
  },
  vertexShader:`varying vec3 vWP; void main(){ vWP=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vWP,1.0); }`,
  fragmentShader:`
    precision highp float; uniform float uTime; uniform sampler2D uReflection;
    uniform vec3 uColor; uniform vec2 uScale,uOff; varying vec3 vWP;
    float r(vec2 n){return fract(sin(dot(n,vec2(12.9898,78.233)))*43758.5453);}
    void main(){
      vec2 p=vWP.xz; float t=uTime;
      float ring = 0.0;
      for(int i=0;i<4;i++){
        float rr = mod(t*0.6 + float(i)*0.25, 1.0);
        ring += smoothstep(0.9, 0.0, abs(1.0-rr*3.0) ) * 0.25;
      }
      vec2 refUV = p*uScale+uOff + vec2(sin(p.x+t)*0.02, cos(p.z+t)*0.02);
      vec3 ref = texture2D(uReflection, refUV).rgb;
      vec3 col = uColor + ref*0.5 + vec3(0.8,0.85,0.9)*ring*0.6;
      gl_FragColor = vec4(col, 0.55);
    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
});
const puddle = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32), puddleMat);
puddle.rotation.x = -Math.PI/2; puddle.position.set(6.0, 0.03, -12.5); scene.add(puddle);

// ============================================================
//  雨
// ============================================================
const rainMat = new THREE.PointsMaterial({
  size: 1.6, color: 0xdaf2ff, transparent:true, opacity:0.8,
  depthWrite:false, blending: THREE.AdditiveBlending,
});
const RAIN_N = 2600;
const rainGeo = new THREE.BufferGeometry();
const rPos = new Float32Array(RAIN_N*3);
for(let i=0;i<RAIN_N;i++){
  rPos[i*3]   = -B+Math.random()*2*B;
  rPos[i*3+1] = Math.random()*22 + 4;
  rPos[i*3+2] = -B+Math.random()*2*B;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rPos,3));
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

// ============================================================
//  船只（程序化）
// ============================================================
function buildBoat(x, z, scale, type){
  const g = new THREE.Group();
  const hullMat = M('#f4f8fa');
  const woodMat = M('#7a5238');
  const rustMat = M('#7a4a2a');
  const darkMat = M('#2a3138');
  const orangeMat = M('#e87030');
  // 船体
  const hull = new THREE.Mesh(new THREE.BoxGeometry(3.2*scale, 0.7*scale, 1.0*scale), hullMat);
  hull.position.y = 0.2*scale; g.add(hull);
  // 船底深色
  const keel = new THREE.Mesh(new THREE.BoxGeometry(3.0*scale, 0.12*scale, 0.8*scale), darkMat);
  keel.position.y = 0.02*scale; g.add(keel);
  // 船舷压条

composer.addPass(outlinePass);
outlinePass.selectedObjects = [];

// 收集需要描边的对象
function collectOutline(target){
  scene.traverse(o=>{ if(o.isMesh && o.material && !o.material.transparent && o!==water && o!==puddle && o!==skySphere){ target.push(o); } });
}
let outlineTargets = [];
collectOutline(outlineTargets);
outlinePass.selectedObjects = outlineTargets;

// ============================================================
//  视频导出接口
// ============================================================
const SHOTS = [
  { t0:0.00, t1:0.30, from:new THREE.Vector3(30,22,10), to:new THREE.Vector3(-2,1.0,-6), look:new THREE.Vector3(-4,0.5,-4) },   // 远景推进
  { t0:0.30, t1:0.58, from:new THREE.Vector3(-2,1.0,-6), to:new THREE.Vector3(-14,2.0,10), look:new THREE.Vector3(-12,0.8,12) }, // 中景沿防波堤
  { t0:0.58, t1:0.70, from:new THREE.Vector3(-14,2.0,10), to:new THREE.Vector3(-9,1.4,3), look:new THREE.Vector3(-8.5,0.9,2.0) },  // 特写海鸥
  { t0:0.70, t1:0.84, from:new THREE.Vector3(-9,1.4,3), to:new THREE.Vector3(4,1.2,-11), look:new THREE.Vector3(4.5,0.6,-12.5) },  // 中景仪器箱雨伞
  { t0:0.84, t1:1.00, from:new THREE.Vector3(4,1.2,-11), to:new THREE.Vector3(10,0.9,-15), look:new THREE.Vector3(9.5,0.4,-16.2) }, // 特写港猫
];
function shotCamera(t, out){
  let s = SHOTS[0];
  for(const sh of SHOTS){ if(t>=sh.t0-1e-6 && t<=sh.t1+1e-6){ s=sh; break; } }
  const lt = THREE.MathUtils.clamp((t-s.t0)/Math.max(1e-6, s.t1-s.t0), 0, 1);
  const e = 1-Math.pow(1-lt,3); // easeOutCubic
  out.position.lerpVectors(s.from, s.to, e);
  controls.target.lerpVectors(s.from, s.to, e);
  controls.target.lerp(s.look, 1, 0); // target 跟随
  // 简单：让相机看向 look 点
  const look = s.look.clone().lerpVectors(s.from, s.to, e);
  out.position.lerpVectors(s.from, s.to, e);
  controls.target.copy(look);
}
window.videoExport = {
  runs: ['tour'],
  _total: 0,
  async begin(runId, { fps=30 }={}){
    this._run = runId; this._fps = fps; this._total = Math.round(60*fps);
    this._mode = 'video';
    return { frames: this._total };
  },
  frame(i){
    if(this._mode!=='video') return;
    const t = i / this._total;
    const sceneNow = t*60;
    waterUniforms.uTime.value = sceneNow;
    puddleMat.uniforms.uTime.value = sceneNow;
    // 动态
    updateDynamics(sceneNow, true);
    shotCamera(t, camera);
    controls.update();
    renderReflection();
    composer.render();
  },
  end(){
    this._mode = 'idle';
    waterUniforms.uTime.value = performance.now()/1000;
    puddleMat.uniforms.uTime.value = performance.now()/1000;
  }
};

// ============================================================
//  动态更新
// ============================================================
let cloudCover = 0.0;      // 0 露日 1 遮日
let rainDensity = 1.0;
let wind = 0.0;

function updateDynamics(t, forVideo){
  // 云覆盖缓慢波动
  cloudCover = (Math.sin(t*0.18)+Math.sin(t*0.31+1.3)*0.6+1)*0.5;
  cloudCover = THREE.MathUtils.clamp(cloudCover, 0, 1);
  // 太阳强度
  const sunVal = 2.4 * (0.55 + 0.45*(1-cloudCover));
  sun.intensity = sunVal;
  fillLight.intensity = 0.5 + 0.2*(1-cloudCover);
  // 光柱不透明度
  const beamOp = 0.0 + 0.5*(1-cloudCover);
  beamGroup.children.forEach(c=>{ c.material.opacity = beamOp; });
  // 雨密度
  rainDensity = 0.7 + 0.6*Math.sin(t*0.12+2)+0.3*Math.sin(t*0.4+1);
  rainDensity = THREE.MathUtils.clamp(rainDensity, 0.4, 1.4);
  // 风
  wind = Math.sin(t*0.25)*0.6 + Math.sin(t*0.7+2)*0.3;

  // 云移动
  cloudGroup.children.forEach((c,i)=>{ c.position.x += 0.02*(1+i*0.15); c.position.z += 0.008; });

  // 雨点位置更新
  const pa = rain.geometry.attributes.position.array;
  for(let i=0;i<RAIN_N;i++){
    pa[i*3+1] -= 0.22 * rainDensity;
    pa[i*3]   += 0.02 * wind;
    pa[i*3+2] += 0.06 * wind;
    if(pa[i*3+1] < 0.5){ pa[i*3+1] = 24; pa[i*3] = -B+Math.random()*2*B; pa[i*3+2] = -B+Math.random()*2*B; }
  }
  rain.geometry.attributes.position.needsUpdate = true;
  rainMaterialUniforms; // noop
  rain.size = 1.4 * rainDensity;

  // 船只摇摆
  for(const b of boats){
    b.rotation.x = Math.sin(t*1.7 + b.userData.phase) * b.userData.rock;
    b.position.y = Math.sin(t*2.1 + b.userData.phase) * b.userData.rock*0.6;
  }
  // 海鸥飞/落
  for(let i=0;i<seagulls.length;i++){
    const s = seagulls[i];
    const tt = t*0.5 + s.userData.t;
    if(s.userData.fly){
      s.position.x = -10 + Math.sin(tt)*s.userData.amp;
      s.position.z = s.userData.baseZ + Math.cos(tt*0.7)*4;
      s.position.y = 3 + Math.abs(Math.sin(tt))*2.5 + Math.sin(tt*3)*0.4;
      s.rotation.y = Math.sin(tt)*1.2;
      s.rotation.z = Math.sin(tt*1.3)*0.4;
    } else {
      s.position.y = THREE.MathUtils.lerp(s.position.y, 0.9, 0.05);
    }
  }
  // 偶尔有海鸥降落 / 起飞
  if(forVideo || Math.random()<0.004){
    const idx = Math.floor(Math.random()*seagulls.length);
    seagulls[idx].userData.fly = !seagulls[idx].userData.fly;
  }

  // 港猫沿防波堤走
  const catT = THREE.MathUtils.clamp(Math.sin(t*0.25+1)*0.5+0.5, 0, 1);
  catGroup.position.x = THREE.MathUtils.lerp(9.5, -16.5, catT);
  catGroup.position.z = THREE.MathUtils.lerp(-16.2, 15.0, catT);
  catGroup.rotation.y = catT*Math.PI;
  catGroup.userData.onBreakwater = catT>0.5;

  // 出航船：偶尔绕防波堤一圈
  if(!departBoat.userData.flying && Math.sin(t*0.2+3) > 0.96){
    departBoat.userData.flying = true; departBoat.userData.pathT = 0;
  }
  if(departBoat.userData.flying){
    departBoat.userData.pathT += 0.004;
    const p = departBoat.userData.pathT;
    if(p >= 1){ departBoat.userData.flying=false; departBoat.userData.pathT=0; }
    else {
      // 路径：从 (-15,-2) 绕到 (-16,15) 再回 (-15,-2)
      const path = p<0.5
        ? new THREE.Vector3(THREE.MathUtils.lerp(-15,-16,p*2), THREE.MathUtils.lerp(-2,15,p*2), 0)
        : new THREE.Vector3(THREE.MathUtils.lerp(-16,-15,(p-0.5)*2), THREE.MathUtils.lerp(15,-2,(p-0.5)*2), 0);
      departBoat.position.copy(path);
      departBoat.rotation.y = -0.5 + Math.sin(p*Math.PI*2)*0.4;
    }
  }

  // 彩虹（雨稀薄时）
  const thin = rainDensity < 0.6;
  rainbowGroup.visible = thin && Math.random()<0.5;
  if(rainbowGroup.visible) rainbowGroup.position.y = 1.0 + Math.sin(t*2)*0.2;

  // 水面/水洼反射时间
  waterUniforms.uTime.value = t;
  puddleMat.uniforms.uTime.value = t;
}

// 彩虹（三渲二弧带）
const rainbowGroup = new THREE.Group(); scene.add(rainbowGroup);
for(let i=0;i<5;i++){
  const band = new THREE.Mesh(new THREE.RingGeometry(6+i*0.5, 6.15+i*0.5, 48, 4), M('#ff8060'));
  band.rotation.x = Math.PI/2; band.rotation.z = 0.4;
  const cols = [0xff6060,0xff9040,0xffd040,0x80e080,0x60a0ff];
  band.material = M(cols[i], {alpha:0.5, emissive:cols[i], emissiveIntensity:0.6, transparent:true});
  band.position.y = 0.05*i;
  rainbowGroup.add(band);
}
rainbowGroup.visible = false;

// ============================================================
//  主循环
// ============================================================
let last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = (now-last)/1000; last = now;
  const t = now/1000;
  if(videoExport._mode !== 'video'){
    updateDynamics(t, false);
  }
  controls.update();
  renderReflection();
  composer.render();
}
tick(performance.now());

// ============================================================
//  响应式
// ============================================================
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  outlinePass.resolution.set(window.innerWidth, window.innerHeight);
});
</script>
