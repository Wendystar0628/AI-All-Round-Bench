const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function saveHist(){undoStack.push(JSON.stringify({layers,t,selected,glyph:window.glyphText,warp,graphEdges}));if(undoStack.length>60)undoStack.shift();redoStack=[];$('#saveState').textContent='● 未保存'}function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function rgbaColor(hex,a){let m=String(hex||'').match(/^#?([0-9a-f]{6})$/i);if(!m)return `rgba(255,224,172,${a})`;let n=parseInt(m[1],16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}function phase(x,a,b){return clamp((x-a)/(b-a),0,1)}function smooth(x){return x*x*(3-2*x)}function graphLinked(a,b){return graphEdges.some(e=>e[0]===a&&e[1]===b)}function graphProducesGeometry(){return graphLinked('source','extrude')||(graphLinked('source','repeat')&&graphLinked('repeat','extrude'))}

function valAt(l,key){let p=l[key];if(!Array.isArray(p))return p;return p.map(v=>Number(v).toFixed(1)).join(' , ')}
function inspector(){const l=layers[selected];if(!l){$('#inspector').innerHTML='<div class="empty">选择一个图层以编辑属性</div>';return}if(tab==='effects'){l.effects||={blur:0,glow:0};$('#inspector').innerHTML=`<div class="prop-title">${l.name} &middot; &#x6548;&#x679c;&#x5806;&#x6808;</div><div class="subtle">&#x5bf9;&#x5f53;&#x524d;&#x9009;&#x4e2d;&#x56fe;&#x5c42;&#x751f;&#x6548;</div><div class="group"><div class="gtitle">&#x9ad8;&#x65af;&#x6a21;&#x7cca;</div><div class="row"><label>&#x534a;&#x5f84;</label><input id="fxBlur" class="field" type="range" min="0" max="24" value="${l.effects.blur}"></div><div class="subtle">0 &ndash; 24 px &middot; &#x5f71;&#x54cd;&#x672c;&#x56fe;&#x5c42;&#x6587;&#x5b57;&#x4e0e;&#x5f62;&#x72b6;</div></div><div class="group"><div class="gtitle">&#x53d1;&#x5149;</div><div class="row"><label>&#x5f3a;&#x5ea6;</label><input id="fxGlow" class="field" type="range" min="0" max="60" value="${l.effects.glow}"></div><button id="fxReset" style="width:100%">&#x91cd;&#x7f6e;&#x6548;&#x679c;</button></div>`;for(let id of ['fxBlur','fxGlow']){$('#'+id).onpointerdown=()=>saveHist();$('#'+id).oninput=e=>{l.effects[id==='fxBlur'?'blur':'glow']=Number(e.target.value);render()};}$('#fxReset').onclick=()=>{saveHist();l.effects={blur:0,glow:0};inspector();render()};return}if(tab==='mat'){l.material||={color:'#dba653',metal:.82,rough:.28,emit:.4,depth:34};$('#inspector').innerHTML=`<div class="prop-title">&#x8868;&#x9762;&#x6750;&#x8d28;</div><div class="subtle">&#x91d1;&#x5c5e;&#x5ea6;&#x3001;&#x7c97;&#x7cd9;&#x5ea6;&#x4e0e;&#x53d1;&#x5149;&#x5b9e;&#x65f6;&#x9a71;&#x52a8;&#x9884;&#x89c8;</div><div class="group"><div class="gtitle">&#x91d1;&#x5c5e;&#x8868;&#x9762;</div><div class="row"><label>&#x57fa;&#x7840;&#x8272;</label><input class="field" type="color" data-material="color" value="${l.material.color}"></div>${[['metal','&#x91d1;&#x5c5e;&#x5ea6;'],['rough','&#x7c97;&#x7cd9;&#x5ea6;'],['emit','&#x53d1;&#x5149;']].map(([key,label])=>`<div class="row"><label>${label}</label><input class="field" type="range" min="0" max="1" step=".01" data-material="${key}" value="${l.material[key]}"></div>`).join('')}</div><div class="group"><div class="gtitle">&#x5b9e;&#x4f53;&#x6324;&#x51fa;</div><div class="row"><label>&#x6df1;&#x5ea6;</label><input class="field" type="range" min="0" max="80" data-material="depth" value="${l.material.depth}"></div><div class="subtle">&#x53c2;&#x6570;&#x4f1a;&#x5e94;&#x7528;&#x4e8e;&#x5b57;&#x9762;&#x7684;&#x91d1;&#x5c5e;&#x8fb9;&#x7f18;&#x548c;&#x53d1;&#x5149;</div></div>`;$$('[data-material]').forEach(el=>{el.onpointerdown=()=>saveHist();el.oninput=()=>{l.material[el.dataset.material]=el.type==='color'?el.value:Number(el.value);render()}});return}
