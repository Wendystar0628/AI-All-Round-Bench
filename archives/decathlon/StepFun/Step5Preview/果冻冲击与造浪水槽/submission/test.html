<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#111;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script>
(async function () {
  const U = APP.util, R = APP.R;
  await R.init(document.getElementById('c'));
  const dpr = Math.min(devicePixelRatio || 1, 1);
  R.resize(innerWidth, innerHeight, dpr);
  addEventListener('resize', () => R.resize(innerWidth, innerHeight, dpr));
  const cam = new U.OrbitCam();
  cam.target = { x: 0, y: 0.5, z: 0 }; cam.dist = 4; cam.yaw = 0.9; cam.pitch = 0.32; cam.fov = 42 * U.DEG;
  const light = { dir: [0.45, 0.8, 0.4], intensity: 3.0, color: [1.0, 0.96, 0.9] };
  const env = { top: [0.30, 0.40, 0.58], bottom: [0.09, 0.10, 0.13], exposure: 1.05 };
  const m = U.m4id();
  function frame() {
    cam.computeMats(R.size()[0] / R.size()[1]);
    R.begin(cam, light, { center: [0, 0.5, 0], radius: 2.2, strength: 1 }, env);
    U.m4compose(0, -0.02, 0, 0, 0, 0, 6, 0.04, 6, m);
    R.pushOpaque(R.meshes.plane, { model: m, color: [0.55, 0.58, 0.62, 1], metallic: 0.0, roughness: 0.35, flags: 0 });
    U.m4compose(-0.55, 0.5, 0, 0, 0, 0, 0.7, 0.7, 0.7, m);
    R.pushOpaque(R.meshes.sphere, { model: m, color: [0.95, 0.95, 0.97, 1], metallic: 1.0, roughness: 0.12 });
    U.m4compose(0.55, 0.35, 0, 0, 0, 0, 0.5, 0.5, 0.5, m);
    R.pushOpaque(R.meshes.sphere, { model: m, color: [0.45, 0.42, 0.40, 1], metallic: 0.0, roughness: 0.85 });
    U.m4compose(0.0, 0.55, -0.5, 0, 0, 0, 1.1, 0.9, 0.9, m);
    R.pushGlass(R.meshes.box, { model: m, color: [0.7, 0.85, 0.95, 1], metallic: 0.0, roughness: 0.05 });
    R.present();
    requestAnimationFrame(frame);
  }
  frame();
  let drag = null;
  addEventListener('mousedown', e => drag = { x: e.clientX, y: e.clientY, b: e.button });
  addEventListener('mouseup', () => drag = null);
  addEventListener('mousemove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; if (drag.b === 2) cam.pan(dx, dy); else cam.orbit(dx, dy); });
  addEventListener('wheel', e => cam.zoom(e.deltaY));
  addEventListener('contextmenu', e => e.preventDefault());
})();
</script></body></html>
