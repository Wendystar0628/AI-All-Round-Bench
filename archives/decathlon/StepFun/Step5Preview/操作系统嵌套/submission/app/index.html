<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nested OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e14;
    font-family:"Microsoft YaHei","Segoe UI","PingFang SC",sans-serif;color:#e8ecf4;user-select:none}
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:100000;background:#0b0e14}
  #boot .logo{font-size:26px;font-weight:700;background:linear-gradient(135deg,#8b6cff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
  #boot .bar{width:280px;height:4px;background:#1c2433;border-radius:2px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#8b6cff,#ffd23f);animation:ld 1.1s infinite}
  @keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
  #boot .tip{color:#6b7794;font-size:12px}
  .sysime{position:fixed;opacity:0;z-index:10001;width:1px;height:1px;border:none;padding:0}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2b3550;border-radius:5px}
  ::-webkit-scrollbar-track{background:#0e1420}
  .tbbtn{background:#232d3f;border:1px solid #33405a;color:#e8ecf4;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
  .tbbtn:hover{background:#2f3c5c}
  .startitem{display:block;width:100%;text-align:left;background:#232d3f;border:1px solid #33405a;color:#e8ecf4;border-radius:6px;padding:5px 10px;font-size:12px;margin-bottom:4px;cursor:pointer}
  .startitem:hover{background:#2f3c5c}
</style>
</head>
<body>
<div id="boot"><div class="logo">嵌套操作系统</div><div class="bar"><i></i></div><div class="tip">正在装载内核程序与场景资源…</div></div>
<script type="module" src="js/boot.js"></script>
<script>
  // 启动画面移除
  setTimeout(()=>{const b=document.getElementById('boot'); if(b) b.remove();}, 2500);
  window.addEventListener('error', e => { console.error('[app]', e.message); });
</script>
</body>
</html>
