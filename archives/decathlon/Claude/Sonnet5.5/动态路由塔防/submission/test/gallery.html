<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style></head><body><canvas id="gl"></canvas>
<script src="../lib/three.min.js"></script><script src="../js/data.js"></script><script src="../js/maps.js"></script><script src="../js/core.js"></script><script src="../js/sim.js"></script><script src="../js/gfx.js"></script><script src="../js/models.js"></script>
<script>
var G=window.G, T=THREE; G.gfx.init(document.getElementById('gl'));
var sc=G.gfx.scene, cam=G.gfx.camera;
sc.background=new T.Color('#0a1424');
sc.add(new T.HemisphereLight(0xbcd8ff,0x203040,1.3)); var dl=new T.DirectionalLight(0xffffff,2.4); dl.position.set(5,10,6); dl.castShadow=true; dl.shadow.mapSize.set(2048,2048); var sh=dl.shadow.camera; sh.left=-16;sh.right=16;sh.top=10;sh.bottom=-10; sc.add(dl);
var floor=new T.Mesh(new T.PlaneGeometry(60,30),new T.MeshStandardMaterial({color:'#17243a',roughness:0.8})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; sc.add(floor);
var list=[]; var towers=[['firewall',1],['firewall',2],['honeypot',1],['honeypot','2A'],['honeypot','2B'],['airgap',1],['airgap',2],['interceptor',1],['interceptor','2A'],['interceptor','2B'],['sandbox',1],['sandbox',2],['repair',1],['repair',2]];
towers.forEach(function(t,i){ var lv=typeof t[1]==='string'?2:t[1], br=typeof t[1]==='string'?t[1][1]:null; var m=G.models.tower(t[0],lv,br,{onNode:false}); m.group.position.set(-6.5+i*1.0,0,-1.6); G.gfx.shadowize(m.group,true,true); sc.add(m.group); list.push({m:m,tw:1,i:i}); });
['worm','flooder','trojan','ransom','hotspot','packer'].forEach(function(t,i){ var m=G.models.enemy(t); m.group.position.set(-6+i*1.6,t==='hotspot'?1.6:0,1.2); sc.add(m.group); list.push({m:m,en:1,i:i,rev:t==='trojan'?(i%2):0}); });
['boss1','boss2','boss3'].forEach(function(t,i){ var m=G.models.enemy(t); m.group.position.set(-4+i*4,0,4.5); sc.add(m.group); list.push({m:m,en:1,i:i,boss:1}); });
var tr=G.models.enemy('trojan'); tr.group.position.set(5,0,1.2); sc.add(tr.group); list.push({m:tr,en:1,i:0,rev:1});
cam.position.set(0,6.5,11); cam.lookAt(0,0.4,1); var t=0;
function loop(){ t+=0.016; list.forEach(function(o){ var s={t:t,m:t*1.5,mv:1,atk:(Math.sin(t*3+o.i)>0.8)?1:0,hit:0,aimYaw:Math.sin(t),faceYaw:0,showFace:1,phase:1+Math.floor(t/4)%3,rev:o.rev!=null?o.rev:Math.abs(Math.sin(t*0.5)),harden:0,lure:2.4,healing:1,surge:Math.max(0,Math.sin(t))}; o.m.update(0.016,s); }); G.gfx.render(t); requestAnimationFrame(loop);} loop();
</script></body></html>
