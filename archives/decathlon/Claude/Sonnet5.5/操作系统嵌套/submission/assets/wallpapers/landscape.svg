<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a2a"/>
      <stop offset="0.35" stop-color="#2a1a63"/>
      <stop offset="0.62" stop-color="#7a3b98"/>
      <stop offset="0.8" stop-color="#e0667d"/>
      <stop offset="0.92" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffd36b" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ff9a52" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.25" stop-color="#b8517a"/>
      <stop offset="1" stop-color="#241552"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3f8f"/><stop offset="1" stop-color="#3a2468"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c7a"/><stop offset="1" stop-color="#26164f"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c1b57"/><stop offset="1" stop-color="#150d33"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.85">
    <circle cx="140" cy="90" r="1.6"/><circle cx="320" cy="160" r="1.2"/><circle cx="520" cy="60" r="1.8"/><circle cx="700" cy="140" r="1.1"/>
    <circle cx="880" cy="70" r="1.5"/><circle cx="1060" cy="120" r="1.2"/><circle cx="1260" cy="50" r="1.7"/><circle cx="1440" cy="150" r="1.2"/>
    <circle cx="1640" cy="80" r="1.6"/><circle cx="1800" cy="170" r="1.3"/><circle cx="260" cy="240" r="1"/><circle cx="980" cy="230" r="1.1"/>
    <circle cx="1560" cy="260" r="1"/><circle cx="420" cy="310" r="0.9"/><circle cx="1180" cy="300" r="0.9"/>
  </g>
  <!-- sun glow -->
  <circle cx="1240" cy="640" r="420" fill="url(#sun)"/>
  <circle cx="1240" cy="650" r="70" fill="#fff0b8"/>
  <!-- clouds -->
  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="420" cy="470" rx="260" ry="22" fill="#ffbfa0"/>
    <ellipse cx="560" cy="500" rx="190" ry="16" fill="#ffd9b0"/>
    <ellipse cx="1500" cy="450" rx="300" ry="20" fill="#ff9fa8"/>
    <ellipse cx="1650" cy="485" rx="200" ry="14" fill="#ffc9a6"/>
    <ellipse cx="960" cy="400" rx="230" ry="14" fill="#d78ac4"/>
  </g>
  <!-- far mountains -->
  <path d="M0 700 L140 620 L260 668 L420 560 L560 650 L720 590 L860 680 L1020 600 L1180 690 L1340 610 L1500 700 L1680 620 L1820 690 L1920 640 L1920 760 L0 760 Z" fill="url(#m1)" opacity="0.92"/>
  <path d="M0 740 L180 660 L320 720 L520 640 L700 730 L900 650 L1100 740 L1300 660 L1500 750 L1700 676 L1920 740 L1920 800 L0 800 Z" fill="url(#m2)"/>
  <!-- lake -->
  <rect x="0" y="760" width="1920" height="320" fill="url(#lake)"/>
  <!-- sun reflection -->
  <g opacity="0.75">
    <rect x="1180" y="772" width="120" height="6" rx="3" fill="#ffe7a0"/>
    <rect x="1200" y="796" width="80" height="5" rx="2.5" fill="#ffd27a"/>
    <rect x="1170" y="820" width="140" height="5" rx="2.5" fill="#ffbe66" opacity="0.8"/>
    <rect x="1210" y="848" width="60" height="4" rx="2" fill="#ff9a5a" opacity="0.7"/>
    <rect x="1150" y="880" width="180" height="4" rx="2" fill="#e8775a" opacity="0.5"/>
  </g>
  <!-- reflected mountains -->
  <path d="M0 800 L180 880 L320 830 L520 900 L700 820 L900 890 L1100 810 L1300 880 L1500 800 L1700 870 L1920 810 L1920 880 L0 880 Z" fill="#1b1040" opacity="0.35"/>
  <!-- near ridge left -->
  <path d="M0 820 L120 780 L240 800 L380 740 L520 800 L640 780 L760 840 L760 1080 L0 1080 Z" fill="url(#m3)"/>
  <!-- near ridge right -->
  <path d="M1920 800 L1780 760 L1660 790 L1540 730 L1400 800 L1300 790 L1220 850 L1220 1080 L1920 1080 Z" fill="url(#m3)"/>
  <!-- pines -->
  <g fill="#0f0a26">
    <path d="M90 840 l30 -110 l30 110 l-14 0 l24 -70 l-40 0 l-40 70z"/>
    <path d="M40 900 l40 -150 l40 150z"/>
    <path d="M170 920 l36 -130 l36 130z"/>
    <path d="M300 880 l30 -110 l30 110z"/>
    <path d="M1620 860 l36 -130 l36 130z"/>
    <path d="M1730 900 l42 -160 l42 160z"/>
    <path d="M1840 870 l32 -120 l32 120z"/>
    <path d="M1520 900 l28 -100 l28 100z"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#2a1648" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M820 330 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M900 290 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M760 280 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <!-- mist -->
  <rect x="0" y="740" width="1920" height="60" fill="#ffb98a" opacity="0.18" filter="url(#soft)"/>
</svg>
