<!doctype html><meta charset="utf-8"><body style="background:#000;color:#0f0;font:14px monospace"><pre id="o"></pre>
<script>
(async()=>{
 const o=document.getElementById('o');
 try{
 const a=await navigator.gpu.requestAdapter();
 const l={};for(const k in a.limits)l[k]=a.limits[k];
 const f=[...a.features];
 o.textContent=JSON.stringify({secure:isSecureContext,feat:f,limits:l,info:a.info&&{v:a.info.vendor,a:a.info.architecture,d:a.info.description}},null,1);
 }catch(e){o.textContent='ERR '+e}
})();
</script>
