<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果冻冲击 · 造浪水槽</title>
<style>
:root{
  --bg:#0b1118; --panel:rgba(14,22,32,.72); --panel2:rgba(255,255,255,.06); --line:rgba(160,200,230,.16);
  --text:#e8f0f7; --dim:#8da3b5; --accent:#ff7a8c; --accent2:#4fd6ff; --good:#7de0a3;
  --font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b10;overflow:hidden;font-family:var(--font);color:var(--text);user-select:none}
#view{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui.hidden{display:none}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);pointer-events:auto}
#top{position:absolute;left:18px;right:18px;top:14px;display:flex;align-items:center;gap:14px;pointer-events:none}
#brand{display:flex;align-items:center;gap:10px;padding:9px 14px;pointer-events:auto}
#brand .logo{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#ff7a8c,#4fd6ff);box-shadow:0 0 18px rgba(255,122,140,.5)}
#brand b{font-size:15px;letter-spacing:.5px}
#brand span{font-size:11px;color:var(--dim)}
#tabs{display:flex;gap:6px;padding:5px;pointer-events:auto}
.tab{padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--dim);transition:.18s;border:1px solid transparent}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.on{color:#fff;background:linear-gradient(135deg,rgba(255,122,140,.28),rgba(79,214,255,.22));border-color:rgba(255,255,255,.2)}
#topRight{margin-left:auto;display:flex;gap:8px;pointer-events:auto;padding:5px}
.btn{font:inherit;font-size:12.5px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px)}
.btn.on{background:linear-gradient(135deg,rgba(255,122,140,.35),rgba(79,214,255,.3));border-color:rgba(255,255,255,.35)}
.btn.primary{background:linear-gradient(135deg,#ff7a8c,#ff9a6c);border-color:transparent;color:#2a0b10;font-weight:700}
.btn.cool{background:linear-gradient(135deg,#4fd6ff,#6a9bff);border-color:transparent;color:#05202c;font-weight:700}
#side{position:absolute;left:18px;top:74px;width:290px;max-height:calc(100vh - 170px);overflow:auto;padding:14px 16px 12px}
#side h3{margin:2px 0 10px;font-size:13px;letter-spacing:1px;color:var(--accent2);font-weight:700;display:flex;align-items:center;gap:8px}
#side h3::after{content:"";flex:1;height:1px;background:var(--line)}
.row{margin:9px 0}
.row label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px}
.row label em{font-style:normal;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.14);outline:none;margin:5px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 10px rgba(255,122,140,.6);cursor:pointer}
.water input[type=range]::-webkit-slider-thumb{border-color:var(--accent2);box-shadow:0 0 10px rgba(79,214,255,.6)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.15s;color:var(--dim);min-width:48px}
.chip:hover{color:var(--text)}
.chip.on{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.14)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.btnrow{display:flex;gap:6px;margin:10px 0}
.btnrow .btn{flex:1;padding:9px 4px}
.sep{height:1px;background:var(--line);margin:12px 0}
.note{font-size:11px;color:var(--dim);line-height:1.55}
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:8px;align-items:center;padding:8px 10px;pointer-events:auto}
#bottom .grp{display:flex;gap:6px;align-items:center}
#bottom .vs{width:1px;height:22px;background:var(--line);margin:0 4px}
#demoBar{position:absolute;right:18px;top:74px;width:230px;padding:12px 14px}
#demoBar h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;color:var(--accent);font-weight:700}
.demoBtn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;font-size:12.5px;transition:.15s}
.demoBtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.demoBtn small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.demoBtn.on{border-color:var(--accent);background:rgba(255,122,140,.16)}
#stat{position:absolute;right:18px;bottom:16px;padding:8px 12px;font-size:11px;color:var(--dim);line-height:1.6;font-variant-numeric:tabular-nums;pointer-events:auto}
#stat b{color:var(--text);font-weight:600}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:8px 16px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
#demoHud{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);padding:7px 14px;font-size:12px;display:none;pointer-events:auto;min-width:300px}
#demoHud .bar{height:4px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
#demoHud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0a0f15;color:#ffb3bd;font-size:15px;text-align:center;padding:30px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080c12;color:var(--dim);font-size:14px;z-index:5;transition:opacity .5s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="ui">
  <div id="top">
    <div id="brand" class="glass"><div class="logo"></div><div><b>果冻冲击 · 造浪水槽</b><br><span>软体 · 刚体 · 流体的双向作用</span></div></div>
    <div id="tabs" class="glass">
      <div class="tab on" data-scene="jelly">① 重球冲击果冻</div>
      <div class="tab" data-scene="tank">② 多密度球与造浪水槽</div>
    </div>
    <div id="topRight" class="glass">
      <button class="btn" id="btnSound">🔇 音效：关</button>
      <button class="btn" id="btnDemoToggle">演示片段</button>
      <button class="btn" id="btnHide">隐藏界面 (H)</button>
    </div>
  </div>
  <div id="side" class="glass"></div>
  <div id="demoBar" class="glass" style="display:none">
    <h3>四段预置演示</h3>
    <button class="demoBtn" data-run="jelly-center">正中单击<small>jelly-center · 8 秒内</small></button>
    <button class="demoBtn" data-run="jelly-multi">连击击裂<small>jelly-multi · 10 秒内</small></button>
    <button class="demoBtn" data-run="jelly-offset">偏击滑移<small>jelly-offset · 8 秒内</small></button>
    <button class="demoBtn" data-run="tank-full">风浪全程<small>tank-full · 20 秒内</small></button>
    <button class="btn" id="btnDemoStop" style="width:100%;margin-top:6px">退出演示</button>
  </div>
  <div id="demoHud" class="glass"><span id="demoName"></span><div class="bar"><i id="demoBar2"></i></div></div>
  <div id="bottom" class="glass">
    <div class="grp"><button class="btn" id="btnPause">⏸ 暂停</button></div>
    <div class="vs"></div>
    <div class="grp" id="speedGrp">
      <button class="btn" data-speed="1">1×</button><button class="btn" data-speed="0.5">0.5×</button><button class="btn" data-speed="0.25">0.25×</button><button class="btn" data-speed="0.1">0.1×</button>
    </div>
    <div class="vs"></div>
    <div class="grp"><button class="btn" id="btnReset">重置</button><button class="btn" id="btnRerun">重新运行</button></div>
  </div>
  <div id="stat" class="glass"></div>
  <div id="toast" class="glass"></div>
</div>
<div id="fatal"></div>
<div id="loading">正在初始化 WebGPU 物理引擎…</div>

<script src="js/core.js"></script>
<script src="js/stage.js"></script>
<script src="js/jelly_sim.js"></script>
<script src="js/jelly_scene.js"></script>
<script src="js/water_sim.js"></script>
<script src="js/water_scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
