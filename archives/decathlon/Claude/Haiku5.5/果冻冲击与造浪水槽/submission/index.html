<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果冻冲击与造浪水槽</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <header class="topbar">
    <div class="brand">
      <h1>果冻冲击与造浪水槽</h1>
      <span id="scene-title" class="scene-title"></span>
    </div>
    <nav class="tabs">
      <button class="tab" data-scene="jelly">场景一 · 重球冲击果冻</button>
      <button class="tab" data-scene="tank">场景二 · 造浪水槽</button>
    </nav>
  </header>

  <aside class="panel" data-panel="jelly">
    <section class="card">
      <h2>冲击</h2>
      <div class="btn-row">
        <button data-act="center">正中冲击</button>
        <button data-act="offset">偏心冲击</button>
        <button data-act="multi">连续冲击</button>
      </div>
      <p class="hint">按当前重球质量、下落高度放下重球；连续冲击为三记逐渐加重的冲击。</p>
    </section>
    <section class="card">
      <h2>果冻</h2>
      <label class="slider"><span>软硬（软 → 硬）</span><input id="ui-soft" type="range" min="0" max="1" step="0.01" value="0.6"><output id="ui-soft-val"></output></label>
      <label class="slider"><span>结实程度（弱 → 强）</span><input id="ui-firm" type="range" min="0" max="1" step="0.01" value="0.5"><output id="ui-firm-val"></output></label>
    </section>
    <section class="card">
      <h2>重球</h2>
      <label class="slider"><span>质量</span><input id="ui-mass" type="range" min="0.5" max="8" step="0.1" value="3"><output id="ui-mass-val"></output></label>
      <label class="slider"><span>下落高度</span><input id="ui-height" type="range" min="0.05" max="1.2" step="0.01" value="0.4"><output id="ui-height-val"></output></label>
      <label class="slider"><span>半径</span><input id="ui-radius" type="range" min="0.03" max="0.08" step="0.001" value="0.055"><output id="ui-radius-val"></output></label>
      <div class="radio-row">
        <span>材质</span>
        <label><input type="radio" name="ballMat" value="stone" checked> 石质</label>
        <label><input type="radio" name="ballMat" value="metal"> 金属</label>
      </div>
    </section>
    <section class="card">
      <h2>演示</h2>
      <div class="btn-row">
        <button data-demo="jelly-center">正中单击</button>
        <button data-demo="jelly-multi">连击</button>
        <button data-demo="jelly-offset">偏击</button>
      </div>
    </section>
  </aside>

  <aside class="panel hidden" data-panel="tank">
    <section class="card">
      <h2>造浪</h2>
      <div class="btn-row">
        <button id="btn-wave">开始造浪</button>
      </div>
      <label class="slider"><span>幅度</span><input id="tank-amp" type="range" min="0" max="1" step="0.01" value="0.3"><output id="tank-amp-val"></output></label>
      <label class="slider"><span>频率</span><input id="tank-freq" type="range" min="0.3" max="1" step="0.01" value="0.5"><output id="tank-freq-val"></output></label>
    </section>
    <section class="card">
      <h2>小球</h2>
      <div class="btn-row">
        <button id="btn-drop">释放一批小球</button>
      </div>
      <p class="hint">四组密度相同尺寸的小球：低密度上浮、中性悬浮、高密度沉底。</p>
      <label class="slider"><span class="dot g0">低密度</span><input id="tank-d0" type="range" min="0.2" max="0.9" step="0.01" value="0.5"><output id="tank-d0-val"></output></label>
      <label class="slider"><span class="dot g1">偏低</span><input id="tank-d1" type="range" min="0.5" max="1.2" step="0.01" value="0.85"><output id="tank-d1-val"></output></label>
      <label class="slider"><span class="dot g2">中性</span><input id="tank-d2" type="range" min="0.7" max="1.5" step="0.01" value="1.0"><output id="tank-d2-val"></output></label>
      <label class="slider"><span class="dot g3">高密度</span><input id="tank-d3" type="range" min="1.5" max="3.5" step="0.01" value="2.5"><output id="tank-d3-val"></output></label>
    </section>
    <section class="card">
      <h2>演示</h2>
      <div class="btn-row">
        <button data-demo="tank-full">风浪</button>
      </div>
    </section>
  </aside>

  <footer class="transport">
    <div class="btn-row">
      <button id="btn-pause">暂停</button>
      <button id="btn-slow">慢放</button>
      <button id="btn-reset">重置</button>
      <button id="btn-sound">声音：开</button>
    </div>
    <div class="status-line">
      <span id="status"></span>
      <span id="crack-count" class="crack"></span>
    </div>
  </footer>
</div>

<div id="error" class="error hidden"></div>

<script src="js/core/math.js"></script>
<script src="js/core/gpu.js"></script>
<script src="js/core/post.js"></script>
<script src="js/core/timeline.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/scenes/jelly-mesh.js"></script>
<script src="js/scenes/jelly-shaders.js"></script>
<script src="js/scenes/jelly.js"></script>
<script src="js/scenes/jelly-demos.js"></script>
<script src="js/scenes/tank-shaders.js"></script>
<script src="js/scenes/tank.js"></script>
<script src="js/scenes/tank-demos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
