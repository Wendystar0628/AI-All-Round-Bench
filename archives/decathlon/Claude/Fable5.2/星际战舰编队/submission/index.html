  #boot i { display: block; margin: 10px auto 0; width: 220px; height: 2px; background: rgba(111,214,230,.16); position: relative; overflow: hidden; }
  #boot i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #6fd6e6; transition: width .25s; }
</style>
