<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body>
<canvas id="c"></canvas>
<script src="../../lib/three.bundle.js"></script>
<script src="../../js/core.js"></script><script src="../../js/maps.js"></script><script src="../../js/path.js"></script><script src="../../js/data.js"></script><script src="../../js/sim.js"></script><script src="../../js/sim2.js"></script>
<script src="../../js/gfx_core.js"></script><script src="../../js/gfx_map.js"></script><script src="../../js/gfx_units.js"></script><script src="../../js/gfx_fx.js"></script><script src="../../js/gfx_view.js"></script>
<script>
const q = new URLSearchParams(location.search); const mapId = q.get('map') || 'intranet';
const stage = new TD.GX.Stage(document.getElementById('c'));
const sim = new TD.Sim(mapId);
const view = new TD.GX.BattleView(stage, sim); const ms = view.map;
function rs(){ stage.resize(innerWidth, innerHeight, devicePixelRatio); if (window.noFit) return; stage.fit(-ms.ox-0.5, ms.ox+0.5, -ms.oz-0.5, ms.oz+0.5); }
rs(); addEventListener('resize', rs);
window.errs = []; window.onerror = (m, s, l) => { errs.push(m + ' @' + l); };
let t0 = performance.now(), last = t0; window.speed = 1;
function loop(){ const now = performance.now(); const t = (now-t0)/1000; let n = Math.min(8, Math.round((now-last)/1000*60*speed)); last = now; try { for (let i=0;i<n;i++) sim.step(); view.update(n*TD.TICK, 0.016, t); stage.render(0.016); } catch(e) { if (errs.length < 5) errs.push(String(e.stack||e)); } requestAnimationFrame(loop); }
loop();
</script></body></html>
