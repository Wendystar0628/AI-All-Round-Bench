<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>果冻冲击与造浪水槽</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: rgba(16, 20, 26, .72); --line: rgba(255, 255, 255, .10); --txt: #e8edf2; --dim: #93a0ad;
    --amber: #ffb454; --teal: #5fd4c4; --red: #ff6b5e;
    --font: "HarmonyOS Sans SC", "MiSans", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; color: var(--txt); font-family: var(--font); font-size: 13px; user-select: none; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .panel { position: fixed; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 10px 40px rgba(0, 0, 0, .35); }
  #head { top: 16px; left: 16px; padding: 12px 14px 12px 16px; display: flex; align-items: center; gap: 18px; }
  #head h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .06em; }
  #head h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--dim); letter-spacing: .12em; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; background: rgba(255, 255, 255, .05); padding: 4px; border-radius: 10px; }
  .tab { padding: 7px 14px; border-radius: 7px; cursor: pointer; color: var(--dim); transition: .18s; white-space: nowrap; }
  .tab b { font-family: var(--mono); font-weight: 500; margin-right: 6px; opacity: .7; }
  .tab:hover { color: var(--txt); }
  .tab.on { background: linear-gradient(180deg, rgba(255, 180, 84, .95), rgba(240, 150, 50, .95)); color: #1a1206; font-weight: 600; }
  #left { top: 92px; left: 16px; width: 268px; padding: 14px; }
  #right { top: 16px; right: 16px; width: 300px; padding: 14px 16px; max-height: calc(100vh - 110px); overflow: auto; }
  h2 { margin: 0 0 10px; font-size: 11px; font-weight: 500; color: var(--dim); letter-spacing: .22em; display: flex; align-items: center; gap: 8px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  h2:not(:first-child) { margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--txt); font: inherit; cursor: pointer; transition: .15s; white-space: nowrap; }
  .btn:hover { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); }
  .btn:active { transform: translateY(1px); }
  .btn.pri { background: linear-gradient(180deg, rgba(255, 180, 84, .22), rgba(255, 180, 84, .10)); border-color: rgba(255, 180, 84, .5); color: #ffd9a3; }
  .btn.pri:hover { background: rgba(255, 180, 84, .32); }
  .btn.on { background: rgba(95, 212, 196, .2); border-color: rgba(95, 212, 196, .6); color: #b8f1e8; }
  .btn.warn { border-color: rgba(255, 107, 94, .5); color: #ffc0ba; }
  .row { display: flex; gap: 8px; }
  .row > .btn { flex: 1; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip { flex: 1; padding: 7px 4px 6px; border-radius: 9px; border: 1px solid var(--line); text-align: center; cursor: pointer; color: var(--dim); font-size: 12px; transition: .15s; line-height: 1.25; }
  .chip i { display: block; width: 18px; height: 18px; margin: 0 auto 4px; border-radius: 5px; }
  .chip.on { border-color: var(--amber); color: var(--txt); background: rgba(255, 180, 84, .10); }
  .hint { color: var(--dim); font-size: 11.5px; line-height: 1.6; margin: 8px 0 0; }
  .demo { display: flex; align-items: center; width: 100%; height: 38px; margin-top: 6px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); cursor: pointer; transition: .15s; position: relative; overflow: hidden; color: var(--txt); font: inherit; text-align: left; }
  .demo:hover { background: rgba(255, 255, 255, .10); }
  .demo em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }
  .demo s { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--amber); text-decoration: none; }
  .demo .ic { width: 0; height: 0; border-left: 8px solid var(--amber); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-right: 10px; }
  .demo.playing { border-color: rgba(255, 180, 84, .6); background: rgba(255, 180, 84, .10); }
  .sl { margin: 0 0 11px; }
  .sl label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .sl label span { color: var(--txt); }
  .sl label output { font-family: var(--mono); font-size: 12px; color: var(--amber); }
  .sl .ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--amber) var(--p, 50%), rgba(255, 255, 255, .14) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255, 180, 84, .35), 0 2px 6px rgba(0, 0, 0, .5); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .35); }
  .seg { display: flex; background: rgba(255, 255, 255, .05); border-radius: 9px; padding: 3px; gap: 3px; margin-bottom: 11px; }
  .seg div { flex: 1; text-align: center; padding: 6px 0; border-radius: 7px; cursor: pointer; color: var(--dim); transition: .15s; }
  .seg div.on { background: rgba(255, 255, 255, .14); color: var(--txt); }
  #bar { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
  #bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #stat { font-family: var(--mono); font-size: 11.5px; color: var(--dim); padding: 0 8px; min-width: 250px; text-align: right; white-space: nowrap; }
  #keys { left: 16px; bottom: 16px; padding: 9px 13px; color: var(--dim); font-size: 11.5px; line-height: 1.7; }
  kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--txt); }
  #toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); padding: 9px 16px; border-radius: 10px; background: rgba(20, 24, 30, .86); border: 1px solid var(--line); color: var(--txt); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #loading { position: fixed; inset: 0; background: #0b0e12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; transition: opacity .5s; }
  #loading b { font-size: 20px; letter-spacing: .3em; font-weight: 500; }
  #loading span { color: var(--dim); letter-spacing: .1em; }
  #loading.err span { color: var(--red); max-width: 70vw; text-align: center; line-height: 1.7; }
  body.exporting .panel, body.exporting #toast, body.exporting #loading { display: none !important; }
  body.exporting #stage { cursor: default; }
  .s0 .only1, .s1 .only0 { display: none !important; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .15); border-radius: 3px; }
</style>
</head>
<body class="s0">
<canvas id="stage"></canvas>

<div id="head" class="panel">
  <h1>果冻冲击与造浪水槽<small>SOFT · RIGID · LIQUID</small></h1>
  <div class="tabs">
    <div class="tab on" data-scene="0"><b>01</b>重球冲击果冻</div>
    <div class="tab" data-scene="1"><b>02</b>多密度球与造浪水槽</div>
  </div>
</div>

<div id="left" class="panel">
  <div class="only0">
    <h2>目标果冻</h2>
    <div class="chips" id="jellyChips"></div>
    <h2>三种冲击</h2>
    <div class="grid3">
      <button class="btn pri" id="hitCenter" title="重球正对果冻落下">正中</button>
      <button class="btn pri" id="hitOffset" title="球偏离中心、斜向撞上果冻">偏心</button>
      <button class="btn pri" id="hitMulti" title="多颗球先后落下，一记比一记重">连续</button>
    </div>
    <p class="hint">同一颗球落在软硬、形状不同的果冻上，结局不同；调低“结实程度”或加重冲击，果冻由回弹变为开裂、砸开。</p>
  </div>
  <div class="only1">
    <h2>小球与造浪</h2>
    <div class="row">
      <button class="btn pri" id="dropBalls">释放小球</button>
      <button class="btn pri" id="waveToggle">开始造浪</button>
    </div>
    <p class="hint">五组同尺寸小球按密度分化：浮球随浪峰前推，中性球随水流往复，重球沿槽底滚动。幅度调高后浪变陡、翻卷、破碎。</p>
  </div>
  <h2>预置演示</h2>
  <div id="demos"></div>
</div>

<div id="right" class="panel">
  <div class="only0" id="p0"></div>
  <div class="only1" id="p1"></div>
</div>

<div id="bar" class="panel">
  <button class="btn" id="btnPause" style="width:78px">暂停</button>
  <button class="btn" id="btnSlow" style="width:92px">慢放 1×</button>
  <div class="sep"></div>
  <button class="btn" id="btnReset">重置</button>
  <button class="btn" id="btnRerun">重新运行</button>
  <div class="sep"></div>
  <button class="btn" id="btnSound" style="width:86px">声音 关</button>
  <button class="btn" id="btnCam" title="恢复默认视角">视角复位</button>
  <div id="stat"></div>
</div>

<div id="keys" class="panel">
  <kbd>左键拖动</kbd> 环绕　<kbd>右键拖动</kbd> 平移　<kbd>滚轮</kbd> 缩放<br>
  <kbd>空格</kbd> 暂停　<kbd>S</kbd> 慢放　<kbd>R</kbd> 重置　<kbd>1</kbd><kbd>2</kbd> 切换场景　<kbd>M</kbd> 声音
</div>

<div id="toast"></div>
<div id="loading"><b>果冻冲击与造浪水槽</b><span id="loadMsg">正在初始化 WebGPU 与物理求解器…</span></div>

<script src="js/core.js"></script>
<script src="js/wgsl_common.js"></script>
<script src="js/water.js"></script>
<script src="js/jelly.js"></script>
<script src="js/render_shaders.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/demos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
