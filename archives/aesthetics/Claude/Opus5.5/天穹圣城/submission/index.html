<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天穹圣城</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c9dc; }
  body { background: linear-gradient(180deg, #5d86c4 0%, #a9bfdc 46%, #e9dfd2 62%, #d8d6e2 100%); }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 1.6s ease; touch-action: none; cursor: grab; }
  #stage.ready { opacity: 1; }
  #stage:active { cursor: grabbing; }
  /* viewpoint switcher */
  #vp { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; user-select: none;
        font-family: "Noto Serif SC", "Source Han Serif CN", "Songti SC", serif; color: #f6ecd6;
        opacity: 0; transition: opacity 1.2s ease 0.6s; }
  #vp.ready { opacity: 1; }
  body.export #vp { display: none !important; }
  #vp .bar { display: flex; align-items: center; gap: 2px; padding: 5px 6px; border-radius: 999px;
             background: linear-gradient(180deg, rgba(28,36,58,0.42), rgba(18,22,38,0.55));
             backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
             box-shadow: 0 6px 24px rgba(10,14,30,0.28), inset 0 0 0 1px rgba(232,206,150,0.30); }
  #vp button { all: unset; cursor: pointer; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
               color: #ecd9ad; font-size: 15px; transition: background .25s, color .25s; }
  #vp button:hover { background: rgba(236,217,173,0.16); color: #fff6e0; }
  #vp .name { min-width: 168px; padding: 0 10px; text-align: center; letter-spacing: 0.18em; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  #vp .name .idx { font-family: "Cormorant Garamond", "EB Garamond", serif; font-size: 13px; color: #d9bd7e; letter-spacing: 0.06em; margin-right: 10px; font-style: italic; }
  #vp .list { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(6px); width: 372px;
              display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; padding: 12px 12px 10px; border-radius: 14px;
              background: linear-gradient(180deg, rgba(26,32,54,0.58), rgba(16,20,36,0.70));
              backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
              box-shadow: 0 10px 30px rgba(10,14,30,0.32), inset 0 0 0 1px rgba(232,206,150,0.26);
              opacity: 0; pointer-events: none; transition: opacity .28s ease, transform .28s ease; }
  #vp.open .list { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #vp .item { padding: 5px 8px; border-radius: 7px; font-size: 13px; letter-spacing: 0.1em; cursor: pointer; color: #e9dcc0; white-space: nowrap; transition: background .2s, color .2s; }
  #vp .item:hover { background: rgba(236,217,173,0.13); color: #fff7e4; }
  #vp .item.on { color: #ffe6a8; background: rgba(236,200,120,0.16); }
  #vp .item .k { display: inline-block; width: 22px; font-family: "Cormorant Garamond", serif; font-style: italic; color: #c8ab70; font-size: 12px; }
  #vp .hint { grid-column: 1 / span 2; margin-top: 6px; padding-top: 7px; border-top: 1px solid rgba(232,206,150,0.18); font-size: 11px; color: rgba(233,220,192,0.62); letter-spacing: 0.08em; text-align: center; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vp"></div>
<script src="app.js"></script>
</body>
</html>
