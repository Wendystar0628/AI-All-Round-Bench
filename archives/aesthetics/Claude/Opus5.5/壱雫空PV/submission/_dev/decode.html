<!doctype html>
<meta charset="utf-8">
<title>decode</title>
<script>
async function run(sr) {
  const buf = await (await fetch('../assets/hitoshizuku.mp3')).arrayBuffer();
  const ac = new OfflineAudioContext(2, 10, sr);
  const ab = await ac.decodeAudioData(buf);
  const n = ab.length;
  const L = ab.getChannelData(0), R = ab.numberOfChannels > 1 ? ab.getChannelData(1) : L;
  // save stereo interleaved float32
  const out = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) { out[2 * i] = L[i]; out[2 * i + 1] = R[i]; }
  const r = await fetch('/save?name=pcm_' + sr + '.f32', { method: 'POST', body: out.buffer });
  return { sr: ab.sampleRate, ch: ab.numberOfChannels, len: n, dur: ab.duration, saved: await r.text() };
}
</script>
