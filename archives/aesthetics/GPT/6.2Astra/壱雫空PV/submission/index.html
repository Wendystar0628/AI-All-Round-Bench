<body>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 14 8-14 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z" fill="currentColor" stroke="none"/></symbol>

    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 0 6 6m0-6-6 6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6M9 21H3v-6"/></symbol>
    <symbol id="i-small" viewBox="0 0 24 24"><path d="M9 3v6H3m12-6v6h6m0 6h-6v6M3 15h6v6"/></symbol>

  <div class="archive">
    <header class="mast">
      <div class="identity"><span class="brand">MyGO!!!!!</span><span class="mast-rule"></span><span class="mast-title">FILM ARCHIVE</span></div>
      <div class="edition"><span class="inks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span>映像作品集</span><span class="mast-rule"></span><span class="catalog">VOL. 001</span></div>
    </header>
    <main class="deck" aria-label="壱雫空 ミュージックフィルム">
      <h1 class="sr-only">壱雫空 — MyGO!!!!!</h1>
      <div class="frame" id="stage">
        <canvas id="film" width="1280" height="720" aria-label="MyGO!!!!!「壱雫空」ミュージックフィルム"></canvas>
        <button id="launch" class="launch" aria-label="壱雫空を再生 / Play film"><span class="launch-disc"><svg><use href="#i-play"/></svg></span>PLAY FILM<span class="launch-jp">再生</span></button>
      </div>
      <section class="transport" aria-label="再生コントロール">
        <div class="timeline" id="rail">
          <div class="rail-line"><span id="railFill"></span></div><div class="chapter-ticks" id="ticks"></div>
          <input id="seek" type="range" min="0" max="81.43" step=".001" value="0" aria-label="再生位置">
          <output id="scrubTip" hidden></output>
        </div>
        <div class="control-row">
          <button class="icon-btn primary" id="play" title="再生 / 一時停止（Space）" aria-label="再生"><svg><use href="#i-play"/></svg></button>
          <span class="clock"><b id="now">00:00</b><span>/</span><span id="length">01:21</span></span>
          <span class="separator"></span>
          <span class="section-name" id="sectionName">Opening</span>
          <span class="cut">CUT <b id="cutNumber">01</b><span> / 36</span></span>
          <span class="grow"></span>
          <button class="icon-btn" id="mute" title="ミュート（M）" aria-label="ミュート"><svg><use href="#i-speaker"/></svg></button>
          <input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="音量">
          <span class="separator"></span>
          <button class="icon-btn" id="fullscreen" title="全画面（F）" aria-label="全画面"><svg><use href="#i-expand"/></svg></button>
        </div>
      </section>
    </main>
    <footer class="folio"><span><b>01</b> / 壱雫空 <i>Hitoshizuku</i></span><span class="foot-right"><svg><use href="#i-disc"/></svg> STEREO <span>·</span> 204 BPM</span></footer>

  <audio id="track" preload="auto" src="素材/壱雫空 - MyGO!!!!!（半曲）.mp3"></audio>

  <script defer src="js/verse.js"></script>
  <script defer src="js/space.js"></script>
  <script defer src="js/chorus.js"></script>
  <script defer src="js/player.js"></script>
