<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋庭观星画室</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e5e4d3;color:#413e33}#sky,#stage,.grain{position:absolute;inset:0;width:100%;height:100%}#stage{cursor:grab;touch-action:none}#stage:active{cursor:grabbing}.grain{pointer-events:none;opacity:.085;mix-blend-mode:multiply}nav{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:"Songti SC","SimSun",serif}button{font:inherit;color:inherit;cursor:pointer}#bar{display:flex;align-items:center;border:1px solid #9d92776e;border-radius:7px;background:#faf5e9ee;box-shadow:0 3px 14px #56564318;padding:4px}#bar button{background:none;border:0;height:33px}#bar button:hover,#menu button:hover{background:#d5c8a64a}#prev,#next{width:32px;font:20px Georgia!important}#choose{display:flex;gap:11px;align-items:center;border-left:1px solid #cfc6b3!important;border-right:1px solid #cfc6b3!important;padding:0 16px;font-size:14px;letter-spacing:2px}#count{font:10px Georgia;color:#89775a;letter-spacing:1px}#menu{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:430px;padding:12px;border:1px solid #c4b99f;background:#fbf6eaf5;box-shadow:0 7px 24px #3332;border-radius:7px;display:grid;grid-template-columns:1fr 1fr}#menu[hidden]{display:none}#menu button{text-align:left;background:none;border:0;padding:9px;font-size:13px}#menu small{color:#978863;font:10px Georgia;margin-right:10px}#menu .active{color:#a0472c}button:focus-visible{outline:2px solid #a77944}
</style></head><body><canvas id="sky"></canvas><canvas id="stage" role="img" aria-label="秋日神社旁的观星画室，可拖动环绕并用滚轮缩放"></canvas><canvas class="grain" id="grain"></canvas><nav><div id="menu" hidden></div><div id="bar"><button id="prev" aria-label="上一个观景点">‹</button><button id="choose" aria-label="选择观景点" aria-expanded="false"><span style="color:#a45b36">✧</span><b id="name">全景</b><span id="count">01 / 20</span><span style="font-size:9px">▴</span></button><button id="next" aria-label="下一个观景点">›</button></div></nav><script src="three.min.js"></script><script src="world.js"></script><script src="garden.js"></script><script src="atelier.js"></script><script src="details.js"></script><script src="season.js"></script><script src="courtyard.js"></script><script src="viewer.js"></script></body></html>
