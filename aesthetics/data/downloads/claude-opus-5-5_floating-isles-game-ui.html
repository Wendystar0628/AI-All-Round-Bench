      const big = i % (opts.major || 6) === 0;
      const r0 = r - (big ? r * 0.1 : r * 0.05), r1 = r;
      p += `M${(r0 * Math.cos(a)).toFixed(2)} ${(r0 * Math.sin(a)).toFixed(2)}L${(r1 * Math.cos(a)).toFixed(2)} ${(r1 * Math.sin(a)).toFixed(2)}`;
    }
    return p;
  };
  G.headRing = () => `<svg class="ring" viewBox="-50 -50 100 100"><circle r="47" fill="rgba(8,18,44,.8)" stroke="rgba(255,226,154,.65)" stroke-width="1.4"/><circle r="40" fill="none" stroke="rgba(255,226,154,.3)" stroke-width=".8"/><path d="${G.astroRing(46, { ticks: 48, major: 4 })}" stroke="rgba(255,226,154,.7)" stroke-width="1"/><path d="${G.star4(0, -47, 6)}" fill="#ffe29a"/></svg>`;

  G.scrHead = (title, en, icon, res = true) => `
    <header class="scr-head">
      <div class="sh-emb">${G.headRing()}${G.icon(icon)}</div>
      <div class="sh-titles"><h1>${title}</h1><em>${en}</em></div>
      <div class="sh-line"></div>
      ${res ? `<div class="sh-res">
        <div class="res-chip">${G.icon('ui-flag')}<small>空行者等级</small>87</div>
        <div class="res-chip">${G.icon('it-coin')}<small>星币</small>1,284,500</div>
      </div>` : ''}
    </header>`;

  G.keybar = (items, left) =>
    `<div class="keybar">${left ? `<span class="kh left">${left}</span>` : ''}${items
      .map((it) => `<span class="kh" ${it.act ? `data-act="${it.act}"` : ''}>${it.k.map((k) => `<kbd>${k}</kbd>`).join('')}${it.t}</span>`)
      .join('')}</div>`;

  G.itemTile = (id, qty, extra = '') => {
    const it = D().ITEMS[id];
    return `<div class="itile r-${it.r} ${extra}" data-item="${id}">${G.rarityPips(it.r)}${G.icon(it.icon)}${it.el ? G.elBadge(it.el, 'iel') : ''}${qty ? `<span class="iq">×${qty}</span>` : ''}</div>`;
  };

  // 属性 + 名称
  G.elTag = (el) => `<span class="eltag el-${el}">${G.elBadge(el)}<b>${D().ELEMENTS[el].name}</b></span>`;
  G.wpTag = (w) => `<span class="wptag">${G.icon('w-' + w)}<b>${D().WEAPONS[w].name}</b></span>`;

  /* ---------- 界面目录 ---------- */
  G.TOC = {
    el: null,
    items: [
      { id: 'title', n: '4.1', name: '标题画面', en: 'TITLE' },
      { id: 'quest', n: '4.2', name: '任务柜台', en: 'QUESTS' },
      { id: 'party', n: '4.3', name: '编队与养成', en: 'PARTY' },
      { id: 'battle', n: '4.4', name: '战斗画面', en: 'BATTLE' },
      { id: 'ult', n: '4.5', name: '奥义与连锁奥义', en: 'CHAIN' },
      { id: 'results', n: '4.6', name: '结算画面', en: 'RESULTS' },
      { id: 'story', n: '4.7', name: '剧情画面', en: 'STORY' },
    ],
    init() {
      const el = (this.el = G.$('#toc'));
      el.innerHTML = `<button class="toc-btn" type="button"><svg viewBox="0 0 48 48"><path d="M8 11h32v4H8zM8 22h32v4H8zM8 33h32v4H8z"/></svg><span>界面目录</span></button>
        <div class="toc-list"><div class="tt">SCREEN INDEX</div>
        ${this.items.map((it) => `<a data-go="${it.id}"><i>${it.n}</i>${it.name}<em>${it.en}</em></a>`).join('')}
        <hr><a class="tour" data-go="tour"><svg viewBox="0 0 48 48"><path d="M13 7.5l26 16.5-26 16.5z"/></svg>播放演示录像<em>TOUR</em></a></div>`;
      const btn = el.querySelector('.toc-btn');
      btn.addEventListener('click', (e) => { e.stopPropagation(); el.classList.toggle('open'); });
      document.addEventListener('click', (e) => { if (!el.contains(e.target)) el.classList.remove('open'); });
      el.querySelectorAll('a[data-go]').forEach((a) =>
        a.addEventListener('click', (e) => {
          e.stopPropagation();
          el.classList.remove('open');
          this.jump(a.dataset.go);
        })
      );
    },
    jump(id) {
      if (G.exporting) return;
      if (G.touring && G.Tour) G.Tour.stopLive(true);
      G.Trans.cancel();
      if (G.App.scene) { G.cancelOwner(G.App.scene); G.App.scene._leaving = true; }
      G.$('#overlay').innerHTML = '';
      if (id === 'tour') { G.Tour.playLive(); return; }
      G.resetState();
      if (id === 'party') G.state.party = ['erin', 'rock', 'thea', 'rin'];
      if (id === 'battle' || id === 'ult' || id === 'results') G.state.party = ['erin', 'rock', 'thea', 'baldo'];
      const map = { ult: ['battle', { start: 'chain' }], battle: ['battle', {}], title: ['title', {}], quest: ['quest', { tier: 'extreme', sel: 'x1' }], party: ['party', {}], results: ['results', {}], story: ['story', {}] };
      const [sid, params] = map[id];
      G.App.go(sid, params, 'fade');
    },
    mark(sceneId) {
      if (!this.el) return;
      this.el.querySelectorAll('a[data-go]').forEach((a) => a.classList.toggle('cur', a.dataset.go === sceneId));
    },
  };
})();
</script>
<script>/* =====================================================================
   4.1 标题画面：标志入场 → 按任意键 → 主选单（继续游戏 / 新游戏 / 设置）
   ===================================================================== */
(function () {
  'use strict';
  const star4 = (r, cx = 0, cy = 0) => G.star4(cx, cy, r);

  function astroSVG() {
    const roman = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
    let labels = '';
    roman.forEach((r, i) => {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const x = 328 * Math.cos(a), y = 328 * Math.sin(a);
      labels += `<text class="lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(i * 30).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})">${r}</text>`;
    });
    let stars = '';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      stars += `<path d="${star4(i % 2 ? 5 : 8, 236 * Math.cos(a), 236 * Math.sin(a))}" fill="${i % 2 ? '#9fd6ff' : '#ffe29a'}"/>`;
    }
    return `<svg class="logo-astro" viewBox="-340 -340 680 680">
      <defs>
        <linearGradient id="lgOrbit" x1="0" x2="1"><stop offset="0" stop-color="#ffe29a" stop-opacity="0"/><stop offset=".45" stop-color="#fff1c8"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="lgOrbit2" x1="1" x2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#bfe4ff"/><stop offset="1" stop-color="#ffe29a" stop-opacity="0"/></linearGradient>
      </defs>
      <g class="spin">
        <circle r="312" fill="none" stroke="rgba(255,240,205,.6)" stroke-width="1.6" class="draw d1"/>
        <path d="${G.astroRing(312, { ticks: 120, major: 10 })}" stroke="rgba(255,240,205,.65)" stroke-width="1.2" class="fade"/>
        <g class="fade">${labels}</g>
      </g>
      <g class="spinr">
        <circle r="290" fill="none" stroke="rgba(255,240,205,.3)" stroke-width="1" stroke-dasharray="2 8" class="fade"/>
        <circle r="236" fill="none" stroke="rgba(170,215,255,.42)" stroke-width="1.2" class="draw d2"/>
        <g class="fade">${stars}</g>
      </g>
      <circle r="186" fill="none" stroke="rgba(255,240,205,.18)" stroke-width="1" class="draw d3"/>
      <g transform="rotate(-13)"><ellipse rx="372" ry="98" fill="none" stroke="url(#lgOrbit)" stroke-width="2.4" class="orbit"/></g>
      <g transform="rotate(17)"><ellipse rx="356" ry="66" fill="none" stroke="url(#lgOrbit2)" stroke-width="1.5" class="orbit"/></g>
      <path d="M-336 0H-250M250 0H336M0 -336V-326M0 250V336" stroke="rgba(255,240,205,.4)" stroke-width="1" class="fade"/>
    </svg>`;
  }
  function starSVG() {
    return `<svg viewBox="-90 -90 180 180">
      <defs><radialGradient id="lsg"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fff6dc" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
      <circle r="86" fill="url(#lsg)" opacity=".6"/>
      <g class="core">
        <path d="${star4(30)}" fill="#ffe7a6" transform="rotate(45)" opacity=".9"/>
        <path d="${star4(74)}" fill="#fffdf2"/>
        <circle r="7" fill="#fff"/>
      </g>
    </svg>`;
  }
  function ribbonSVG() {
    return `<svg viewBox="0 0 460 74" preserveAspectRatio="none">
      <defs><linearGradient id="rbG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5fc0"/><stop offset=".5" stop-color="#173a86"/><stop offset="1" stop-color="#0c1c4c"/></linearGradient></defs>
      <path d="M2 12H44V66H2L20 39Z" fill="#0b1a44" stroke="#e9c27a" stroke-width="2"/>
      <path d="M458 12H416V66H458L440 39Z" fill="#0b1a44" stroke="#e9c27a" stroke-width="2"/>
      <path d="M32 4H428V70H32Z" fill="url(#rbG)" stroke="#ffe29a" stroke-width="2.6"/>
      <path d="M40 11H420V63H40Z" fill="none" stroke="rgba(255,226,154,.45)" stroke-width="1"/>
      <path d="${star4(7, 58, 37)}" fill="#ffe29a"/><path d="${star4(7, 402, 37)}" fill="#ffe29a"/>
    </svg>`;
  }
  const mk = () => `<svg viewBox="-27 -27 54 54"><circle r="22" fill="none" stroke="#c98a2e" stroke-width="1.6" stroke-dasharray="3 3.4"/><circle r="15" fill="none" stroke="rgba(201,138,46,.5)" stroke-width="1"/><path d="${star4(13)}" fill="#d99a30"/></svg>`;

  const SETTINGS = [
    { k: 'text', name: '文字速度', en: 'TEXT SPEED', type: 'seg', v: 3, max: 5 },
    { k: 'bgm', name: '背景音乐', en: 'MUSIC', type: 'seg', v: 4, max: 5 },
    { k: 'sfx', name: '音效', en: 'SOUND FX', type: 'seg', v: 4, max: 5 },
    { k: 'cam', name: '镜头灵敏度', en: 'CAMERA', type: 'seg', v: 3, max: 5 },
    { k: 'dmg', name: '伤害数字', en: 'DAMAGE NUMBERS', type: 'tog', v: 0, opts: ['显示', '隐藏'] },
    { k: 'shake', name: '画面震动', en: 'SCREEN SHAKE', type: 'tog', v: 0, opts: ['开启', '关闭'] },
  ];

  class TitleScene extends G.Scene {
    enter(p) {
      G.BG.set('dawn');
      this.mode = 'intro';
      this.settings = JSON.parse(JSON.stringify(SETTINGS));
      this.root.innerHTML = `
        <div class="t-veil"></div>
        <div class="logo">
          <div class="logo-glow"></div>
          ${astroSVG()}
          <div class="logo-shade"></div>
          <div class="logo-star">${starSVG()}<i class="streak"></i><i class="streak v"></i></div>
          <h1 class="logo-main" aria-label="浮空群岛传说">${['浮', '空', '群', '岛'].map((c, i) => `<span class="ch" style="--i:${i}" data-t="${c}"><span>${c}</span></span>`).join('')}</h1>
          <div class="logo-ribbon">${ribbonSVG()}<b>传说</b></div>
          <div class="logo-en"><i></i>LEGEND OF THE FLOATING ISLES<i class="r"></i></div>
        </div>
        <div class="t-prompt"><div class="pk"><svg viewBox="-10 -10 20 20"><path d="${star4(9)}"/></svg>按任意键开始<svg viewBox="-10 -10 20 20"><path d="${star4(9)}"/></svg></div><em>PRESS ANY KEY</em></div>
        <nav class="tmenu">
          <div class="ti brk" data-act="continue" style="--i:0"><span class="band"></span><span class="mk">${mk()}</span><span class="mk r">${mk()}</span>
            <span class="lb"><b>继续游戏</b><em>CONTINUE</em></span><small class="sub">第三章「焰冠苏醒」 · 艾琳 Lv 78 · 游玩时间 32:15:08</small></div>
          <div class="sep"></div>
          <div class="ti brk" data-act="newgame" style="--i:1"><span class="band"></span><span class="mk">${mk()}</span><span class="mk r">${mk()}</span>
            <span class="lb"><b>新游戏</b><em>NEW GAME</em></span></div>
          <div class="sep"></div>
          <div class="ti brk" data-act="settings" style="--i:2"><span class="band"></span><span class="mk">${mk()}</span><span class="mk r">${mk()}</span>
            <span class="lb"><b>设置</b><em>SETTINGS</em></span></div>
        </nav>
        <div class="t-foot"><span>© 2026 <b>MORNING STAR WORKS</b> · 晨星工作室</span><span>VER 1.0.3</span></div>
        <div class="modal set-modal" hidden></div>
        <div class="modal cf-modal" hidden></div>`;
      if (p.menu) {
        this.root.classList.add('skip-intro');
        this.openMenu(true);
      } else {
        this.after(2700, () => { if (this.mode === 'intro') this.mode = 'press'; });
      }
    }
    items() { return this.$$('.tmenu .ti'); }
    openMenu(instant) {
      if (this.mode === 'menu') return;
      this.mode = 'menu';
      this.root.classList.add('pressed', 'menu-open');
      if (!G.touring && !G.exporting) this.after(instant ? 0 : 650, () => { if (this.mode === 'menu' && !G.UI.hover) G.UI.setHover(this.items()[0]); });
    }
    closeMenu() {
      this.mode = 'press';
      G.UI.setHover(null);
      this.root.classList.remove('menu-open', 'pressed');
    }
    blankClick() {
      if (this.mode === 'intro' || this.mode === 'press') this.openMenu();
    }
    act(a, el) {
      if (this.mode === 'settings') return this.actSettings(a, el);
      if (this.mode === 'confirm') {
        if (a === 'cf-yes') this.startGame(el, true);
        if (a === 'cf-no') this.closeModal('.cf-modal');
        return;
      }
      if (this.mode !== 'menu') { this.openMenu(); return; }
      if (a === 'continue') this.startGame(el);
      else if (a === 'newgame') this.openConfirm();
      else if (a === 'settings') this.openSettings();
    }
    startGame(el, fromModal) {
      this.mode = 'leaving';
      let origin = el;
      if (fromModal) { origin = this.$('.ti[data-act="newgame"]'); this.closeModal('.cf-modal', true); }
      origin.classList.add('chosen');
      const r = G.rectOf(origin);
      this.after(260, () => G.App.go('story', {}, 'star', { x: r.cx, y: r.cy }));
    }
    openConfirm() {
      this.mode = 'confirm';
      const m = this.$('.cf-modal');
      m.innerHTML = `<div class="modal-card plate rivets confirm-card"><h2>开始新的冒险<em>NEW GAME</em></h2>
        <p>将从序章「晨星启航」开始新的旅程。</p><p class="dim" style="font-size:18px">当前存档不会被覆盖。</p>
        <div class="modal-foot"><div class="btn btn-gold brk" data-act="cf-yes"><span class="k">Enter</span>开始</div><div class="btn btn-navy brk" data-act="cf-no"><span class="k">Esc</span>取消</div></div></div>`;
      m.hidden = false;
      m.classList.remove('closing');
      if (!G.touring) G.UI.setHover(m.querySelector('[data-act="cf-yes"]'));
    }
    openSettings() {
      this.mode = 'settings';
      const m = this.$('.set-modal');
      m.innerHTML = `<div class="modal-card plate rivets"><h2>${G.icon('ui-gear')} 设置<em>SETTINGS</em></h2>
        ${this.settings.map((s, i) => `<div class="set-row brk" data-act="set" data-i="${i}" data-hov="1">
          <span class="sl">${s.name}<small>${s.en}</small></span>${this.rowCtl(s)}</div>`).join('')}
        <div class="modal-foot"><div class="btn btn-navy brk" data-act="set-close"><span class="k">Esc</span>返回</div></div></div>`;
      m.hidden = false;
      m.classList.remove('closing');
      if (!G.touring) G.UI.setHover(m.querySelector('.set-row'));
    }
    rowCtl(s) {
      if (s.type === 'seg') {
        let segs = '';
        for (let i = 0; i < s.max; i++) segs += `<i class="${i < s.v ? 'on' : ''}"></i>`;
        return `<span class="arr" data-act="set-dec">${G.icon('ui-arrowL')}</span><span class="segs">${segs}</span><span class="arr" data-act="set-inc">${G.icon('ui-arrowR')}</span><span class="val">${s.v * 20}</span>`;
      }
      return `<span class="tog">${s.opts.map((o, j) => `<span class="${j === s.v ? 'on' : ''}">${o}</span>`).join('')}</span>`;
    }
    changeSetting(i, d) {
      const s = this.settings[i];
      if (s.type === 'seg') s.v = G.clamp(s.v + d, 1, s.max);
      else s.v = (s.v + 1) % s.opts.length;
      const row = this.$(`.set-row[data-i="${i}"]`);
      row.querySelector('.sl').nextSibling;
      const ctl = G.html(`<div>${this.rowCtl(s)}</div>`);
      [...row.children].slice(1).forEach((n) => n.remove());
      [...ctl.childNodes].forEach((n) => row.appendChild(n));
    }
    actSettings(a, el) {
      if (a === 'set-close') return this.closeModal('.set-modal');
      const row = el.closest('.set-row');
      if (!row) return;
      const i = +row.dataset.i;
      if (a === 'set-inc') this.changeSetting(i, 1);
      else if (a === 'set-dec') this.changeSetting(i, -1);
      else if (this.settings[i].type === 'tog') this.changeSetting(i, 1);
    }
    closeModal(sel, keepMode) {
      const m = this.$(sel);
      m.classList.add('closing');
      this.after(220, () => { m.hidden = true; m.classList.remove('closing'); });
      if (!keepMode) {
        this.mode = 'menu';
        const which = sel === '.set-modal' ? 'settings' : 'newgame';
        G.UI.setHover(this.$(`.ti[data-act="${which}"]`));
      }
    }
    key(e) {
      const k = e.key;
      if (this.mode === 'intro' || this.mode === 'press') { if (k !== 'Escape') this.openMenu(); return true; }
      if (this.mode === 'menu') {
        if (k === 'ArrowUp' || k === 'w') G.navList(this.items(), -1, { wrap: true });
        else if (k === 'ArrowDown' || k === 's') G.navList(this.items(), 1, { wrap: true });
        else if (k === 'Enter' || k === ' ') { const h = this.items().includes(G.UI.hover) ? G.UI.hover : this.items()[0]; G.UI.click(h); }
        else if (k === 'Escape' || k === 'Backspace') this.closeMenu();
        return true;
      }
      if (this.mode === 'settings') {
        const rows = this.$$('.set-row');
        if (k === 'ArrowUp') G.navList(rows, -1);
        else if (k === 'ArrowDown') G.navList(rows, 1);
        else if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Enter') {
          const h = rows.includes(G.UI.hover) ? G.UI.hover : rows[0];
          G.UI.setHover(h);
          this.changeSetting(+h.dataset.i, k === 'ArrowLeft' ? -1 : 1);
        } else if (k === 'Escape' || k === 'Backspace') this.closeModal('.set-modal');
        return true;
      }
      if (this.mode === 'confirm') {
        if (k === 'Enter') G.UI.click(this.$('[data-act="cf-yes"]'));
        else if (k === 'Escape' || k === 'Backspace') this.closeModal('.cf-modal');
        else if (k === 'ArrowLeft' || k === 'ArrowRight') G.navList(this.$$('.cf-modal .btn'), k === 'ArrowLeft' ? -1 : 1);
        return true;
      }
      return true;
    }
    back() {
      if (this.mode === 'settings') this.closeModal('.set-modal');
      else if (this.mode === 'confirm') this.closeModal('.cf-modal');
      else if (this.mode === 'menu') this.closeMenu();
    }
  }
  G.App.register('title', TitleScene);
})();
</script>
<script>/* =====================================================================
   4.7 剧情画面：逐字对话 / 自动 / 快进 / 名词解释 / 章节标题卡
   ===================================================================== */
(function () {
  'use strict';
  const CAST = ['erin', 'rock', 'thea', 'baldo'];
  const CHAR_MS = 36, FF_MS = 7;

  function chapterRing() {
    let roman = '';
    const R = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
    R.forEach((r, i) => {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const x = 452 * Math.cos(a), y = 452 * Math.sin(a);
      roman += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i * 30} ${x.toFixed(1)} ${y.toFixed(1)})" style="font:400 16px var(--f-en);fill:rgba(255,226,154,.55);letter-spacing:.1em">${r}</text>`;
    });
    return `<svg viewBox="-500 -500 1000 1000">
      <g class="rot"><circle r="480" fill="none" stroke="rgba(255,226,154,.45)" stroke-width="1.5" class="draw"/>
      <path d="${G.astroRing(480, { ticks: 180, major: 15 })}" stroke="rgba(255,226,154,.5)" stroke-width="1.2"/>${roman}</g>
      <g class="rotr"><circle r="420" fill="none" stroke="rgba(160,200,255,.3)" stroke-width="1" stroke-dasharray="4 10"/>
      <circle r="330" fill="none" stroke="rgba(255,226,154,.22)" stroke-width="1" class="draw"/>
      ${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => { const a = (i / 8) * Math.PI * 2; return `<path d="${G.star4(330 * Math.cos(a), 330 * Math.sin(a), i % 2 ? 6 : 10)}" fill="${i % 2 ? '#9fd6ff' : '#ffe29a'}"/>`; }).join('')}</g>
      <g transform="rotate(-12)"><ellipse rx="560" ry="120" fill="none" stroke="rgba(255,226,154,.25)" stroke-width="1.2"/></g>
    </svg>`;
  }

  class StoryScene extends G.Scene {
    enter(p) {
      G.BG.set('dusk');
      const D = G.DATA.STORY;
      this.lines = D.lines;
      this.idx = -1;
      this.auto = false;
      this.ff = false;
      this.typing = false;
      this.mode = 'dlg';
      this.pinned = null;
      this.root.innerHTML = `
        <div class="st-shade"></div>
        <div class="st-loc"><div class="pin">${G.icon('q-escort')}</div><div><b>${D.place}</b><small>THE MORNING STAR · DECK</small></div><span class="time">${D.time}</span></div>
        <div class="st-cast">${CAST.map((id, i) => `<div class="cm el-${G.DATA.chars[id].el}" data-id="${id}" style="--i:${i}">${G.crest(id)}<i>${G.DATA.chars[id].name}</i></div>`).join('')}</div>
        <div class="dlg" data-act="adv">
          <div class="dlg-box"></div>
          <div class="orn"><svg viewBox="-50 -50 100 100"><circle r="46" fill="none" stroke="#ffe29a" stroke-width="1"/><path d="${G.astroRing(46, { ticks: 60, major: 5 })}" stroke="#ffe29a" stroke-width="1"/><path d="${G.star4(0, 0, 30)}" fill="#ffe29a"/></svg></div>
          <div class="nameplate"></div>
          <div class="dlg-ctl">
            <div class="dlg-btn auto brk" data-act="auto">${G.icon('ui-auto')}自动<em>AUTO</em><kbd>A</kbd><i class="prog"></i></div>
            <div class="dlg-btn ff brk" data-act="ff">${G.icon('ui-ff')}快进<em>SKIP</em><kbd>S</kbd></div>
          </div>
          <div class="dlg-text"></div>
          <div class="dlg-next"><svg viewBox="-10 -10 20 20"><path d="${G.star4(0, 0, 9)}"/></svg></div>
        </div>`;
      this.dlg = this.$('.dlg');
      this.textEl = this.$('.dlg-text');
      this.after(p.fast ? 100 : 750, () => this.next());
      this.onFrame((t) => this.frame(t));
    }
    renderLine(line) {
      let html = '', n = 0;
      const parts = line.text.split(/(\{[^}]+\})/);
      for (const part of parts) {
        if (!part) continue;
        if (part[0] === '{') {
          const term = part.slice(1, -1);
          html += `<span class="term" data-term="${term}" data-act="term">${[...term].map((ch) => `<span class="c" data-n="${n++}">${ch}</span>`).join('')}${G.icon('ui-book', 'bk')}</span>`;
        } else html += [...part].map((ch) => `<span class="c" data-n="${n++}">${ch}</span>`).join('');
      }
      this.textEl.innerHTML = html;
      this.chars = Array.from(this.textEl.querySelectorAll('.c'));
      this.shown = 0;
      return n;
    }
    showLine(i) {
      const line = this.lines[i];
      const prev = i > 0 ? this.lines[i - 1].who : null;
      this.idx = i;
      this.closeGloss(true);
      const ch = G.DATA.chars[line.who];
      if (line.who !== prev) {
        const np = this.$('.nameplate');
        np.className = `nameplate el-${ch.el}`;
        np.innerHTML = `${G.elBadge(ch.el)}<b>${ch.name}</b><em>${ch.en}</em>`;
        G.retrigger(np, 'swap');
        this.dlg.className = `dlg el-${ch.el}`;
        this.$$('.st-cast .cm').forEach((c) => c.classList.toggle('on', c.dataset.id === line.who));
      }
      const N = this.renderLine(line);
      this.$('.dlg-next').classList.remove('on');
      this.typing = true;
      this.lineStart = G.time;
      this.ms = this.ff ? FF_MS : CHAR_MS;
      this.N = N;
      if (this.doneId) G.cancel(this.doneId);
      this.doneId = this.at(G.time + N * this.ms + 20, () => this.lineDone(i));
    }
    lineDone(i) {
      if (i !== this.idx || !this.typing) return;
      this.typing = false;
      this.doneId = null;
      this.chars.forEach((c) => c.classList.add('on'));
      this.shown = this.chars.length;
      this.$$('.term').forEach((t) => t.classList.add('ready'));
      this.$('.dlg-next').classList.add('on');
      this.lineDoneAt = G.time;
      this.queueAdvance();
    }
    queueAdvance() {
      if (this.advId) { G.cancel(this.advId); this.advId = null; }
      if (this.typing || this.mode !== 'dlg') return;
      if (this.ff) this.advId = this.after(160, () => { this.advId = null; this.next(); });
      else if (this.auto) {
        this.waitStart = G.time;
        this.waitDur = 650 + this.N * 16;
        this.advId = this.after(this.waitDur, () => { this.advId = null; this.next(); });
      }
    }
    completeNow() {
      if (!this.typing) return;
      if (this.doneId) { G.cancel(this.doneId); this.doneId = null; }
      this.lineDone(this.idx);
    }
    next() {
      if (this.mode !== 'dlg') return;
      if (this.advId) { G.cancel(this.advId); this.advId = null; }
      if (this.idx + 1 < this.lines.length) this.showLine(this.idx + 1);
      else this.chapterCard();
    }
    advance() {
      if (this.mode === 'chapter') return this.leaveChapter();
      if (this.mode !== 'dlg') return;
      if (this.pinned) { this.closeGloss(); return; }
      if (this.typing) this.completeNow();
      else this.next();
    }
    setAuto(v) {
      this.auto = v;
      this.$('.dlg-btn.auto').classList.toggle('on', v);
      if (v && this.ff) this.setFF(false);
      if (v) { this.closeGloss(); this.queueAdvance(); }
      else if (this.advId) { G.cancel(this.advId); this.advId = null; }
    }
    setFF(v) {
      this.ff = v;
      this.$('.dlg-btn.ff').classList.toggle('on', v);
      if (v && this.auto) this.setAuto(false);
      if (v) {
        this.closeGloss();
        if (this.typing) this.completeNow();
        else this.queueAdvance();
      } else if (this.advId) { G.cancel(this.advId); this.advId = null; }
    }
    frame(t) {
      if (this.typing && this.chars) {
        const n = Math.min(this.chars.length, Math.floor((t - this.lineStart) / this.ms) + 1);
        for (let k = this.shown; k < n; k++) this.chars[k].classList.add('on');
        this.shown = Math.max(this.shown, n);
      }
      const pg = this.$('.dlg-btn.auto .prog');
      if (pg) {
        const p = this.auto && this.advId && !this.typing ? G.clamp((t - this.waitStart) / this.waitDur, 0, 1) : 0;
        pg.style.transform = `scaleX(${p})`;
      }
    }
    /* ---- 名词解释 ---- */
    openGloss(termEl, pin) {
      const key = termEl.dataset.term;
      const g = G.DATA.GLOSSARY[key];
      if (!g) return;
      if (this.gloss && this.gloss._key === key) {
        if (pin) { this.pinned = termEl; termEl.classList.add('pinned'); this.gloss.querySelector('.g-pin').textContent = '已固定 · 再次点击关闭'; }
        return;
      }
      this.closeGloss(true);
      const el = G.html(`<div class="gloss plate rivets"><span class="g-cat">${G.icon('ui-book')}${g.cat}</span><span class="g-pin">${pin ? '已固定 · 再次点击关闭' : '点击固定'}</span>
        <h4>${key}</h4><div class="g-en">${g.en.toUpperCase()}</div><p>${g.text}</p><i class="g-arrow"></i></div>`);
      el._key = key;
      this.root.appendChild(el);
      const r = G.rectOf(termEl);
      const h = el.offsetHeight;
      el.style.left = G.clamp(r.cx - 230, 40, 1880 - 460) + 'px';
      el.style.top = r.y - h - 26 + 'px';
      el.querySelector('.g-arrow').style.left = G.clamp(r.cx - G.clamp(r.cx - 230, 40, 1420), 30, 430) + 'px';
      this.gloss = el;
      if (pin) { this.pinned = termEl; termEl.classList.add('pinned'); }
    }
    closeGloss(instant) {
      if (this.pinned) this.pinned.classList.remove('pinned');
      this.pinned = null;
      const g = this.gloss;
      this.gloss = null;
      if (!g) return;
      if (instant) { g.remove(); return; }
      g.classList.add('out');
      this.after(190, () => g.remove());
    }
    onHover(el) {
      if (this.mode !== 'dlg') return;
      if (el && el.classList.contains('term')) {
        if (!this.pinned) this.openGloss(el, false);
      } else if (!this.pinned && this.gloss) this.closeGloss();
    }
    /* ---- 章节标题卡 ---- */
    chapterCard() {
      if (this.mode === 'chapter') return;
      this.mode = 'chapter';
      this.closeGloss(true);
      if (this.advId) G.cancel(this.advId);
      const c = G.DATA.STORY.chapter;
      const el = G.html(`<div class="chapter"><div class="cc-veil"></div>
        <div class="cc-stack">
          <div class="cc-ring">${chapterRing()}</div>
          <div class="cc-num"><b>${c.num}</b><em>${c.en}</em></div>
          <div class="cc-title">${[...c.name].map((ch, i) => `<span style="--i:${i}" data-t="${ch}"><i>${ch}</i></span>`).join('')}</div>
          <div class="cc-line"></div>
          <div class="cc-en">${c.enName}</div>
          <div class="cc-tag">${c.tag}</div>
        </div>
        <div class="cc-skip"><kbd>Enter</kbd>继续</div></div>`);
      this.root.appendChild(el);
      this.chapterEl = el;
      this.chapterAt = G.time;
      this.after(420, () => {
        G.BG.set('night');
        this.$$('.st-shade,.st-loc,.st-cast,.dlg').forEach((n) => (n.style.visibility = 'hidden'));
      });
      this.after(3900, () => this.leaveChapter(true));
    }
    leaveChapter(force) {
      if (this.left) return;
      if (!force && G.time - this.chapterAt < 1300) return;
      this.left = true;
      this.chapterEl.classList.add('leave');
      this.after(520, () => G.App.go('quest', { tier: 'normal' }, 'wind'));
    }
    act(a, el) {
      if (a === 'auto') this.setAuto(!this.auto);
      else if (a === 'ff') this.setFF(!this.ff);
      else if (a === 'term') {
        if (this.typing) { this.completeNow(); return; }
        if (this.pinned === el) this.closeGloss();
        else this.openGloss(el, true);
      } else if (a === 'adv') this.advance();
    }
    blankClick() { this.advance(); }
    key(e) {
      const k = e.key.toLowerCase();
      if (k === 'enter' || k === ' ') { this.advance(); return true; }
      if (this.mode !== 'dlg') return k !== 'escape' && k !== 'backspace';
      if (k === 'a') { this.setAuto(!this.auto); return true; }
      if (k === 's' || k === 'control') { this.setFF(!this.ff); return true; }
      if (k === 'tab' || k === 'arrowright' || k === 'arrowleft') {
        const terms = this.$$('.term');
        if (terms.length) G.navList(terms, k === 'arrowleft' ? -1 : 1, { wrap: true });
        return true;
      }
      return false;
    }
    keyUp(e) {
      if (e.key === 'Control' && this.ff) this.setFF(false);
    }
    back() {
      if (this.pinned) { this.closeGloss(); return; }
      G.App.go('title', { menu: true }, 'fade');
    }
  }
  G.App.register('story', StoryScene);
})();
</script>
<script>/* =====================================================================
   4.2 任务柜台：难度分档 / 任务列表 / 详情 / 战力对比 / 出发
   ===================================================================== */
(function () {
  'use strict';
  const DONE = { n1: 1, n2: 1, n3: 1, h1: 1, h2: 1, x2: 1 };
  const qRing = (boss) => `<svg class="ring" viewBox="-50 -50 100 100"><circle r="47" fill="${boss ? 'url(#rg-boss)' : 'rgba(14,30,72,.92)'}" stroke="#e9c27a" stroke-width="2"/><path d="${G.astroRing(43, { ticks: 36, major: 3 })}" stroke="rgba(255,226,154,.55)" stroke-width="1"/><circle r="35" fill="none" stroke="rgba(255,226,154,.3)" stroke-width="1"/></svg>`;
  const bullet = `<svg viewBox="-10 -10 20 20"><path d="${G.star4(0, 0, 9)}"/></svg>`;

  class QuestScene extends G.Scene {
    enter(p) {
      G.BG.set('day');
      const D = G.DATA;
      this.tier = p.tier || G.state.tier || 'normal';
      this.sel = p.sel || null;
      this.root.innerHTML = `
        <div class="q-tint"></div>
        ${G.scrHead('任务柜台', 'QUEST COUNTER · 空行者公会', 'it-map')}
        <div class="q-tabs"><kbd class="qk" data-act="tabprev">Q</kbd>
          ${D.TIERS.map((t) => `<div class="q-tab brk" data-act="tab" data-tier="${t.id}"><div><b>${t.name}</b><em>${t.en}</em></div><span class="stars">${'<i></i>'.repeat(t.stars)}</span>${t.id === 'legend' ? G.icon('ui-lock', 'lockdot') : ''}</div>`).join('')}
          <kbd class="qk" data-act="tabnext">E</kbd></div>
        <div class="q-list plate"><div class="ql-head"><b>委托列表</b>QUEST LIST<span class="qcount"></span></div><div class="q-rows"></div></div>
        <div class="q-detail plate rivets"><div class="qd-wm"><svg viewBox="-50 -50 100 100"><circle r="48" fill="none" stroke="#ffe29a" stroke-width=".6"/><path d="${G.astroRing(48, { ticks: 90, major: 9 })}" stroke="#ffe29a" stroke-width=".6"/><circle r="34" fill="none" stroke="#ffe29a" stroke-width=".4" stroke-dasharray="1 2"/><path d="${G.star4(0, 0, 26)}" fill="#ffe29a"/></svg></div><div class="qd-in"></div></div>
        ${G.keybar([
          { k: ['Q', 'E'], t: '切换难度', act: 'tabnext' },
          { k: ['↑', '↓'], t: '选择任务' },
          { k: ['Enter'], t: '确认 / 出发' },
          { k: ['Esc'], t: '返回', act: 'back' },
        ])}`;
      this.setTier(this.tier, true);
    }
    quests() { return G.DATA.QUESTS[this.tier]; }
    rows() { return this.$$('.qrow'); }
    setTier(t, first) {
      if (!first && t === this.tier) return;
      this.tier = t;
      G.state.tier = t;
      this.$$('.q-tab').forEach((el) => el.classList.toggle('sel', el.dataset.tier === t));
      const qs = this.quests();
      const D = G.DATA;
      this.$('.q-rows').innerHTML = qs
        .map((q, i) => {
          const it = D.ITEMS[q.reward];
          const ty = D.QTYPES[q.type];
          return `<div class="qrow brk ${q.locked ? 'locked' : ''}" data-act="pick" data-id="${q.id}" style="--i:${i}">
            ${q.isNew ? '<span class="qnew">NEW</span>' : ''}${DONE[q.id] ? `<span class="qdone">${G.icon('ui-check')}已通关</span>` : ''}
            <div class="qbadge">${qRing(q.type === 'boss')}${G.icon(ty.icon)}</div>
            <div class="qmain"><div class="qname">${q.name}</div><div class="qmeta"><span class="qtype">${G.icon(ty.icon)}${ty.name}</span><span class="qloc">${G.icon('ui-pin')}${q.loc}</span></div></div>
            <div class="qpow"><small>推荐战力</small><b>${G.icon('ui-power')}${G.fmt(q.rec)}</b></div>
            <div class="qrew">${G.itemTile(q.reward)}<span><small>主要奖励</small>${it.name}</span></div>
            ${q.locked ? `<div class="qlock">${G.icon('ui-lock')}</div>` : ''}
          </div>`;
        })
        .join('');
      const done = qs.filter((q) => DONE[q.id]).length;
      this.$('.qcount').textContent = `${qs.length} 件委托 · 已完成 ${done}`;
      const keep = qs.find((q) => q.id === this.sel);
      this.select(keep ? keep.id : qs[0].id, true);
    }
    select(id, force) {
      if (!force && id === this.sel) return;
      this.sel = id;
      this.rows().forEach((r) => r.classList.toggle('sel', r.dataset.id === id));
      const q = G.questById(id);
      const D = G.DATA;
      const tier = D.TIERS.find((t) => t.id === q.tier);
      const tColor = { normal: '#4ea4ff', hard: '#f6b83c', extreme: '#ff5a3c', legend: '#b77bff' }[q.tier];
      const pp = G.partyPower();
      const max = Math.max(pp, q.rec) * 1.12;
      const diff = pp - q.rec;
      const ty = D.QTYPES[q.type];
      const b = q.boss;
      const box = this.$('.qd-in');
      box.innerHTML = `
        <div class="qd-tags"><span class="qd-diff" style="--tc:${tColor}">${tier.name}<em>${tier.en} ${'★'.repeat(tier.stars)}</em></span><span class="qd-type">${G.icon(ty.icon)}${ty.name}</span></div>
        <h2 class="qd-name">${q.name}</h2>
        <div class="qd-loc">${G.icon('ui-pin')}${q.loc}</div>
        <div class="qd-boss">${q.type === 'boss' ? G.bossCrest() : `<svg class="crest" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="url(#rg-el-${b.el})"/><circle cx="50" cy="50" r="48" fill="none" stroke="#f3d48a" stroke-width="2.2"/><use href="#${ty.icon}" x="24" y="24" width="52" height="52" fill="#fff"/></svg>`}
          <div><div class="bt">${b.title ? b.title + ' · ABYSSAL BEAST' : '讨伐目标 · TARGET'}</div><div class="bn">${b.name}</div><div class="bl">${b.lv ? 'LV ' + b.lv + ' · ' : ''}${D.ELEMENTS[b.el].name}属性</div></div>
          <div class="bel"><div>${G.elBadge(b.el)}属性</div><div class="weak">${G.elBadge(b.weak)}弱点</div></div></div>
        <div class="qd-sec"><b>任务目标</b>OBJECTIVES</div>
        <div class="qd-goals">${q.goals.map((g) => `<div>${bullet}${g}</div>`).join('')}</div>
        <div class="qd-desc">${q.desc}</div>
        <div class="qd-sec"><b>可能获得的奖励</b>REWARDS</div>
        <div class="qd-rew">${q.rewards.map(([id, tag]) => `<div class="rw" data-hov="1">${G.itemTile(id)}<span>${D.ITEMS[id].name}</span>${tag ? `<em class="${tag === '稀有' ? 'rare' : ''}">${tag}</em>` : ''}</div>`).join('')}</div>
        <div class="qd-foot">
          <div class="qd-power">
            <div class="pw-row"><small>推荐战力</small><div class="bar rec"><i style="width:${(q.rec / max) * 100}%"></i></div><b class="num pw-rec">${G.fmt(q.rec)}</b></div>
            <div class="pw-row"><small>队伍战力</small><div class="bar cur"><i style="width:${(pp / max) * 100}%"></i><span class="mark" style="left:${(q.rec / max) * 100}%"></span></div><b class="num pw-cur">${G.fmt(pp)}</b></div>
            <div class="pw-verdict ${diff >= 0 ? 'ok' : 'bad'}">${G.icon(diff >= 0 ? 'ui-check' : 'ui-warn')}${diff >= 0 ? '战力充足' : '战力不足'}<span class="num">${diff >= 0 ? '+' : ''}${G.fmt(diff)}</span></div>
          </div>
          <div class="btn btn-gold qd-go brk ${q.locked ? 'locked' : ''}" data-act="go"><span class="k">Enter</span>出发</div>
        </div>`;
      G.retrigger(box, 'qd-in');
      G.countTo(box.querySelector('.pw-rec'), 0, q.rec, 900, { delay: 300 });
      G.countTo(box.querySelector('.pw-cur'), 0, pp, 1000, { delay: 350 });
    }
    depart() {
      const q = G.questById(this.sel);
      const go = this.$('.qd-go');
      if (q.locked) {
        G.retrigger(go, 'q-shake');
        const t = G.html(`<div class="q-toast">${G.icon('ui-lock')} 该任务尚未解锁</div>`);
        this.root.appendChild(t);
        this.after(1700, () => t.remove());
        return;
      }
      G.state.quest = q.id;
      G.App.go('party', {}, 'wind');
    }
    act(a, el) {
      if (a === 'tab') this.setTier(el.dataset.tier);
      else if (a === 'tabprev' || a === 'tabnext') this.stepTier(a === 'tabprev' ? -1 : 1);
      else if (a === 'pick') this.select(el.dataset.id);
      else if (a === 'go') this.depart();
      else if (a === 'back') this.back();
    }
    stepTier(d) {
      const ids = G.DATA.TIERS.map((t) => t.id);
      const i = G.clamp(ids.indexOf(this.tier) + d, 0, ids.length - 1);
      const tab = this.$(`.q-tab[data-tier="${ids[i]}"]`);
      G.UI.pressFlash(tab);
      this.setTier(ids[i]);
    }
    key(e) {
      const k = e.key.toLowerCase();
      if (k === 'q' || k === 'e') { this.stepTier(k === 'q' ? -1 : 1); return true; }
      if (k === 'arrowup' || k === 'w') { this.navRows(-1); return true; }
      if (k === 'arrowdown' || k === 's') { this.navRows(1); return true; }
      if (k === 'arrowleft' || k === 'arrowright') { this.stepTier(k === 'arrowleft' ? -1 : 1); return true; }
      if (k === 'enter' || k === ' ') {
        const h = G.UI.hover;
        if (h && h.classList.contains('qrow') && h.dataset.id !== this.sel) { G.UI.click(h); return true; }
        G.UI.click(this.$('.qd-go'));
        return true;
      }
      return false;
    }
    navRows(d) {
      const rows = this.rows();
      if (!rows.includes(G.UI.hover)) { const i = rows.findIndex((r) => r.dataset.id === this.sel); G.UI.setHover(rows[Math.max(0, i)]); return; }
      G.navList(rows, d);
    }
    back() { G.App.go('title', { menu: true }, 'wind'); }
  }
  G.App.register('quest', QuestScene);
})();
</script>
<script>/* =====================================================================
   4.3 编队与角色养成：四个编队位 / 换人 / 角色详情 / 技能与徽印替换预览 / 出击
   ===================================================================== */
(function () {
  'use strict';
  const D = () => G.DATA;
  const OCT = 'M14 2H34L46 14V34L34 46H14L2 34V14Z';
  const OCT_IN = 'M15.6 6H32.4L42 15.6V32.4L32.4 42H15.6L6 32.4V15.6Z';

  // 技能徽章：八角形（与六边形的属性徽章区分）
  G.skillBadge = (sid, el, cls = '') => {
    const s = D().SKILLS[sid];
    return `<div class="skb ${cls}"><svg viewBox="0 0 48 48"><path d="${OCT}" fill="url(#g-el-${el})"/><path d="${OCT_IN}" fill="rgba(6,12,32,.42)" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/><use href="#${s.icon}" x="12.5" y="12.5" width="23" height="23" fill="#fff" color="#fff"/></svg></div>`;
  };
  // 徽印：菱形纹章，颜色表示稀有度
  G.sigilMedal = (sig) =>
    sig

      : `<svg viewBox="0 0 48 54"><path d="M24 1L47 27L24 53L1 27Z" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.32)" stroke-width="1.2" stroke-dasharray="3 3"/><use href="#ui-plus" x="16" y="19" width="16" height="16" color="rgba(255,255,255,.45)"/></svg>`;
  const halo = () => `<svg class="halo" viewBox="-50 -50 100 100"><circle r="48" fill="none" style="stroke:var(--c)" stroke-opacity=".55" stroke-width=".8"/><path d="${G.astroRing(48, { ticks: 60, major: 5 })}" style="stroke:var(--c)" stroke-opacity=".75" stroke-width=".8"/><circle r="42" fill="none" stroke="rgba(255,226,154,.35)" stroke-width=".6" stroke-dasharray="1 3"/><path d="${G.star4(0, -48, 5)}" fill="#ffe29a"/></svg>`;

  function fmtDelta(row, d) {
    const a = Math.abs(d);
    let s;
    if (row.k === 'crit' || row.k === 'ultgain') s = a.toFixed(1) + '%';
    else if (row.k === 'critdmg' || row.k === 'skillpow') s = Math.round(a) + '%';
    else if (row.k === 'cd') s = a.toFixed(1) + 's';
    else s = G.fmt(a);
    return (d > 0 ? '▲ +' : '▼ -') + s;
  }

  class PartyScene extends G.Scene {
    enter(p) {
      G.BG.set('golden');

      this.root.innerHTML = `
        <div class="p-tint"></div>

        <div class="p-bottom plate rivets">
          <div class="p-pow">

            <div class="pr"><small>队伍战力</small><div class="bar cur"><i class="pv"></i><i class="cv"></i><span class="mark"></span></div><b class="num p-cur">0</b></div>
            <div class="vd"></div>
          </div>
          <div class="p-elems"><div class="row"></div><small></small></div>
          <div class="btn btn-gold p-sortie brk" data-act="sortie"><span class="k">F</span><div>出击<em>SORTIE</em></div></div>
        </div>
        ${G.keybar([
          { k: ['←', '→'], t: '选择编队位' },
          { k: ['Enter'], t: '更换角色' },
          { k: ['C'], t: '角色详情' },
          { k: ['F'], t: '出击', act: 'sortie' },
          { k: ['Esc'], t: '返回', act: 'back' },
        ])}`;
      const head = this.$('.scr-head');
      head.insertAdjacentHTML('beforeend', `<div class="quest-chip">${G.bossCrest()}<span class="d">${D().TIERS.find((t) => t.id === q.tier).name}</span><b>${q.name}</b><small>推荐战力<b>${G.fmt(q.rec)}</b></small></div>`);
      this.renderCards();
      this.updatePower(null, true);
    }
    /* ---------- 编队位 ---------- */
    cardHTML(id, i) {
      const c = D().chars[id];
      const st = G.calcStats(id);
      const b = G.state.builds[id];
      return `<div class="slot"><b>0${i + 1}</b><span class="role">${i === 0 ? G.icon('ui-pad') + '操作角色' : G.icon('ui-chip') + '队友 · AI'}</span></div>
        <div class="pc-crest">${halo()}${G.crest(id)}</div>
        <div class="pc-name"><b>${c.name}</b><span class="lv">Lv<strong>${c.lv}</strong></span></div>
        <div class="pc-sub">${c.en}<span>${c.title}</span></div>
        <div class="pc-tags">${G.elTag(c.el)}${G.wpTag(c.weapon)}</div>
        <div class="pc-pow">${G.icon('ui-power')}<small>战力</small><b class="num">${G.fmt(st.power)}</b></div>
        <div class="pc-skills">${b.skills.map((s) => G.skillBadge(s, c.el)).join('')}</div>
        <div class="pc-btns"><div class="pc-btn" data-act="swap" data-i="${i}">${G.icon('ui-swap')}更换</div><div class="pc-btn" data-act="detail" data-i="${i}">${G.icon('ui-person')}详情<kbd>C</kbd></div></div>`;
    }
    renderCards() {
      const wrap = this.$('.p-cards');
      wrap.innerHTML = G.state.party
        .map((id, i) => `<div class="pcard brk el-${D().chars[id].el} ${i === 0 ? 'leader' : ''}" data-act="slot" data-i="${i}" style="--i:${i}">${this.cardHTML(id, i)}</div>`)
        .join('');
    }
    refreshCard(i, flip) {
      const card = this.$(`.pcard[data-i="${i}"]`);
      const id = G.state.party[i];
      const apply = () => {
        card.className = `pcard brk el-${D().chars[id].el} ${i === 0 ? 'leader' : ''} ${flip ? 'flip' : ''} ${G.UI.hover === card ? 'hov' : ''}`;
        card.innerHTML = this.cardHTML(id, i);
      };
      if (flip) {
        card.classList.remove('flip');
        void card.offsetWidth;
        card.classList.add('flip');
        this.after(330, apply);
      } else apply();
    }
    updatePower(previewParty, instant) {
      const q = this.q;
      const cur = G.partyPower();
      const pv = previewParty ? G.partyPower(previewParty) : cur;
      const max = Math.max(cur, pv, q.rec) * 1.12;
      this.$('.bar.rec i').style.width = (q.rec / max) * 100 + '%';
      this.$('.bar.cur .cv').style.width = (Math.min(cur, pv) / max) * 100 + '%';
      const pvEl = this.$('.bar.cur .pv');
      pvEl.style.width = (Math.max(cur, pv) / max) * 100 + '%';
      pvEl.classList.toggle('neg', pv < cur);
      pvEl.style.opacity = pv !== cur ? 1 : 0;
      this.$('.bar.cur .mark').style.left = (q.rec / max) * 100 + '%';
      const shown = pv;
      const el = this.$('.p-cur');
      const from = this.lastPow == null ? 0 : this.lastPow;
      if (from !== shown) G.countTo(el, from, shown, instant ? 900 : 500, { delay: instant ? 300 : 0 });
      this.lastPow = shown;
      const diff = shown - q.rec;
      const vd = this.$('.vd');
      vd.className = 'vd ' + (diff >= 0 ? '' : 'bad');
      vd.innerHTML = `${G.icon(diff >= 0 ? 'ui-check' : 'ui-warn')}${diff >= 0 ? '战力充足' : '战力不足'}<span class="dl num">${diff >= 0 ? '+' : ''}${G.fmt(diff)}</span>${pv !== cur ? `<span class="dl num" style="color:${pv > cur ? 'var(--mint)' : 'var(--rose)'};margin-left:14px">（${pv > cur ? '▲ +' : '▼ '}${G.fmt(pv - cur)}）</span>` : ''}`;
      // 属性构成
      const party = previewParty || G.state.party;
      this.$('.p-elems .row').innerHTML = party.map((id) => G.elBadge(D().chars[id].el)).join('');
      const weak = q.boss.weak;
      const has = party.find((id) => D().chars[id].el === weak);
      const sm = this.$('.p-elems small');
      sm.className = has ? 'ok' : '';
      sm.innerHTML = has ? `${G.icon('ui-check')}编队中有克制首领的${G.elBadge(weak)}${D().ELEMENTS[weak].name}属性角色` : `${G.icon('ui-info')}建议编入${G.elBadge(weak)}${D().ELEMENTS[weak].name}属性角色`;
    }
    /* ---------- 换人 ---------- */
    openSwap(i) {
      if (this.mode !== 'party') return;
      this.mode = 'swap';
      this.slotIdx = i;
      const curId = G.state.party[i];
      this.$$('.pcard').forEach((c) => c.classList.toggle('picking', +c.dataset.i === i));
      const curPow = G.calcStats(curId).power;
      const dr = G.html(`<div class="drawer"><h3>选择队员<em>SELECT MEMBER</em><span>更换 0${i + 1} 号位：${D().chars[curId].name}</span><span class="dpv"></span></h3>
        <div class="ctiles">${D().CHAR_ORDER.map((id, k) => {
          const c = D().chars[id];
          const pw = G.calcStats(id).power;
          const inP = G.state.party.indexOf(id);
          const dl = pw - curPow;
          return `<div class="ctile brk el-${c.el} ${id === curId ? 'cur' : ''}" data-act="pickc" data-id="${id}" style="--i:${k}">
            ${inP >= 0 ? `<span class="inp">${id === curId ? '当前' : '编队中 0' + (inP + 1)}</span>` : ''}
            ${G.crest(id)}<b>${c.name}</b>
            <div class="ci">${G.elBadge(c.el)}${G.icon('w-' + c.weapon)}Lv ${c.lv}</div>
            <div class="cp">${G.icon('ui-power')}${G.fmt(pw)}</div>
            <div class="dl ${dl < 0 ? 'neg' : dl === 0 ? 'zero' : ''}">${id === curId ? '—' : (dl >= 0 ? '▲ +' : '▼ ') + G.fmt(dl)}</div></div>`;
        }).join('')}</div></div>`);
      this.root.appendChild(dr);
      this.drawer = dr;
      if (!G.touring && !G.exporting) G.UI.setHover(dr.querySelector('.ctile:not(.cur)'));
    }
    swapParty(id) {
      const party = G.state.party.slice();
      const i = this.slotIdx;
      const cur = party[i];
      const j = party.indexOf(id);
      if (j >= 0) party[j] = cur;
      party[i] = id;
      return { party, j };
    }
    closeSwap() {
      const dr = this.drawer;
      this.drawer = null;
      this.mode = 'party';
      this.$$('.pcard').forEach((c) => c.classList.remove('picking'));
      this.updatePower(null);
      if (dr) {
        dr.classList.add('out');
        this.after(300, () => dr.remove());
      }
      G.UI.setHover(this.$(`.pcard[data-i="${this.slotIdx}"]`));
    }
    pickChar(id) {
      const curId = G.state.party[this.slotIdx];
      if (id === curId) return this.closeSwap();
      const { party, j } = this.swapParty(id);
      G.state.party = party;
      this.refreshCard(this.slotIdx, true);
      if (j >= 0) this.refreshCard(j, true);
      this.closeSwap();
    }
    /* ---------- 角色详情 ---------- */
    openDetail(i) {
      if (this.mode !== 'party') return;
      this.mode = 'detail';
      this.detIdx = i;
      const el = G.html(`<div class="detail"></div>`);
      this.root.appendChild(el);
      this.detEl = el;
      this.renderDetail();
    }
    detId() { return G.state.party[this.detIdx]; }
    renderDetail() {
      const id = this.detId();
      const c = D().chars[id];
      const b = G.state.builds[id];
      const st = G.calcStats(id);
      const el = this.detEl;
      el.className = `detail el-${c.el}`;
      el.innerHTML = `
        ${G.scrHead('角色详情', 'CHARACTER · 养成', 'ui-person', false)}
        <div class="det-col det-l">
          <div class="det-id" style="animation-delay:.05s"><div class="crestwrap">${halo()}${G.crest(id)}</div>
            <div><h2>${c.name}</h2><div class="en">${c.en}</div><div class="ttl">「${c.title}」</div><div class="tags">${G.elTag(c.el)}${G.wpTag(c.weapon)}</div></div></div>
          <div class="det-lv plate" style="animation-delay:.1s"><div class="lvrow"><small>LV</small><b>${c.lv}</b><span>/ 100</span><em>距离升级<b class="num">${G.fmt(c.exp[1] - c.exp[0])}</b>EXP</em></div>
            <div class="expbar"><i style="width:${(c.exp[0] / c.exp[1]) * 100}%"></i></div></div>
          <div class="det-stats plate" style="animation-delay:.15s"><div class="det-h"><b>属性</b>STATUS<span class="pvhint"></span></div>
            ${G.STAT_ROWS.map((r) => `<div class="srow ${r.k === 'power' ? 'big' : ''}" data-k="${r.k}">${G.icon(r.icon)}<span class="sn">${r.name}<small>${r.en}</small></span><b class="sv num">${r.fmt(st[r.k])}</b><span class="sd num"></span></div>`).join('')}
          </div>
        </div>
        <div class="det-col det-m">
          <div class="det-wp plate" style="animation-delay:.12s">${G.itemTile2(c.weaponItem, c.weapon)}<div><div class="wn">${c.weaponItem.name}</div><div class="wm">${G.elBadge(c.weaponItem.el)}${D().ELEMENTS[c.weaponItem.el].name}属性 · ${D().WEAPONS[c.weapon].name}<b>Lv ${c.weaponItem.lv}</b></div></div>
            <div class="ws"><small>武器攻击力</small><b class="num">+${G.fmt(c.weaponItem.atk)}</b></div></div>
          <div class="det-sk plate" style="animation-delay:.18s"><div class="det-h"><b>技能</b>SKILLS<span>点击技能槽替换</span></div>
            ${b.skills.map((s, k) => this.skrowHTML(s, k, c.el)).join('')}</div>
        </div>
        <div class="det-col det-r">
          <div class="det-sg plate" style="animation-delay:.16s"><div class="det-h"><b>徽印</b>SIGILS<span>${b.sigils.filter(Boolean).length} / ${b.sigils.length}</span></div>
            <div class="sgrid">${b.sigils.map((s, k) => this.sglHTML(s, k)).join('')}</div></div>
          <div class="det-tr plate" style="animation-delay:.22s"><div class="det-h"><b>特性汇总</b>TRAITS<span>同类特性叠加</span></div><div class="trows"></div></div>
        </div>
        ${G.keybar([
          { k: ['↑', '↓', '←', '→'], t: '选择' },
          { k: ['Enter'], t: '更换' },
          { k: ['Q', 'E'], t: '切换角色' },
          { k: ['Esc'], t: '返回', act: 'back' },
        ])}`;
      const head = el.querySelector('.scr-head');
      head.insertAdjacentHTML('beforeend', `<div class="det-sw"><kbd data-act="detprev">Q</kbd>${G.state.party.map((pid, k) => `<span class="sw brk ${k === this.detIdx ? 'on' : ''}" data-act="detsw" data-i="${k}">${G.crest(pid)}</span>`).join('')}<kbd data-act="detnext">E</kbd></div>`);
      this.renderTraits();
    }
    skrowHTML(s, k, el) {
      const S = D().SKILLS[s];
      return `<div class="skrow brk" data-act="skill" data-k="${k}"><span class="num">${k + 1}</span>${G.skillBadge(s, el)}
        <div class="skt"><div class="skn">${S.name}<em>${S.en}</em><span class="cdc">${G.icon('ui-time')}${S.cd.toFixed(1)}s</span></div><div class="skd">${S.desc}</div></div></div>`;
    }
    sglHTML(s, k) {
      return `<div class="sgl brk ${s ? '' : 'empty'}" data-act="sigil" data-k="${k}"><div class="med">${G.sigilMedal(s)}</div><b>${s ? D().TRAITS[s.t].name : '空槽位'}</b><span>${s ? 'Lv ' + s.lv : '—'}</span></div>`;
    }
    renderTraits(previewBuild) {
      const id = this.detId();
      const b = G.state.builds[id];
      const cur = G.traitSum(b.sigils);
      const pv = previewBuild ? G.traitSum(previewBuild.sigils) : null;
      const cnt = {};
      b.sigils.forEach((s) => s && (cnt[s.t] = (cnt[s.t] || 0) + 1));
      const keys = Array.from(new Set([...Object.keys(cur), ...(pv ? Object.keys(pv) : [])]));
      keys.sort((a, z) => ((pv ? pv[z] : cur[z]) || cur[z] || 0) - ((pv ? pv[a] : cur[a]) || cur[a] || 0));
      const T = D().TRAITS;
      this.$('.trows').innerHTML = keys
        .slice(0, 8)
        .map((k) => {
          const lv0 = cur[k] || 0;
          const lv1 = pv ? pv[k] || 0 : lv0;
          const max = T[k].max;
          const segs = 15;
          const on0 = Math.ceil((Math.min(lv0, max) / max) * segs), on1 = Math.ceil((Math.min(lv1, max) / max) * segs);
          let bar = '';
          for (let i = 0; i < segs; i++) {
            let cls = '';
            if (i < Math.min(on0, on1)) cls = 'on';
            else if (i < on1) cls = 'add';
            else if (i < on0) cls = 'rem';
            bar += `<i class="${cls}"></i>`;
          }
          const ch = lv1 !== lv0;
          return `<div class="trow ${ch ? (lv1 > lv0 ? 'inc' : 'dec') : ''} ${cnt[k] > 1 ? 'stack' : ''}">${G.icon(T[k].icon)}<span class="tn">${T[k].name}</span><span class="tb">${bar}</span><span class="tl">${ch ? `${lv0} → ${lv1}` : `Lv ${Math.min(lv0, max)}<small>/${max}</small>`}</span></div>`;
        })
        .join('');
    }
    preview(build) {
      const id = this.detId();
      const s0 = G.calcStats(id);
      const s1 = build ? G.calcStats(id, build) : s0;
      let any = false;
      G.STAT_ROWS.forEach((r) => {
        const row = this.$(`.srow[data-k="${r.k}"]`);
        if (!row) return;
        const d = s1[r.k] - s0[r.k];
        row.classList.remove('inc', 'dec');
        const sd = row.querySelector('.sd');
        if (Math.abs(d) > 0.001) {
          any = true;
          const better = r.lowerBetter ? d < 0 : d > 0;
          row.classList.add(better ? 'inc' : 'dec');
          sd.textContent = fmtDelta(r, d);
        } else sd.textContent = '';
      });
      this.$('.pvhint').textContent = any ? '预览：替换后的数值变化' : '';
      this.renderTraits(build);
    }
    commit(build, kind, k) {
      const id = this.detId();
      const s0 = G.calcStats(id);
      G.state.builds[id] = build;
      const s1 = G.calcStats(id);
      G.STAT_ROWS.forEach((r) => {
        const row = this.$(`.srow[data-k="${r.k}"]`);
        row.classList.remove('inc', 'dec');
        row.querySelector('.sd').textContent = '';
        if (Math.abs(s1[r.k] - s0[r.k]) > 0.001) {
          G.countTo(row.querySelector('.sv'), s0[r.k], s1[r.k], 700, { fmt: r.fmt });
          G.retrigger(row, 'flash');
        }
      });
      this.$('.pvhint').textContent = '';
      const c = D().chars[id];
      if (kind === 'skill') {
        const old = this.$(`.skrow[data-k="${k}"]`);
        const nn = G.html(this.skrowHTML(build.skills[k], k, c.el));
        nn.classList.add('swapped');
        old.replaceWith(nn);
      } else {
        const old = this.$(`.sgl[data-k="${k}"]`);
        const nn = G.html(this.sglHTML(build.sigils[k], k));
        nn.classList.add('swapped');
        old.replaceWith(nn);
        this.$('.det-sg .det-h span').textContent = `${build.sigils.filter(Boolean).length} / ${build.sigils.length}`;
      }
      this.renderTraits();
      // 编队卡同步
      this.refreshCard(this.detIdx, false);
      this.updatePower(null);
    }
    openPicker(kind, k) {
      if (this.mode !== 'detail') return;
      this.mode = 'picker';
      this.pick = { kind, k };
      const id = this.detId();
      const c = D().chars[id];
      const b = G.state.builds[id];
      let rows = '';
      if (kind === 'skill') {
        const cur = b.skills[k];
        rows = c.pool
          .map((s, i) => {
            const S = D().SKILLS[s];
            const eq = b.skills.indexOf(s);
            const isCur = s === cur;
            return `<div class="pkrow brk ${eq >= 0 ? 'cur' : ''}" ${eq >= 0 && !isCur ? '' : `data-act="pk"`} data-v="${s}" style="--i:${i}">${G.skillBadge(s, c.el)}
              <div class="pt"><div class="pn">${S.name}<span class="cdc">CD ${S.cd.toFixed(1)}s</span></div><div class="pd">${S.desc}${S.pow ? ` 威力 ${S.pow}%` : ''}</div></div>${eq >= 0 ? `<span class="eq">${isCur ? '当前槽位' : '已装备 · 槽' + (eq + 1)}</span>` : ''}</div>`;
          })
          .join('');
      } else {
        const cur = b.sigils[k];
        rows = G.state.bag
          .map((s, i) => `<div class="pkrow brk" data-act="pk" data-v="${i}" style="--i:${i}"><div class="med">${G.sigilMedal(s)}</div>
            <div class="pt"><div class="pn">${D().TRAITS[s.t].name}<span class="lvc">Lv ${s.lv}</span></div><div class="pd">${D().RARITY[s.r].name}徽印 · ${this.traitDesc(s)}</div></div></div>`)
          .join('');
        if (cur) rows += `<div class="pkrow brk" data-act="pk" data-v="none" style="--i:${G.state.bag.length}"><div class="med">${G.sigilMedal(null)}</div><div class="pt"><div class="pn">卸下徽印</div><div class="pd">将该徽印放回背包，槽位留空。</div></div></div>`;
      }
      const curName = kind === 'skill' ? D().SKILLS[b.skills[k]].name : b.sigils[k] ? `${D().TRAITS[b.sigils[k].t].name} Lv ${b.sigils[k].lv}` : '空槽位';
      const pk = G.html(`<div class="picker ${kind === 'sigil' ? 'sig' : ''}"><h3>${kind === 'skill' ? '选择技能' : '选择徽印'}<em>${kind === 'skill' ? 'SELECT SKILL' : 'SELECT SIGIL'}</em></h3>
        <div class="rep">替换：<b>${curName}</b> · 悬停查看属性变化</div><div class="pk-list">${rows}</div></div>`);
      this.detEl.appendChild(pk);
      this.pickEl = pk;
      const slot = this.$(kind === 'skill' ? `.skrow[data-k="${k}"]` : `.sgl[data-k="${k}"]`);
      if (slot) slot.classList.add('editing');
      if (!G.touring && !G.exporting) G.UI.setHover(pk.querySelector('.pkrow[data-act]:not(.cur)') || pk.querySelector('.pkrow[data-act]'));
    }
    traitDesc(s) {
      const m = { atk: '攻击力 +' + s.lv * 36, hp: '生命值 +' + G.fmt(s.lv * 160), def: '防御力 +' + s.lv * 22, crit: '暴击率 +' + (s.lv * 0.9).toFixed(1) + '%', critdmg: '暴击伤害 +' + s.lv * 2 + '%', ultgain: '奥义效率 +' + (s.lv * 1.6).toFixed(1) + '%', link: '连携值获取提升', cdr: '技能冷却 -' + (s.lv * 1.2).toFixed(1) + '%', eldmg: '技能威力 +' + s.lv * 2 + '%', brk: '破防时伤害提升' };
      return m[s.t] || '';
    }
    candidateBuild(v) {
      const id = this.detId();
      const b = G.state.builds[id];
      const nb = { skills: b.skills.slice(), sigils: b.sigils.map((s) => (s ? Object.assign({}, s) : null)) };
      if (this.pick.kind === 'skill') nb.skills[this.pick.k] = v;
      else nb.sigils[this.pick.k] = v === 'none' ? null : Object.assign({}, G.state.bag[+v]);
      return nb;
    }
    closePicker() {
      const pk = this.pickEl;
      this.pickEl = null;
      this.mode = 'detail';
      this.preview(null);
      this.$$('.editing').forEach((n) => n.classList.remove('editing'));
      if (pk) { pk.classList.add('out'); this.after(260, () => pk.remove()); }
      const k = this.pick.k;
      G.UI.setHover(this.$(this.pick.kind === 'skill' ? `.skrow[data-k="${k}"]` : `.sgl[data-k="${k}"]`));
    }
    choose(v) {
      const { kind, k } = this.pick;
      const id = this.detId();
      const b = G.state.builds[id];
      if (kind === 'skill' && v === b.skills[k]) return this.closePicker();
      const nb = this.candidateBuild(v);
      if (kind === 'sigil') {
        const old = b.sigils[k];
        if (v !== 'none') G.state.bag.splice(+v, 1);
        if (old) G.state.bag.push(old);
      }
      const pk = this.pickEl;
      this.pickEl = null;
      this.mode = 'detail';
      if (pk) { pk.classList.add('out'); this.after(260, () => pk.remove()); }
      this.commit(nb, kind, k);
      G.UI.setHover(this.$(kind === 'skill' ? `.skrow[data-k="${k}"]` : `.sgl[data-k="${k}"]`));
    }
    closeDetail() {
      const el = this.detEl;
      this.detEl = null;
      this.mode = 'party';
      el.classList.add('out');
      this.after(300, () => el.remove());
      G.UI.setHover(this.$(`.pcard[data-i="${this.detIdx}"]`));
    }
    switchDetail(d) {
      this.detIdx = (this.detIdx + d + 4) % 4;
      this.renderDetail();
    }
    onHover(el) {
      if (this.mode === 'swap') {
        const dpv = this.drawer && this.drawer.querySelector('.dpv');
        if (el && el.classList.contains('ctile')) {
          const { party } = this.swapParty(el.dataset.id);
          this.updatePower(party);
          const a = G.partyPower(), b = G.partyPower(party);
          if (dpv) dpv.innerHTML = b === a ? '' : `队伍战力<b>${G.fmt(a)}</b><span class="ar">→</span><b>${G.fmt(b)}</b><span class="${b > a ? 'inc' : 'dec'}">${b > a ? '▲ +' : '▼ '}${G.fmt(b - a)}</span>`;
        } else { this.updatePower(null); if (dpv) dpv.innerHTML = ''; }
      } else if (this.mode === 'picker') {
        if (el && el.classList.contains('pkrow') && el.dataset.act) this.preview(this.candidateBuild(el.dataset.v));
        else this.preview(null);
      }
    }
    sortie() {
      if (this.mode !== 'party') return;
      this.mode = 'leaving';
      G.App.go('battle', {}, 'sortie', { sub: `${this.q.name} · ${D().TIERS.find((t) => t.id === this.q.tier).name}` });
    }
    act(a, el) {
      const i = el.dataset.i != null ? +el.dataset.i : null;
      if (this.mode === 'party') {
        if (a === 'slot' || a === 'swap') this.openSwap(i);
        else if (a === 'detail') this.openDetail(i);
        else if (a === 'sortie') this.sortie();
        else if (a === 'back') this.back();
      } else if (this.mode === 'swap') {
        if (a === 'pickc') this.pickChar(el.dataset.id);
        else if (a === 'back') this.back();
      } else if (this.mode === 'detail') {
        if (a === 'detprev' || a === 'detnext') this.switchDetail(a === 'detprev' ? -1 : 1);
        else if (a === 'detsw') { if (+el.dataset.i !== this.detIdx) this.switchDetail(+el.dataset.i - this.detIdx); }
        else if (a === 'skill') this.openPicker('skill', +el.dataset.k);
        else if (a === 'sigil') this.openPicker('sigil', +el.dataset.k);
        else if (a === 'back') this.back();
      } else if (this.mode === 'picker') {
        if (a === 'pk') this.choose(el.dataset.v);
        else if (a === 'skill' || a === 'sigil') { this.closePicker(); this.act(a, el); }
        else if (a === 'back') this.back();
      }
    }
    blankClick() {
      if (this.mode === 'swap') this.closeSwap();
      else if (this.mode === 'picker') this.closePicker();
    }
    key(e) {
      const k = e.key.toLowerCase();
      const hov = G.UI.hover;
      if (this.mode === 'party') {
        const cards = this.$$('.pcard');
        if (k === 'arrowleft' || k === 'a') G.navList(cards, -1);
        else if (k === 'arrowright' || k === 'd') G.navList(cards, 1);
        else if (k === 'enter' || k === ' ') {
          if (hov && hov.dataset.act === 'sortie') G.UI.click(hov);
          else { const c = cards.includes(hov) ? hov : cards[0]; G.UI.click(c); }
        } else if (k === 'c') { const c = cards.includes(hov) ? hov : cards[0]; this.openDetail(+c.dataset.i); }
        else if (k === 'f') G.UI.click(this.$('.p-sortie'));
        else if (k === 'arrowdown') G.UI.setHover(this.$('.p-sortie'));
        else if (k === 'arrowup') G.UI.setHover(cards[0]);
        else return false;
        return true;
      }
      if (this.mode === 'swap') {
        const tiles = this.$$('.ctile');
        if (k === 'arrowleft' || k === 'a') G.navList(tiles, -1);
        else if (k === 'arrowright' || k === 'd') G.navList(tiles, 1);
        else if (k === 'enter' || k === ' ') { if (tiles.includes(hov)) G.UI.click(hov); }
        else return false;
        return true;
      }
      if (this.mode === 'detail') {
        const sk = this.$$('.skrow'), sg = this.$$('.sgl');
        const inSk = sk.includes(hov), inSg = sg.includes(hov);
        if (k === 'arrowup' || k === 'arrowdown' || k === 'w' || k === 's') {
          const d = k === 'arrowup' || k === 'w' ? -1 : 1;
          if (inSg) G.navGrid(sg, 0, d, 5);
          else G.navList(sk, d);
        } else if (k === 'arrowright' || k === 'd') {
          if (inSg) G.navGrid(sg, 1, 0, 5);
          else G.UI.setHover(sg[0]);
        } else if (k === 'arrowleft' || k === 'a') {
          if (inSg && sg.indexOf(hov) % 5 !== 0) G.navGrid(sg, -1, 0, 5);
          else G.UI.setHover(sk[inSg ? Math.min(3, Math.floor(sg.indexOf(hov) / 5) * 2) : 0]);
        } else if (k === 'enter' || k === ' ') { if (inSk || inSg) G.UI.click(hov); else G.UI.setHover(sk[0]); }
        else if (k === 'q' || k === 'e') this.switchDetail(k === 'q' ? -1 : 1);
        else return false;
        return true;
      }
      if (this.mode === 'picker') {
        const rows = this.$$('.pkrow[data-act]');
        if (k === 'arrowup' || k === 'w') G.navList(rows, -1);
        else if (k === 'arrowdown' || k === 's') G.navList(rows, 1);
        else if (k === 'enter' || k === ' ') { if (rows.includes(hov)) G.UI.click(hov); }
        else return false;
        return true;
      }
      return true;
    }
    back() {
      if (this.mode === 'picker') this.closePicker();
      else if (this.mode === 'detail') this.closeDetail();
      else if (this.mode === 'swap') this.closeSwap();
      else if (this.mode === 'party') G.App.go('quest', { tier: this.q.tier }, 'wind');
    }
  }
  G.App.register('party', PartyScene);

  // 武器道具格
  G.itemTile2 = (wi, weapon) => `<div class="itile r-${wi.rarity}">${G.rarityPips(wi.rarity)}${G.icon('w-' + weapon)}${G.elBadge(wi.el, 'iel')}</div>`;
})();

        const p = (t - s.t0) / s.dur;

      });

        else if (k === 'arrowup') G.navList(bs, -1);
        else if (k === 'arrowdown') G.navList(bs, 1);
        else if (k === 'enter' || k === ' ') { if (bs.includes(G.UI.hover)) G.UI.click(G.UI.hover); }
        return true;

      if (['1', '2', '3', '4'].includes(k)) {
        this.input();

        this.useSkill(+k - 1, false);
        return true;
      }
      if (k === 'q' || k === 'r') { this.input(); this.tryUlt(); return true; }
      if (k === 'tab') { this.toggleLock(); return true; }
      if (k === 'escape' || k === 'backspace' || k === 'p') {

      return false;

    togglePause(v) {
      if (v === this.paused) return;
      const pz = this.$('.b-pause');
      if (v) {
        this.paused = true;
        this.pauseAt = G.time;
        this.pausedTimers = G.pauseOwner(this);
        pz.innerHTML = `<div class="pz plate rivets"><h2>暂停</h2><div class="en">PAUSE</div><div class="pzb">
          <div class="btn btn-gold brk" data-act="resume"><span class="k">Esc</span>继续战斗</div>
          <div class="btn btn-navy brk" data-act="retry">重新挑战</div>
          <div class="btn btn-navy brk" data-act="retreat">撤退 · 返回任务柜台</div></div></div>`;
        pz.hidden = false;
        G.UI.setHover(pz.querySelector('.btn'));
      } else {
        this.pausedTotal += G.time - this.pauseAt;
        this.paused = false;
        G.resumeOwner(this.pausedTimers || []);
        this.pausedTimers = null;
        pz.hidden = true;
        G.UI.setHover(null);
      }
    }
    back() {
      if (this.paused) this.togglePause(false);
      else if (this.H && this.phase !== 'victory' && this.phase !== 'done') this.togglePause(true);
    }
  }

  /* ---------- 特效绘制 ---------- */
  const TAU = Math.PI * 2;
  const FXD = {
    hit(ctx, f, a) {
      ctx.globalCompositeOperation = 'lighter';
      const R = G.rng(f.seed | 0);
      const n = 9;
      ctx.strokeStyle = f.col;
      ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const ang = R() * TAU;
        const r0 = 8 + 30 * E.outCubic(a), r1 = r0 + (30 + R() * 40) * (1 - a);
        ctx.globalAlpha = 1 - a;
        ctx.lineWidth = 3 * (1 - a) + 0.5;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0);
        ctx.lineTo(f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1);
        ctx.stroke();
      }
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 40);
      g.addColorStop(0, `rgba(255,255,255,${0.9 * (1 - a)})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(f.x - 40, f.y - 40, 80, 80);
    },
    slash(ctx, f, a) {
      ctx.globalCompositeOperation = 'lighter';
      const p = E.outCubic(Math.min(1, a / 0.45));
      const fade = a < 0.45 ? 1 : 1 - (a - 0.45) / 0.55;
      ctx.translate(f.x, f.y);
      ctx.rotate(f.a);
      const R = 110;
      const s0 = -1.2, s1 = s0 + 2.4 * p;
      for (let k = 0; k < 3; k++) {
        ctx.globalAlpha = fade * (k === 0 ? 0.9 : 0.35);
        ctx.strokeStyle = k === 0 ? '#ffffff' : f.col;
        ctx.lineWidth = k === 0 ? 4 : 12 - k * 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, R, R * 0.38, 0, s0, s1);
        ctx.stroke();
      }
    },
    burst(ctx, f, a) {
      FXD.hit(ctx, f, a);
      FXD.ring(ctx, { x: f.x, y: f.y, r0: 10, r1: 120, col: f.col, w: 5 }, a);
    },
    big(ctx, f, a) {
      FXD.burst(ctx, f, a);
      FXD.slash(ctx, Object.assign({}, f, { a: f.a + 1.2 }), a);
    },
    ring(ctx, f, a) {
      ctx.globalCompositeOperation = 'lighter';
      const r = f.r0 + (f.r1 - f.r0) * E.outCubic(a);
      ctx.globalAlpha = (1 - a) * 0.9;
      ctx.strokeStyle = f.col;
      ctx.lineWidth = (f.w || 6) * (1 - a) + 1;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, r, r * (f.flat || 0.6), 0, 0, TAU);
      ctx.stroke();
    },
    flash(ctx, f, a) {
      ctx.globalAlpha = 1 - a;
      ctx.fillStyle = f.col;
      ctx.fillRect(-50, -50, 2020, 1180);
    },
    ember(ctx, f, a, t) {
      ctx.globalCompositeOperation = 'lighter';
      const fade = smooth(0, 0.1, a) * (1 - smooth(0.8, 1, a));
      for (let i = 0; i < 90; i++) {
        const h = G.hash(i * 2.3 + 5), h2 = G.hash(i * 4.9 + 1);
        const life = 1400 + h2 * 1200;
        const p = ((t - f.t0 + h * life) % life) / life;
        const x = 960 + (h - 0.5) * 1800 + Math.sin(t * 0.002 + i) * 30;
        const y = 1100 - p * 900;
        ctx.globalAlpha = fade * Math.sin(Math.PI * p);
        ctx.fillStyle = i % 2 ? '#ffb347' : '#ff6a2a';
        ctx.fillRect(x, y, 3, 5);
      }
    },
    boom(ctx, f, a, t) {
      ctx.globalCompositeOperation = 'lighter';
      const pal = PAL[f.el] || PAL.light;
      const big = f.big ? 1.6 : 1;
      const R = G.rng((f.seed | 0) + 3);
      // 光芒
      ctx.translate(f.x, f.y);
      for (let i = 0; i < 16; i++) {
        const ang = R() * TAU;
        const len = (300 + R() * 500) * big * E.outCubic(Math.min(1, a * 2.5));
        const w = (0.03 + R() * 0.05) * (1 - a);
        ctx.globalAlpha = (1 - a) * 0.8;
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.3, pal[1]);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, len, ang - w, ang + w);
        ctx.closePath();
        ctx.fill();
      }
      for (let k = 0; k < 3; k++) {
        const aa = G.clamp(a * 1.3 - k * 0.12, 0, 1);
        if (aa <= 0) continue;
        const r = (40 + (520 + k * 160) * E.outCubic(aa)) * big;
        ctx.globalAlpha = (1 - aa) * 0.85;
        ctx.strokeStyle = pal[k + 1];
        ctx.lineWidth = (18 - k * 5) * (1 - aa) + 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.62, 0, 0, TAU);
        ctx.stroke();
      }
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 260 * big);
      cg.addColorStop(0, `rgba(255,255,255,${(1 - a) * 0.95})`);
      cg.addColorStop(0.4, `rgba(255,255,255,${(1 - a) * 0.3})`);
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = cg;
      ctx.fillRect(-300 * big, -300 * big, 600 * big, 600 * big);
      // 粒子
      for (let i = 0; i < 40; i++) {
        const ang = R() * TAU, sp = (200 + R() * 600) * big;
        const d = sp * E.outCubic(a);
        ctx.globalAlpha = (1 - a);
        ctx.fillStyle = pal[i % pal.length];
        const s = (2 + R() * 4) * (1 - a * 0.6);
        ctx.fillRect(Math.cos(ang) * d, Math.sin(ang) * d * 0.7, s, s);
      }
    },
    vortex(ctx, f, a, t) {
      const el = f.el;
      const pal = PAL[el] || PAL.wind;
      const inten = smooth(0, 0.12, a) * (1 - smooth(0.86, 1, a));
      const el0 = t - f.t0;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(f.x, f.y);
      const dir = el === 'dark' ? -1 : 1;
      // 旋涡弧线
      for (let i = 0; i < 84; i++) {
        const h = G.hash(i * 3.7 + 1), h2 = G.hash(i * 1.9 + 2), h3 = G.hash(i * 5.3 + 3);
        const grow = el === 'dark' ? 1.2 - 0.7 * a : 0.35 + 0.75 * E.outCubic(Math.min(1, a * 1.6));
        const r = (40 + h * 560) * grow;
        const sp = (0.9 + h2 * 2.4) * dir * (el === 'earth' ? 0.5 : 1);
        const ang = el0 * 0.0042 * sp + h * TAU;
        const span = 0.5 + h3 * 1.5;
        ctx.globalAlpha = inten * (0.2 + 0.55 * h2);
        ctx.strokeStyle = pal[i % pal.length];
        ctx.lineWidth = 1.5 + h3 * 6;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.58, -0.22, ang, ang + span);
        ctx.stroke();
      }
      // 各属性的附加图形
      const R = G.rng(77);
      if (el === 'wind' || el === 'light' || el === 'water') {
        for (let i = 0; i < 46; i++) {
          const h = G.hash(i * 7.1), ph = ((el0 * 0.0006 + h) % 1);
          const rr = (1 - ph) * 520 + 30;
          const an = h * TAU + ph * 7 * dir;
          const x = Math.cos(an) * rr, y = Math.sin(an) * rr * 0.58;
          ctx.globalAlpha = inten * Math.sin(Math.PI * ph);
          ctx.fillStyle = pal[(i + 1) % pal.length];
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(an + 1.2);
          ctx.beginPath();
          ctx.ellipse(0, 0, 11, 3.6, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }
      if (el === 'fire') {
        for (let i = 0; i < 70; i++) {
          const h = G.hash(i * 2.9), ph = ((el0 * 0.0009 + h) % 1);
          ctx.globalAlpha = inten * (1 - ph);
          ctx.fillStyle = pal[i % pal.length];
          ctx.fillRect((h - 0.5) * 900, 260 - ph * 700, 4, 9);
        }
      }
      if (el === 'earth') {
        for (let i = 0; i < 30; i++) {
          const h = G.hash(i * 4.1), an = h * TAU, d = 80 + E.outCubic(a) * (300 + h * 300);
          ctx.globalAlpha = inten;
          ctx.fillStyle = pal[i % pal.length];
          ctx.save();
          ctx.translate(Math.cos(an) * d, Math.sin(an) * d * 0.6);
          ctx.rotate(an + el0 * 0.003);
          ctx.beginPath();
          ctx.moveTo(0, -14); ctx.lineTo(12, 8); ctx.lineTo(-10, 10);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
      // 中心光
      const core = 0.4 + 0.6 * smooth(0.45, 0.66, a) * (1 - smooth(0.7, 0.95, a));
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 340);
      cg.addColorStop(0, `rgba(255,255,255,${inten * core})`);
      cg.addColorStop(0.25, el === 'dark' ? `rgba(40,0,80,${inten * 0.6})` : hexA(pal[2], inten * 0.35 * core));
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = cg;
      ctx.fillRect(-360, -360, 720, 720);
      // 晨星闪光（高潮）
      const fl = smooth(0.58, 0.66, a) * (1 - smooth(0.66, 0.82, a));
      if (fl > 0) {
        ctx.globalAlpha = fl;
        ctx.fillStyle = '#ffffff';
        const s = 520 * (0.6 + 0.4 * fl);
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s * 1.6, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s * 1.6, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
        ctx.fill();
      }
    },
  };

  G.App.register('battle', BattleScene);
})();
</script>
<script>/* =====================================================================

  const medalRing = () => {

      <circle r="160" fill="rgba(8,14,40,.65)" stroke="rgba(255,226,154,.7)" stroke-width="2"/>

  class ResultsScene extends G.Scene {

          <div class="r-crit">${crit.map((c) => `<div class="crow">${G.icon(c.icon)}<span class="cn">${c.n}</span><span class="cv num">${c.v}</span><span class="cg ${c.g === 'A' ? 'a' : ''}">${c.g}</span></div>`).join('')}</div></div>
        <div class="r-col r-mid plate"><div class="r-h"><b>队员贡献</b>CONTRIBUTION<span>伤害量 · 经验值</span></div>
          ${this.party.map((id) => {
