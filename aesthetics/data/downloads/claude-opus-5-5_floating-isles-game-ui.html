# 浮空群岛传说 · Legend of the Floating Isles — 游戏 UI 原型

在 Chrome 中直接双击 `index.html` 打开即可运行（无需服务器、无外部资源，字体使用本机已安装字体）。

## 视觉语言「晨星航图」
深空蓝玻璃底板 · 香槟金细线 · 晨星四芒 · 星盘刻度 · 斜切角。
六属性用「六边形徽章 + 属性色 + 图形」区分，技能用八角形徽章，徽印用菱形纹章，稀有度用铜 / 银 / 金边框与菱形点数区分。

## 界面与流程
标题 → 剧情（对话 / 名词解释 / 章节标题卡）→ 任务柜台 → 编队与养成 → 战斗（含奥义与连锁奥义）→ 结算

左上角「界面目录」可直接跳到第 4 节的任意界面，也可以实时播放内置演示录像。

## 操作
| 场景 | 键位 |
|---|---|
| 通用 | 鼠标悬停 / 点击；方向键选择；Enter / Space 确认；Esc / Backspace / 鼠标右键 返回；画面上的按键提示也可以直接点击 |
| 标题 | 任意键开始；↑↓ 选择 |
| 剧情 | Enter / 点击 推进；A 自动；S 快进；← → / Tab 选择名词 |
| 任务柜台 | Q / E 切换难度；↑↓ 选择任务；Enter 选择 / 出发 |
| 编队 | ← → 选择编队位；Enter 更换角色；C 角色详情；F 出击 |
| 角色详情 | 方向键选择技能 / 徽印；Enter 打开替换列表（悬停即预览属性变化）；Q / E 或点击顶部徽记切换角色 |
| 战斗 | 1–4 技能（或点击技能格）；Q 奥义（或点击奥义按钮，攒满后触发连锁奥义）；Tab 锁定；Esc / 右上角暂停按钮 / 鼠标右键 暂停 |
| 结算 | Space 跳过演出；R 再来一次；Esc 返回 |

不操作时，战斗按编排自动推进：首领登场 → 交战 → 连携时刻 → 超载 → 连锁奥义 → 破防 → 讨伐成功。

## 视频导出接口
```js
window.videoExport.runs                         // ['tour']
await window.videoExport.begin('tour', { fps }) // → { frames }（约 96 秒 × fps）
await window.videoExport.frame(i)               // 第 i 帧对应作品内部时刻 i / fps
window.videoExport.end()
```
所有动效由内部虚拟时钟驱动：CSS 动画在导出模式下按虚拟时刻定格，画布特效与战斗事件使用固定种子，任意帧率下画面一致。

## 目录结构
- `index.html` 入口
- `css/` 基础视觉语言与各界面样式
- `js/core.js` 虚拟时钟、调度、导出同步、缩放、交互、转场、演示光标
- `js/icons.js` 成套图标（属性 / 武器 / 任务类型 / 技能 / 道具 / 界面）
- `js/data.js` 角色、技能、徽印、任务、道具、剧情数据
- `js/bg.js` 程序化背景（天空、云海、浮岛、火山竞技场、星空）
- `js/scene-*.js` 七个界面
- `js/tour.js` 演示录像编排与 `videoExport`

.sk { position: relative; width: 116px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sk .sk-box { position: relative; width: 112px; height: 112px; transition: transform 0.15s; }
.sk .sk-box > svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6)); }
.sk .cdm { position: absolute; inset: 0; clip-path: polygon(29% 4%, 71% 4%, 96% 29%, 96% 71%, 71% 96%, 29% 96%, 4% 71%, 4% 29%); background: conic-gradient(rgba(3, 6, 18, 0.78) var(--p, 0deg), rgba(3, 6, 18, 0.05) 0); }
.sk .cdn { position: absolute; inset: 0; display: grid; place-items: center; font: 600 38px/1 var(--f-num); color: #fff; text-shadow: 0 2px 4px #000; }
.sk .key { position: absolute; left: -8px; top: -8px; min-width: 32px; height: 30px; font-size: 17px; z-index: 2; }
.sk .snm { font: 500 16px/1 var(--f-sans-m); letter-spacing: 0.06em; color: #fff; text-shadow: 0 1px 3px #000; white-space: nowrap; }
.sk.cooling .sk-box > svg { filter: saturate(0.35) brightness(0.7) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6)); }
.sk.cooling .snm { color: rgba(255, 255, 255, 0.55); }
.sk .rdyfx { position: absolute; inset: -10px; pointer-events: none; opacity: 0; }
.sk.rdy .rdyfx { animation: skReady 0.7s var(--ease-out) both; }
.sk .rdyfx::before { content: ''; position: absolute; inset: 0; clip-path: polygon(29% 4%, 71% 4%, 96% 29%, 96% 71%, 71% 96%, 29% 96%, 4% 71%, 4% 29%); background: radial-gradient(circle, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 70%); }
.sk .rdyfx::after { content: 'READY'; position: absolute; left: 0; right: 0; top: -22px; text-align: center; font: italic 700 15px/1 var(--f-num); letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 8px var(--c), 0 1px 2px #000; }
@keyframes skReady { 0% { opacity: 1; transform: scale(1.25); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.sk .glint { position: absolute; inset: 0; clip-path: polygon(29% 4%, 71% 4%, 96% 29%, 96% 71%, 71% 96%, 29% 96%, 4% 71%, 4% 29%); overflow: hidden; pointer-events: none; }
.sk .glint::after { content: ''; position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.7) 50%, transparent 60%); transform: translateX(-80%); }
.sk.rdy .glint::after { animation: glint 0.8s ease-out 0.1s both; }
@keyframes glint { to { transform: translateX(80%); } }
.sk.is-pressed .sk-box, .sk.fire .sk-box { transform: scale(0.88); }
.sk.fire .sk-box::after { content: ''; position: absolute; inset: -16px; border-radius: 50%; border: 3px solid var(--c1); animation: skFire 0.45s ease-out both; }
@keyframes skFire { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.sk.is-pressed { transform: none !important; filter: none; }
.sk.hov .sk-box { transform: translateY(-4px); }
.sk.deny .sk-box { animation: shakeX 0.3s ease; }
.ultb { position: relative; width: 150px; height: 150px; margin-left: 6px; }
.ultb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ultb .uc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ultb .uc b { font: 400 30px/1 var(--f-title); letter-spacing: 0.14em; color: #fff; text-shadow: 0 2px 4px #000; padding-left: 0.14em; }
.ultb .uc span { margin-top: 6px; font: 600 16px/1 var(--f-num); color: var(--gold-300); }
.ultb .key { position: absolute; left: 4px; top: 4px; z-index: 2; min-width: 34px; height: 32px; font-size: 18px; }
.ultb .u-fill { fill: none; stroke-width: 9; transform: rotate(-90deg); transform-origin: 0 0; }
.ultb .u-spin { opacity: 0; transform-origin: 0 0; animation: spin 3s linear infinite; transition: opacity 0.3s; }
.ultb.full .u-spin { opacity: 1; }
.ultb.full .uc b { color: #fff6d6; text-shadow: 0 0 16px #ffd27a, 0 2px 4px #000; }
.ultb.full { animation: ultPulse 1s ease-in-out infinite; }
@keyframes ultPulse { 50% { filter: drop-shadow(0 0 24px rgba(255, 220, 120, 0.9)); } }
.ultb.fire { animation: ultFire 0.5s ease-out; }
@keyframes ultFire { 0% { transform: scale(0.85); filter: brightness(2.4); } 100% { transform: scale(1); } }

/* ---------- 演出：开场 / 横幅 / 胜利 ---------- */
.cine { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.lbx { position: absolute; left: 0; right: 0; height: 120px; background: #000; }
.lbx.top { top: 0; transform: translateY(-100%); }
.lbx.bot { bottom: 0; transform: translateY(100%); }
.cine.on .lbx { animation: lbIn 0.6s var(--ease-out) both; }
.cine.off .lbx.top { animation: lbOutT 0.6s var(--ease-in) both; }
.cine.off .lbx.bot { animation: lbOutB 0.6s var(--ease-in) both; }
@keyframes lbIn { to { transform: none; } }
@keyframes lbOutT { from { transform: none; } to { transform: translateY(-100%); } }
@keyframes lbOutB { from { transform: none; } to { transform: translateY(100%); } }
.intro { position: absolute; left: 0; right: 0; top: 596px; text-align: center; }
.intro .in-pre { font: 500 22px/1 var(--f-sans-m); letter-spacing: 0.5em; color: #ffb08a; animation: inPre 0.9s var(--ease-out) 0.5s both; text-shadow: 0 0 12px rgba(255, 80, 30, 0.8); }
.intro .in-pre em { font: 400 18px/1 var(--f-en); font-style: normal; letter-spacing: 0.4em; margin-left: 14px; color: #ffd2b8; }
@keyframes inPre { from { opacity: 0; letter-spacing: 1.2em; } }
.intro .in-name { margin-top: 22px; font: 400 128px/1 var(--f-title); letter-spacing: 0.12em; color: #fff; white-space: nowrap; }
.intro .in-name span { display: inline-block; animation: inCh 0.8s var(--ease-out) both; animation-delay: calc(0.85s + var(--i) * 0.07s); text-shadow: 0 0 40px rgba(255, 90, 30, 0.8), 0 6px 0 #400; }
@keyframes inCh { from { opacity: 0; transform: translateY(-30px) scale(1.4); filter: blur(12px); } }
.intro .in-line { width: 1100px; height: 2px; margin: 26px auto 0; background: linear-gradient(90deg, transparent, #ff7a3a 20%, #ffe29a 50%, #ff7a3a 80%, transparent); transform: scaleX(0); animation: ccLine 0.9s var(--ease-out) 1.5s both; box-shadow: 0 0 14px rgba(255, 120, 40, 0.9); }
.intro .in-en { margin-top: 22px; font: 400 26px/1 var(--f-en); letter-spacing: 0.6em; padding-left: 0.6em; color: #ffe3c8; animation: fadeUp 0.8s var(--ease-out) 1.6s both; }
.intro .in-info { margin-top: 22px; display: flex; justify-content: center; align-items: center; gap: 22px; font: 500 22px/1 var(--f-sans-m); color: #fff; letter-spacing: 0.1em; animation: fadeUp 0.8s var(--ease-out) 1.85s both; }
.intro .in-info .elb { width: 34px; height: 34px; }
.intro .in-info i { width: 6px; height: 6px; background: #ffe29a; transform: rotate(45deg); }
.intro.out { animation: introOut 0.5s var(--ease-in) both; }
@keyframes introOut { to { opacity: 0; transform: scale(1.06); filter: blur(8px); } }

.banner { position: absolute; left: 0; right: 0; top: 318px; height: 260px; z-index: 32; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: bnIn 0.5s var(--ease-out) both; }
.banner.out { animation: bnOut 0.45s var(--ease-in) both; }
@keyframes bnIn { from { opacity: 0; transform: scaleY(0.3); } }
@keyframes bnOut { to { opacity: 0; transform: scaleY(0.4); } }
.banner::before { content: ''; position: absolute; left: 0; right: 0; top: 30px; bottom: 30px; z-index: -1; background: linear-gradient(90deg, transparent, var(--bb) 20%, var(--bb) 80%, transparent); }
.banner::after { content: ''; position: absolute; left: 10%; right: 10%; top: 30px; height: 2px; z-index: -1; background: linear-gradient(90deg, transparent, var(--bl), transparent); box-shadow: 0 168px 0 var(--bl); }
.banner .bn-main { font: 400 120px/1 var(--f-brush); letter-spacing: 0.14em; padding-left: 0.14em; color: #fff; animation: bnMain 0.7s var(--ease-out) 0.05s both; }
@keyframes bnMain { 0% { opacity: 0; transform: scale(1.8); filter: blur(10px); letter-spacing: 0.5em; } 100% { opacity: 1; transform: none; filter: none; } }
.banner .bn-en { margin-top: 8px; font: 400 26px/1 var(--f-en); letter-spacing: 0.8em; padding-left: 0.8em; color: var(--bl); animation: fadeIn 0.6s ease 0.25s both; }
.banner .bn-sub { margin-top: 18px; display: flex; gap: 12px; font: 500 20px/1 var(--f-sans-m); color: #fff; letter-spacing: 0.1em; animation: fadeUp 0.6s var(--ease-out) 0.35s both; }
.banner .bn-sub .chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 10px; border-radius: 19px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--bl); animation: popIn 0.45s var(--ease-back) both; animation-delay: calc(0.45s + var(--i) * 0.08s); }
.banner .bn-sub .chip .ico { width: 22px; height: 22px; color: var(--bl); }
.banner.link { --bb: rgba(8, 40, 70, 0.82); --bl: #8ff0ff; }
.banner.link .bn-main { background: linear-gradient(180deg, #ffffff, #bff6ff 40%, #ffe29a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(100, 220, 255, 0.8)); }
.banner.over { --bb: rgba(70, 6, 4, 0.86); --bl: #ff9a6a; }
.banner.over .bn-main { color: #fff; text-shadow: 0 0 30px #ff3a1a, 0 0 60px #ff3a1a; animation: bnMain 0.7s var(--ease-out) 0.05s both, overShake 0.12s steps(2) 0.7s 8; }
@keyframes overShake { 50% { transform: translateX(4px); } }
.banner .hz { position: absolute; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(-45deg, #ff4b2a 0 22px, #1a0404 22px 44px); opacity: 0.9; animation: hzMove 0.8s linear infinite; }
.banner .hz.t { top: 0; }
.banner .hz.b { bottom: 0; }
@keyframes hzMove { to { background-position: 62px 0; } }
.banner.brkb { --bb: rgba(10, 30, 60, 0.82); --bl: #bfeaff; }
.banner.brkb .bn-main { font-size: 150px; color: #fff; text-shadow: 0 0 30px #6cc8ff, 0 0 70px #3a7ae8; }
.banner.brkb::before { background: linear-gradient(90deg, transparent, var(--bb) 20%, var(--bb) 80%, transparent); }
.shards { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.shards i { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; background: linear-gradient(135deg, #ffffff, #9fe0ff); clip-path: polygon(50% 0, 100% 70%, 20% 100%); animation: shardFly 1s var(--ease-out) both; opacity: 0.9; }
@keyframes shardFly { from { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.4); opacity: 0; } }

/* 胜利 */
.victory { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 29; overflow: hidden; pointer-events: none; }
.victory .vc-rays { position: absolute; left: 50%; top: 50%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; background: repeating-conic-gradient(from 0deg, rgba(255, 230, 160, 0.16) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 10%, transparent 60%); mask: radial-gradient(circle, #000 10%, transparent 60%); animation: spin 30s linear infinite, fadeIn 0.8s ease both; }
.victory .vc-main { position: relative; font: 400 150px/1 var(--f-title); letter-spacing: 0.2em; padding-left: 0.2em; animation: vcIn 0.9s var(--ease-out) 0.15s both; }
.victory .vc-main span { background: linear-gradient(180deg, #fffdf0 0%, #ffe68a 45%, #f0a030 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.victory .vc-main::before { content: attr(data-t); position: absolute; left: 0.2em; top: 0; z-index: -1; color: transparent; -webkit-text-stroke: 14px #3a1a00; text-shadow: 0 8px 0 #1a0a00, 0 0 50px rgba(255, 200, 80, 0.8); }
@keyframes vcIn { 0% { opacity: 0; transform: scale(2.2); filter: blur(14px); } 100% { opacity: 1; transform: none; filter: none; } }
.victory .vc-en { margin-top: 20px; font: 400 30px/1 var(--f-en); letter-spacing: 0.9em; padding-left: 0.9em; color: #fff1cf; text-shadow: 0 2px 8px #000; animation: fadeUp 0.7s var(--ease-out) 0.6s both; }
.victory .vc-time { margin-top: 26px; font: 600 26px/1 var(--f-num); color: #fff; letter-spacing: 0.1em; text-shadow: 0 2px 6px #000; animation: fadeUp 0.7s var(--ease-out) 0.85s both; }
.victory .vc-time small { font: 500 18px/1 var(--f-sans-m); color: var(--gold-300); margin-right: 12px; letter-spacing: 0.2em; }
.victory .vc-flash { position: absolute; inset: 0; background: #fff; animation: fadeOut 0.9s ease-out both; }

/* ---------- 奥义演出 ---------- */
.cutin { position: absolute; inset: 0; z-index: 36; pointer-events: none; overflow: hidden; --dur: 2.2s; }
.cutin .ci-dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(4, 8, 20, 0.35), rgba(4, 8, 20, 0.8)); animation: ciDim var(--dur) ease both; }
@keyframes ciDim { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
.cutin .ci-band { position: absolute; left: -12%; right: -12%; top: 50%; height: 430px; margin-top: -215px; transform: rotate(-7deg); animation: ciBand var(--dur) cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes ciBand { 0% { clip-path: polygon(0 45%, 0 45%, 0 55%, 0 55%); } 12% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } 86% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; } 100% { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); opacity: 1; } }
.cutin .ci-bg { position: absolute; inset: 0; background: linear-gradient(90deg, var(--cd) 0%, var(--c2) 26%, var(--c) 62%, var(--c1) 100%); }
.cutin .ci-bg::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #fff; box-shadow: 0 0 20px #fff, 0 424px 0 #fff; }
.cutin .ci-lines { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 60px, rgba(255, 255, 255, 0.22) 60px 63px, rgba(255, 255, 255, 0) 63px 170px), repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 37px, rgba(0, 0, 0, 0.12) 37px 41px, rgba(0, 0, 0, 0) 41px 97px); animation: ciLines 0.35s linear infinite; mix-blend-mode: overlay; }
@keyframes ciLines { to { background-position: -340px 0, -194px 0; } }
.cutin .ci-glyph { position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; margin: -310px 0 0 -40px; opacity: 0.16; color: #fff; animation: ciGlyph var(--dur) linear both; }
.cutin .ci-glyph svg { width: 100%; height: 100%; }
@keyframes ciGlyph { from { transform: rotate(-20deg) scale(0.9); } to { transform: rotate(20deg) scale(1.1); } }
.cutin .ci-crest { position: absolute; left: 15%; top: 50%; width: 360px; height: 360px; margin-top: -180px; animation: ciCrest var(--dur) cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.cutin .ci-crest .crest { position: absolute; inset: 24px; width: auto; height: auto; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6)); }
.cutin .ci-crest svg.halo { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 6s linear infinite; }
@keyframes ciCrest { 0% { opacity: 0; transform: translateX(-260px) rotate(-60deg) scale(0.7); } 16% { opacity: 1; transform: none; } 84% { opacity: 1; transform: translateX(30px); } 100% { opacity: 0; transform: translateX(260px); } }
.cutin .ci-txt { position: absolute; left: 40%; top: 50%; transform: translateY(-50%); animation: ciTxt var(--dur) cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes ciTxt { 0% { opacity: 0; transform: translate(220px, -50%); } 16% { opacity: 1; transform: translate(0, -50%); } 84% { opacity: 1; transform: translate(-30px, -50%); } 100% { opacity: 0; transform: translate(-180px, -50%); } }
.cutin .ci-who { display: flex; align-items: center; gap: 16px; }
.cutin .ci-who b { font: 400 64px/1 var(--f-title); letter-spacing: 0.14em; color: #fff; text-shadow: 0 4px 0 var(--cd), 0 0 20px rgba(0, 0, 0, 0.4); }
.cutin .ci-who em { font: 400 22px/1 var(--f-en); font-style: normal; letter-spacing: 0.4em; color: #fff; opacity: 0.9; }
.cutin .ci-who .elb { width: 48px; height: 48px; }
.cutin .ci-who .tag { padding: 6px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); font: 600 16px/1 var(--f-num); letter-spacing: 0.24em; color: var(--c1); border: 1px solid var(--c1); }
.cutin .ci-ult { position: relative; margin-top: 8px; font: 400 150px/1.22 var(--f-brush); color: #fff; white-space: nowrap; letter-spacing: 0.02em; animation: ciUlt var(--dur) var(--ease-out) both; }
.cutin .ci-ult::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; color: var(--cd); -webkit-text-stroke: 14px var(--cd); filter: blur(1px); }
@keyframes ciUlt { 0%, 10% { opacity: 0; transform: scale(1.7); filter: blur(10px); } 22% { opacity: 1; transform: scale(0.97); filter: none; } 30% { transform: scale(1); } 100% { transform: scale(1.03); } }
.cutin .ci-en { margin-top: 20px; font: 400 22px/1 var(--f-en); letter-spacing: 0.32em; color: #fff; text-shadow: 0 2px 0 var(--cd); }
.cutin .ci-voice { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font: 500 30px/1 var(--f-serif-m); letter-spacing: 0.14em; color: #fff; text-shadow: 0 2px 8px #000, 0 0 20px rgba(0, 0, 0, 0.8); animation: ciVoice var(--dur) ease both; }
@keyframes ciVoice { 0%, 18% { opacity: 0; transform: translateY(10px); } 28%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.cutin .ci-flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: ciFlash var(--dur) linear both; }
@keyframes ciFlash { 0%, 84% { opacity: 0; } 90% { opacity: 0.9; } 100% { opacity: 0; } }

/* 连锁计数 */
.b-chain { position: absolute; right: 54px; top: 132px; width: 380px; z-index: 40; pointer-events: none; text-align: right; opacity: 0; transform: translateX(60px); transition: opacity 0.4s, transform 0.5s var(--ease-out); }
.b-chain.on { opacity: 1; transform: none; }
.b-chain .ch-lbl { font: 400 20px/1 var(--f-en); letter-spacing: 0.5em; color: var(--gold-300); text-shadow: 0 2px 4px #000; }
.b-chain .ch-lbl span { font: 500 18px/1 var(--f-sans-m); letter-spacing: 0.2em; color: #fff; margin-left: 6px; }
.b-chain .ch-num { position: relative; height: 150px; margin-top: 4px; }
.b-chain .ch-num b { position: absolute; right: 0; top: 0; font: italic 700 150px/1 var(--f-num); color: #fff; letter-spacing: -0.02em; }
.b-chain .ch-num b span { background: linear-gradient(180deg, #ffffff, #ffe36a 50%, #ff9a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.b-chain .ch-num b::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; color: transparent; -webkit-text-stroke: 12px #2a1004; text-shadow: 0 6px 0 rgba(0, 0, 0, 0.5); }
.b-chain .ch-num b.slam { animation: chSlam 0.5s var(--ease-out) both; }
@keyframes chSlam { 0% { transform: scale(2.4); opacity: 0; filter: blur(8px); } 50% { transform: scale(0.92); opacity: 1; filter: none; } 100% { transform: scale(1); } }
.b-chain .ch-num .ring { position: absolute; right: 20px; top: 20px; width: 110px; height: 110px; border-radius: 50%; border: 4px solid #ffe29a; opacity: 0; }
.b-chain .ch-num .ring.go { animation: chRing 0.6s ease-out both; }
@keyframes chRing { from { transform: scale(0.4); opacity: 1; } to { transform: scale(2); opacity: 0; } }
.b-chain .ch-wait { position: absolute; right: 0; top: 40px; font: 400 40px/1 var(--f-title); letter-spacing: 0.1em; color: #fff; text-shadow: 0 2px 6px #000; }
.b-chain .ch-wait small { display: block; margin-top: 10px; font: 500 16px/1 var(--f-sans-m); letter-spacing: 0.14em; color: var(--gold-300); }
.b-chain .ch-links { display: flex; justify-content: flex-end; align-items: center; gap: 0; margin-top: 8px; height: 56px; }
.b-chain .ch-links .lk { width: 28px; height: 3px; background: linear-gradient(90deg, #ffe29a, #fff); box-shadow: 0 0 8px #ffd27a; }
.b-chain .ch-links .elb { width: 54px; height: 54px; animation: popIn 0.45s var(--ease-back) both; }
.b-chain .ch-bar { margin: 12px 0 0 auto; width: 280px; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.5); overflow: hidden; }
.b-chain .ch-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffe29a, #fff); transform-origin: 0 50%; }
.b-chain .ch-dmg { margin-top: 14px; font: 500 16px/1 var(--f-sans-m); color: rgba(255, 255, 255, 0.85); letter-spacing: 0.1em; text-shadow: 0 1px 3px #000; }
.b-chain .ch-dmg b { font: 600 26px/1 var(--f-num); color: #fff; margin-left: 8px; }
.b-chain.full .ch-lbl { color: #fff; }

/* 全员连锁 */
.fullchain { position: absolute; inset: 0; z-index: 38; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.fullchain .fc-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1), rgba(2, 6, 18, 0.85) 70%); animation: fadeIn 0.3s ease both; }
.fullchain .fc-flash { position: absolute; inset: 0; background: #fff; animation: fadeOut 0.6s ease-out both; }

@keyframes chShakeBig { 25% { transform: rotate(-6deg) translateY(-4px); } 75% { transform: rotate(6deg) translateY(-4px); } }
.chest.leak .glow { opacity: 0.6; transition: opacity 0.6s; }
.chest.open .lid { animation: lidOpen 0.55s var(--ease-back) both; }
@keyframes lidOpen { to { transform: translateY(-34px) rotate(-18deg); } }
.chest.open .glow { animation: glowOpen 1.4s ease-out both; }
@keyframes glowOpen { 0% { opacity: 1; transform: scale(0.4); } 30% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.55; transform: scale(1); } }
.chest.r-gold.open .beam { animation: beamUp 1.6s var(--ease-out) both; }
@keyframes beamUp { 0% { opacity: 0; transform: scaleY(0) scaleX(0.4); } 25% { opacity: 1; transform: scaleY(1) scaleX(1.2); } 100% { opacity: 0.25; transform: scaleY(1) scaleX(0.8); } }
.chest.r-gold.open .crays { animation: raysOn 1.2s ease-out both, spin 10s linear infinite; }
@keyframes raysOn { from { opacity: 0; } to { opacity: 1; } }
.chest .rare { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); white-space: nowrap; font: italic 700 18px/1 var(--f-num); letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 12px #ffc94a, 0 2px 0 #6a3a00; opacity: 0; }

@keyframes rarePop { from { opacity: 0; transform: translate(-50%, 20px) scale(0.5); } to { opacity: 1; transform: translate(-50%, 0); } }
.chest .sparks { position: absolute; left: 50%; top: 80px; width: 0; height: 0; }
.chest .sparks i { position: absolute; width: 8px; height: 8px; margin: -4px; background: #fff6d6; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; }
.chest.open .sparks i { animation: sparkFly 1s var(--ease-out) both; animation-delay: var(--dl); }
@keyframes sparkFly { 0% { opacity: 1; transform: translate(0, 0) scale(1.5); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); } }
.r-items { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
.ri { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; opacity: 0; }
.ri.on { opacity: 1; animation: riPop 0.55s var(--ease-back) both; }
@keyframes riPop { 0% { opacity: 0; transform: translateY(-50px) scale(0.3); } 100% { opacity: 1; transform: none; } }

.ri.r-gold .itile { box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.28), inset 0 3px 0 rgba(255, 255, 255, 0.28), 0 0 26px rgba(255, 200, 90, 0.75); }
.ri .new { position: absolute; }

/* 底部 */

.r-foot .btn { opacity: 0.35; pointer-events: none; transition: opacity 0.4s; }
.scene-results.done .r-foot .btn { opacity: 1; pointer-events: auto; }
.r-foot .btn .ico { width: 24px; height: 24px; }
/* 跳过演出：直接显示最终状态 */

.scene-results.instant .crow.on .cg, .scene-results.instant .rank-med .letter b.final { animation: none; }
.scene-results.instant .lvup.go, .scene-results.instant .mvp.go { animation: none; opacity: 1; }
.scene-results.instant .chest.open .lid { animation: none; transform: translateY(-34px) rotate(-18deg); }
.scene-results.instant .chest.open .glow { animation: none; opacity: 0.55; }

.scene-results.instant .chest.r-gold.open .rare { animation: none; opacity: 1; }

</div>

<svg id="svgdefs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"></svg>

<script>/* =====================================================================
   浮空群岛传说 · UI 原型  —  core.js
   虚拟时钟 / 调度器 / 导出同步 / 舞台缩放 / 场景管理 / 交互 / 转场 / 演示光标

(function () {
  'use strict';

  const G = (window.G = {
    time: 0,          // 作品内部时刻（毫秒），所有动效都由它驱动
    exporting: false, // 视频导出模式
    touring: false,   // 实时播放演示录像
    busy: false,      // 转场中，屏蔽输入
    scale: 1,
    ox: 0,
    oy: 0,
  });

  /* ---------------- math / easing / rng ---------------- */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const E = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuint: (t) => 1 - Math.pow(1 - t, 5),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
  };
  G.clamp = clamp;
  G.lerp = lerp;
  G.E = E;
  G.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  G.hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  };

  /* ---------------- scheduler ---------------- */
  let timers = [];
  let seq = 0;
  function insert(tm) {
    let lo = 0, hi = timers.length;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      const o = timers[m];
      if (o.t < tm.t || (o.t === tm.t && o.id < tm.id)) lo = m + 1;
      else hi = m;
    }
    timers.splice(lo, 0, tm);
  }
  G.at = (t, fn, owner) => {
    const tm = { t, fn, owner, id: ++seq };
    insert(tm);
    return tm.id;
  };
  G.after = (ms, fn, owner) => G.at(G.time + Math.max(0, ms), fn, owner);
  G.cancel = (id) => {
    const i = timers.findIndex((x) => x.id === id);

  };

    timers = timers.filter((x) => x.owner !== owner);
  };
  G.clearTimers = () => {
    timers = [];
  };

  G.pauseOwner = (owner) => {
    const out = [];

      if (x.owner === owner) {

  let animStart = new WeakMap();
  G.resetAnimClock = () => { animStart = new WeakMap(); };
  function registerAnims(t) {

  // 退出导出模式：把未结束的动画恢复播放
  G.releaseAnims = function () {
    for (const a of document.getAnimations()) {
      try {
        const ct = a.effect && a.effect.getComputedTiming ? a.effect.getComputedTiming() : null;

    let guard = 0;
    while (timers.length && timers[0].t <= target) {
      const tm = timers.shift();
      if (tm.t > G.time) G.time = tm.t;
      if (G.exporting) syncAnims(G.time);
      try { tm.fn(); } catch (e) { console.error(e); }
      if (G.exporting) registerAnims(G.time);
      if (++guard > 200000) break;
    }
    if (target > G.time) G.time = target;
    for (const fn of Array.from(updaters)) {
      try { fn(G.time); } catch (e) { console.error(e); }
    }

  };

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(100, Math.max(0, now - lastReal));

    if (G.exporting) return;
    G.advance(G.time + dt);

  G.startLoop = () => {
    lastReal = performance.now();
    requestAnimationFrame(loop);
  };
  G.resetRealClock = () => { lastReal = performance.now(); };

  /* ---------------- DOM helpers ---------------- */
  G.$ = (sel, root) => (root || document).querySelector(sel);
  G.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  G.html = (str) => {
    const t = document.createElement('template');
    t.innerHTML = str.trim();
    return t.content.firstElementChild;
  };
  G.fmt = (n) => Math.round(n).toLocaleString('en-US');
  G.pad = (n, w = 2) => String(Math.floor(n)).padStart(w, '0');
  G.fmtTime = (ms, cs = true) => {
    ms = Math.max(0, ms);
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), c = Math.floor((ms % 1000) / 10);

  const canvases = new Set();
  function sizeCanvas(c) {

    const k = Math.max(0.25, Math.min(G.scale * dpr * c.q, c.maxK || 4));

    const W = Math.max(1, Math.round(c.w * k)), H = Math.max(1, Math.round(c.h * k));

    c.el.style.height = c.h + 'px';

    if (c.onResize) c.onResize(c);

    sizeCanvas(c);

  G.begin2d = (c) => {
    c.ctx.setTransform(c.k, 0, 0, c.k, 0, 0);
    c.ctx.globalAlpha = 1;
    c.ctx.globalCompositeOperation = 'source-over';
    c.ctx.filter = 'none';
    c.ctx.clearRect(0, 0, c.w, c.h);

  /* ---------------- 补间数值 ---------------- */
  class TV {
    constructor(v, clock) {

    get(t) {

      if (t <= this.t0) return this.a;
      return lerp(this.a, this.b, this.ease((t - this.t0) / this.d));

      this.a = this.get(t); this.b = v; this.t0 = t; this.d = d; this.ease = ease;

      const s = tw.fmt(v);
      if (tw.el.textContent !== s) tw.el.textContent = s;
      if (p >= 1) { numTweens.delete(tw); tw.el._tw = null; }

  class Scene {
    constructor() { this._frames = []; this.root = null; }
    after(ms, fn) { return G.after(ms, fn, this); }
    at(t, fn) { return G.at(t, fn, this); }
    onFrame(fn) { this._frames.push(G.onFrame(fn)); }
    $(s) { return this.root.querySelector(s); }
    $$(s) { return Array.from(this.root.querySelectorAll(s)); }
    enter() {}
    exit() {}
    act() {}
    key() { return false; }
    back() {}

      this._frames.forEach((off) => off());

    }
  }
  G.Scene = Scene;

  const App = (G.App = {
    scene: null,
    id: null,
    defs: {},
    register(id, cls) { this.defs[id] = cls; },
    swap(id, params) {

      S.id = id;
      S.root = G.html(`<div class="scene scene-${id}"></div>`);
      G.$('#scenes').appendChild(S.root);
      this.scene = S;
      this.id = id;
      document.documentElement.dataset.scene = id;
      if (G.TOC) G.TOC.mark(id);
      S.enter(params || {});
    },
    go(id, params, trans = 'wind', opts = {}) {
      if (!trans || trans === 'none') { this.swap(id, params); return 0; }
      return G.Trans.run(trans, () => this.swap(id, params), opts);
    },
  });

  /* ---------------- 交互：悬停 / 按下 / 确认 ---------------- */
  const UI = (G.UI = {
    hover: null,
    byMouse: false,
    setHover(el, byMouse = false) {
      if (this.hover === el) return;
      if (this.hover) this.hover.classList.remove('hov');
      this.hover = el;
      this.byMouse = byMouse;
      if (el) {
        el.classList.add('hov');
        if (App.scene && App.scene.onHover) App.scene.onHover(el);
      } else if (App.scene && App.scene.onHover) App.scene.onHover(null);
    },
    activate(el) {
      if (!el || el.classList.contains('dis') || !el.isConnected) return;
      if (G.busy) return;
      if (App.scene && App.scene.root && !App.scene.root.contains(el)) return;
      const act = el.dataset.act;
      if (act && App.scene) App.scene.act(act, el);
    },
    // 完整的模拟点击：按下 → 弹起 → 确认
    click(el, hold = 120) {
      if (!el) return;
      this.setHover(el);
      el.classList.add('is-pressed');
      G.after(hold, () => {
        el.classList.remove('is-pressed');
        this.activate(el);
      });
    },
    pressFlash(el, hold = 140) {
      if (!el) return;
      el.classList.add('is-pressed');
      G.after(hold, () => el.classList.remove('is-pressed'));
    },
  });

  function inputBlocked() {
    return G.exporting || G.touring || G.busy;
  }
  function actEl(t) {
    if (!t || !t.closest) return null;
    const el = t.closest('[data-act],[data-hov]');
    return el && G.stage.contains(el) ? el : null;
  }
  function wireInput() {
    const st = G.stage;
    st.addEventListener('pointerover', (e) => {
      if (inputBlocked()) return;
      const el = actEl(e.target);
      if (el) UI.setHover(el, true);
      else if (UI.byMouse && UI.hover && !UI.hover.dataset.sticky) UI.setHover(null);
    });
    st.addEventListener('pointerdown', (e) => {
      if (inputBlocked() || e.button !== 0) return;
      const el = actEl(e.target);
      if (el && el.dataset.act) el.classList.add('is-pressed');
      if (App.scene && App.scene.pointerDown) App.scene.pointerDown(e, el);
    });
    window.addEventListener('pointerup', () => {
      G.$$('.is-pressed', st).forEach((n) => { if (!n._kp) n.classList.remove('is-pressed'); });
    });
    st.addEventListener('click', (e) => {
      if (inputBlocked()) return;
      const el = actEl(e.target);
      if (el && el.dataset.act) UI.activate(el);
      else if (App.scene && App.scene.blankClick) App.scene.blankClick(e);
    });
    st.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (inputBlocked()) return;
      if (App.scene) App.scene.back();
    });
    window.addEventListener('keydown', (e) => {
      if (G.touring && e.key === 'Escape') { G.Tour && G.Tour.stopLive(); e.preventDefault(); return; }
      if (inputBlocked()) { if (!G.exporting) e.preventDefault(); return; }
      if (['Tab', ' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.key)) e.preventDefault();
      const S = App.scene;
      if (!S) return;
      if (S.key(e) === true) return;
      if (e.key === 'Escape' || e.key === 'Backspace') S.back();
    });
    window.addEventListener('keyup', (e) => {
      if (inputBlocked()) return;
      const S = App.scene;
      if (S && S.keyUp) S.keyUp(e);
    });
  }
  G.wireInput = wireInput;

  // 通用线性导航（键盘方向键在一组元素中移动选中）
  G.navList = function (items, dir, opts = {}) {
    if (!items.length) return null;
    let i = items.indexOf(UI.hover);
    if (i < 0) i = opts.start != null ? opts.start : 0;
    else {
      i += dir;
      if (opts.wrap) i = (i + items.length) % items.length;
      else i = clamp(i, 0, items.length - 1);
    }
    UI.setHover(items[i]);
    return items[i];
  };
  // 网格导航
  G.navGrid = function (items, dx, dy, cols) {
    if (!items.length) return null;
    let i = items.indexOf(UI.hover);
    if (i < 0) i = 0;
    else {
      let r = Math.floor(i / cols), c = i % cols;
      c = clamp(c + dx, 0, cols - 1);
      r = clamp(r + dy, 0, Math.ceil(items.length / cols) - 1);
      i = Math.min(items.length - 1, r * cols + c);
    }
    UI.setHover(items[i]);
    return items[i];
  };

  /* ---------------- 转场 ---------------- */
  const Trans = (G.Trans = {
    tok: null,
    cancel() {
      if (this.tok) G.cancelOwner(this.tok);
      this.tok = null;
      G.$$('#overlay .tr').forEach((n) => n.remove());
      G.busy = false;
    },
    run(type, swap, opts = {}) {
      const ov = G.$('#overlay');
      this.cancel();
      const tok = (this.tok = {});
      const spec = this.types[type] || this.types.wind;
      const node = G.html(spec.html(opts));
      ov.appendChild(node);
      G.busy = true;
      G.UI.setHover(null);
      if (spec.start) spec.start(node, opts);
      G.after(spec.cover, () => {
        swap();
        node.classList.add('out');
        if (spec.mid) spec.mid(node, opts);
      }, tok);
      G.after(spec.cover + spec.reveal, () => {
        node.remove();
        G.busy = false;
        if (opts.done) opts.done();
      }, tok);
      return spec.cover + spec.reveal;
    },
    types: {
      wind: {
        cover: 520,
        reveal: 620,
        html: () => `<div class="tr tr-wind"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i>
            <div class="tr-emb"><svg viewBox="-50 -50 100 100"><circle r="30" class="r1"/><circle r="40" class="r2"/><path class="st" d="M0 -26 Q0 0 26 0 Q0 0 0 26 Q0 0 -26 0 Q0 0 0 -26Z"/></svg></div></div>`,
      },
      star: {
        cover: 640,
        reveal: 700,
        html: (o) => {
          const x = o.x != null ? o.x : 960, y = o.y != null ? o.y : 540;
          return `<div class="tr tr-star" style="--x:${x}px;--y:${y}px">
            <svg class="cov" viewBox="0 0 1920 1080" preserveAspectRatio="none">
              <defs><radialGradient id="trsg" cx="${x / 19.2}%" cy="${y / 10.8}%" r="80%"><stop offset="0" stop-color="#1b3a7a"/><stop offset=".55" stop-color="#0b1838"/><stop offset="1" stop-color="#050b1d"/></radialGradient>
              <mask id="trsm"><rect width="1920" height="1080" fill="#fff"/><path class="hole" d="M960 300 Q960 540 1200 540 Q960 540 960 780 Q960 540 720 540 Q960 540 960 300Z" fill="#000"/></mask></defs>
              <g class="grow" style="transform-origin:${x}px ${y}px"><path d="M${x} ${y - 160} Q${x} ${y} ${x + 160} ${y} Q${x} ${y} ${x} ${y + 160} Q${x} ${y} ${x - 160} ${y} Q${x} ${y} ${x} ${y - 160}Z" fill="url(#trsg)" stroke="#ffe29a" stroke-width="2"/></g>
              <rect class="full" width="1920" height="1080" fill="url(#trsg)" mask="url(#trsm)"/>
            </svg>
            <div class="tr-emb big"><svg viewBox="-50 -50 100 100"><circle r="30" class="r1"/><circle r="40" class="r2"/><path class="st" d="M0 -26 Q0 0 26 0 Q0 0 0 26 Q0 0 -26 0 Q0 0 0 -26Z"/></svg></div>
          </div>`;
        },
      },
      flash: {
        cover: 380,
        reveal: 900,
        html: () => `<div class="tr tr-flash"></div>`,
      },
      fade: {
        cover: 600,
        reveal: 700,
        html: () => `<div class="tr tr-fade"></div>`,
      },
      sortie: {
        cover: 1250,
        reveal: 700,
        html: (o) => `<div class="tr tr-sortie">
            <i class="lb top"></i><i class="lb bot"></i>
            <div class="so-line"></div>
            <div class="so-up"><b>出击</b></div><div class="so-down"><em>SORTIE</em><small>${o.sub || ''}</small></div>
          </div>`,
      },
    },
  });

  /* ---------------- 演示光标 ---------------- */
  const Cursor = (G.Cursor = {
    el: null,
    x: 960, y: 620,
    seg: null,
    visible: false,
    init() {
      this.el = G.$('#tcursor');
      G.onFrame(() => this.update());
    },
    reset() {
      this.seg = null;
      this.x = 1180; this.y = 760;
      this.hide(true);
    },
    show() {
      this.visible = true;
      this.el.classList.add('on');
    },
    hide(instant) {
      this.visible = false;
      this.el.classList.remove('on');
      if (instant) this.el.classList.remove('click');
    },
    pos(t) {
      const s = this.seg;
      if (!s) return { x: this.x, y: this.y };
      if (t >= s.t1) return { x: s.x1, y: s.y1 };
      if (t <= s.t0) return { x: s.x0, y: s.y0 };
      const p = s.ease((t - s.t0) / (s.t1 - s.t0));
      // 轻微的弧线，让轨迹更像手的移动
      const mx = lerp(s.x0, s.x1, p), my = lerp(s.y0, s.y1, p);
      const arc = Math.sin(p * Math.PI) * s.arc;
      return { x: mx + s.nx * arc, y: my + s.ny * arc };
    },
    resolve(target, ox = 0, oy = 0) {
      if (!target) return { x: this.x, y: this.y };
      if (typeof target === 'string') target = G.$(target, G.stage);
      if (!target) return { x: this.x, y: this.y };
      if (target.nodeType) {
        const r = G.rectOf(target);
        return { x: r.cx + ox, y: r.cy + oy, el: target };
      }
      return { x: target.x + ox, y: target.y + oy };
    },
    moveTo(target, dur = 600, opts = {}) {
      const p0 = this.pos(G.time);
      const p1 = this.resolve(target, opts.ox || 0, opts.oy || 0);
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      const len = Math.hypot(dx, dy) || 1;
      this.seg = {
        t0: G.time, t1: G.time + dur,
        x0: p0.x, y0: p0.y, x1: p1.x, y1: p1.y,
        nx: -dy / len, ny: dx / len,
        arc: Math.min(60, len * 0.12) * (opts.arcDir || 1),
        ease: opts.ease || E.inOutCubic,
      };
      this.x = p1.x; this.y = p1.y;
      if (p1.el && opts.hover !== false) G.after(dur * 0.82, () => G.UI.setHover(p1.el));
      return p1.el;
    },
    click(el) {
      G.retrigger(this.el, 'click');
      const p = this.pos(G.time);
      const rp = G.html(`<div class="cur-ripple" style="left:${p.x}px;top:${p.y}px"><i></i><i></i></div>`);
      G.$('#overlay').appendChild(rp);
      G.after(700, () => rp.remove());
      if (el === undefined && this.seg) el = null;
      if (el) G.UI.click(el);
    },
    update() {
      if (!this.el) return;
      const p = this.pos(G.time);
      this.el.style.transform = `translate(${p.x - 4}px,${p.y - 3}px)`;
    },
  });

  G.stage = document.getElementById('stage');
})();
</script>

    晨星号: { en: 'The Morning Star', cat: '飞空艇', text: '艾琳一行的飞空艇。船首镶着一枚永不熄灭的晨星石，是空行者公会登记在册的第 108 号船。' },
    赫菲拉: { en: 'Hephyra', cat: '地点 · 火山岛', text: '群岛南端的火山岛。山巅的熔岩竞技场是古代空行者的试炼之地。' },
  };
  const STORY = {
    chapter: { num: '第三章', en: 'CHAPTER III', name: '焰冠苏醒', enName: 'THE FLAME CROWN AWAKENS', tag: '沉睡于熔岩深处的巨兽，睁开了它的眼睛。' },
    place: '晨星号 · 甲板',
    time: '黄昏',
    lines: [
      { who: 'rock', text: '喂——舵手！船底都快被烤熟了，下面这到底是哪座岛啊？' },
      { who: 'thea', text: '是火山岛「{赫菲拉}」。公会的情报说，{天渊兽}就沉睡在山巅的熔岩竞技场里。' },
      { who: 'baldo', text: '哈哈！能让整座岛都发烫的家伙，正好拿来给我的斧头热热身。' },
      { who: 'erin', text: '它已经醒了。再这样下去，周围的岛都会被拖进{云海}。' },
      { who: 'erin', text: '我们是{空行者}——{晨星号}，准备降落！' },
    ],
  };

  G.DATA = { ELEMENTS, WEAPONS, RARITY, QTYPES, TIERS, TRAITS, SKILLS, chars: CHARS, CHAR_ORDER, SIGIL_BAG, FINISHERS, ITEMS, QUESTS, GLOSSARY, STORY };

  /* ---------- 可变状态 ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  G.resetState = function () {
    const builds = {};
    for (const id of CHAR_ORDER) builds[id] = { skills: CHARS[id].skills.slice(), sigils: clone(CHARS[id].sigils) };
    G.state = {
      party: ['erin', 'rock', 'thea', 'rin'],
      builds,
      tier: 'normal',
      quest: 'x1',
      bag: clone(SIGIL_BAG),
      result: null,
      storyLine: 0,
    };
  };
  G.resetState();

  G.questById = (id) => {
    for (const k in QUESTS) for (const q of QUESTS[k]) if (q.id === id) return Object.assign({ tier: k }, q);
    return null;
  };

  /* ---------- 数值计算 ---------- */
  G.traitSum = function (sigils) {
    const sum = {};
    for (const s of sigils) if (s) sum[s.t] = (sum[s.t] || 0) + s.lv;
    return sum;
  };
  G.calcStats = function (id, build) {
    const c = CHARS[id];
    build = build || G.state.builds[id];
    const tr = G.traitSum(build.sigils);
    const lv = (k) => Math.min(tr[k] || 0, TRAITS[k].max);
    let pas = { ultgain: 0, atk: 0 };
    build.skills.forEach((s) => { const p = SKILLS[s].passive; if (p) for (const k in p) pas[k] = (pas[k] || 0) + p[k]; });
    const atk = Math.round((c.base.atk + c.weaponItem.atk + lv('atk') * 36) * (1 + (pas.atk || 0) / 100));
    const hp = c.base.hp + c.weaponItem.hp + lv('hp') * 160;
    const def = c.base.def + lv('def') * 22;
    const crit = +(c.base.crit + lv('crit') * 0.9).toFixed(1);
    const critdmg = c.base.critdmg + lv('critdmg') * 2;
    const ultgain = +(c.base.ultgain + lv('ultgain') * 1.6 + (pas.ultgain || 0)).toFixed(1);
    const skillRaw = build.skills.reduce((a, s) => a + SKILLS[s].pow, 0);
    const skillpow = Math.round(skillRaw * (1 + lv('eldmg') * 0.02));
    const cdAvg = +((build.skills.reduce((a, s) => a + SKILLS[s].cd, 0) / 4) * (1 - lv('cdr') * 0.012)).toFixed(2);
    const power = Math.round(atk * 0.35 + hp * 0.04 + def * 0.3 + crit * 12 + critdmg * 3 + skillpow * 0.12 + ultgain * 4 + (lv('link') + lv('brk')) * 5 - cdAvg * 8);
    return { power, atk, hp, def, crit, critdmg, ultgain, skillpow, cd: cdAvg };
  };
  G.STAT_ROWS = [
    { k: 'power', name: '战力', en: 'POWER', icon: 'ui-power', fmt: (v) => G.fmt(v) },
    { k: 'atk', name: '攻击力', en: 'ATK', icon: 'ui-atkup', fmt: (v) => G.fmt(v) },
    { k: 'hp', name: '生命值', en: 'HP', icon: 'ui-heart', fmt: (v) => G.fmt(v) },
    { k: 'def', name: '防御力', en: 'DEF', icon: 'ui-shield', fmt: (v) => G.fmt(v) },
    { k: 'crit', name: '暴击率', en: 'CRIT', icon: 'ui-crit', fmt: (v) => v.toFixed(1) + '%' },
    { k: 'critdmg', name: '暴击伤害', en: 'CRIT DMG', icon: 'ui-critdmg', fmt: (v) => Math.round(v) + '%' },
    { k: 'ultgain', name: '奥义效率', en: 'ULT GAIN', icon: 'ui-ult', fmt: (v) => v.toFixed(1) + '%' },
    { k: 'skillpow', name: '技能威力', en: 'SKILL PWR', icon: 'ui-skill', fmt: (v) => G.fmt(v) + '%' },
    { k: 'cd', name: '平均冷却', en: 'AVG CD', icon: 'ui-time', fmt: (v) => v.toFixed(1) + 's', lowerBetter: true },
  ];
  G.partyPower = (party) => (party || G.state.party).reduce((a, id) => a + G.calcStats(id).power, 0);
})();
</script>
<script>/* =====================================================================
   bg.js — 衬托界面的简洁背景：天空 / 云海 / 远岛 / 火山竞技场 / 星空
   全部程序化绘制，画面完全由时刻 t 决定（可逐帧导出）
   ===================================================================== */
(function () {
  'use strict';
  const TAU = Math.PI * 2;

  /* ---------- 精灵生成 ---------- */
  function mk(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }
  // 积云：先叠出柔和的密度，再按高度上色，最后逐团加受光与背光
  function cloudSprite(seed, W, H, pal, res = 1) {
    const cv = mk(W * res, H * res);
    const x = cv.getContext('2d');
    x.scale(res, res);
    const R = G.rng(seed);
    const puffs = [];
    const flat = pal.flat || 0;
    const n = 16 + Math.floor(R() * 10);
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n + (R() - 0.5) * 0.04;
      const bell = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, u))), 0.8);
      const r = H * (0.1 + (0.2 - flat * 0.08) * bell * (0.6 + 0.4 * R()));
      puffs.push({ cx: W * (0.08 + 0.84 * u), cy: H * 0.78 - r * 0.55 - H * (0.18 - flat * 0.1) * bell * R(), r });
    }
    for (let i = 0; i < n * 0.8; i++) {
      const u = 0.16 + 0.68 * R();
      const bell = Math.sin(Math.PI * u);
      const r = H * (0.07 + (0.15 - flat * 0.06) * bell * (0.5 + R() * 0.5));
      puffs.push({ cx: W * u, cy: H * 0.64 - H * (0.3 - flat * 0.16) * bell * R(), r });
    }
    let top = H, bot = 0;
    for (const p of puffs) { top = Math.min(top, p.cy - p.r); bot = Math.max(bot, p.cy + p.r); }
    // 1 密度
    for (const p of puffs) {
      const g = x.createRadialGradient(p.cx, p.cy, 0, p.cx, p.cy, p.r);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.62, 'rgba(255,255,255,.96)');
      g.addColorStop(0.84, 'rgba(255,255,255,.55)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(p.cx, p.cy, p.r, 0, TAU); x.fill();
    }
    // 2 按高度上色
    x.globalCompositeOperation = 'source-in';
    const vg = x.createLinearGradient(0, top, 0, bot);
    vg.addColorStop(0, pal.light);
    vg.addColorStop(0.42, pal.mid);
    vg.addColorStop(0.82, pal.shadow);
    vg.addColorStop(1, pal.base || pal.shadow);
    x.fillStyle = vg;
    x.fillRect(0, 0, W, H);
    // 3 逐团的受光与背光
    x.globalCompositeOperation = 'source-atop';
    const lx = pal.lx != null ? pal.lx : -0.35, ly = pal.ly != null ? pal.ly : -0.94;
    for (const p of puffs) {
      const gs = x.createRadialGradient(p.cx - lx * p.r * 0.45, p.cy - ly * p.r * 0.45, 0, p.cx - lx * p.r * 0.45, p.cy - ly * p.r * 0.45, p.r * 0.9);
      gs.addColorStop(0, pal.shade || 'rgba(60,70,120,.22)');
      gs.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = gs;
      x.fillRect(p.cx - p.r * 2, p.cy - p.r * 2, p.r * 4, p.r * 4);
    }
    for (const p of puffs) {
      const hx = p.cx + lx * p.r * 0.42, hy = p.cy + ly * p.r * 0.42;
      const g = x.createRadialGradient(hx, hy, 0, hx, hy, p.r * 0.78);
      g.addColorStop(0, pal.hl || pal.light);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.globalAlpha = pal.hlA == null ? 0.7 : pal.hlA;
      x.fillStyle = g;
      x.fillRect(hx - p.r, hy - p.r, p.r * 2, p.r * 2);
    }
    x.globalAlpha = 1;
    // 4 底部渐隐
    x.globalCompositeOperation = 'destination-out';
    const fo = x.createLinearGradient(0, bot - (bot - top) * 0.22, 0, bot);
    fo.addColorStop(0, 'rgba(0,0,0,0)');
    fo.addColorStop(1, 'rgba(0,0,0,1)');
    x.fillStyle = fo;
    x.fillRect(0, 0, W, H);
    return cv;
  }
  // 浮岛：草顶 + 倒锥形岩体（岩层、岩面、垂根）+ 树冠 + 瀑布，整体再罩一层空气透视
  function islandSprite(seed, W, H, pal, res = 1) {
    const cv = mk(W * res, H * res);
    const x = cv.getContext('2d');
    x.scale(res, res);
    const R = G.rng(seed);
    const top = H * 0.27;
    const L = W * 0.05, Rr = W * 0.95;
    const tipX = W * (0.4 + R() * 0.2), tipY = H * (0.86 + R() * 0.1);
    const sunR = (pal.sun == null ? 0.25 : pal.sun) >= 0.5;
    // ---- 岩体轮廓
    const pts = [[L, top + H * 0.02]];
    const N = 30;
    for (let i = 1; i < N; i++) {
      const u = i / N;
      const px = L + (Rr - L) * u;
      const side = px < tipX ? (px - L) / (tipX - L) : (Rr - px) / (Rr - tipX);
      const depth = Math.pow(G.clamp(side, 0, 1), 1.7);
      const jag = (i % 2 ? 1 : -0.4) * H * 0.035 * (0.3 + depth) * R();
      pts.push([px + (R() - 0.5) * W * 0.012, top + H * 0.05 + depth * (tipY - top - H * 0.05) + jag]);
    }
    pts.push([Rr, top + H * 0.02]);
    const body = () => { x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath(); };
    body();
    const rg = x.createLinearGradient(0, top, 0, tipY);
    rg.addColorStop(0, pal.cliff);
    rg.addColorStop(0.45, pal.rock);
    rg.addColorStop(1, pal.fade);
    x.fillStyle = rg;
    x.fill();
    x.save();
    body();
    x.clip();
    // 岩层：横向的明暗带
    for (let i = 0; i < 7; i++) {
      const yy = top + H * (0.06 + i * 0.075) + R() * H * 0.02;
      x.fillStyle = i % 2 ? 'rgba(255,255,255,.07)' : 'rgba(20,20,50,.09)';
      x.beginPath();
      x.moveTo(L - 10, yy);
      for (let k = 0; k <= 16; k++) x.lineTo(L + (Rr - L) * (k / 16), yy + Math.sin(k * 1.7 + i) * H * 0.008 + (R() - 0.5) * H * 0.01);
      x.lineTo(Rr + 10, yy + H * 0.03);
      x.lineTo(L - 10, yy + H * 0.03);
      x.fill();
    }
    // 岩面：向下收拢的楔形，形成棱角
    for (let i = 0; i < 9; i++) {
      const u = 0.08 + 0.84 * R();
      const px = L + (Rr - L) * u;
      const w = W * (0.025 + R() * 0.04);
      const len = H * (0.2 + R() * 0.45);
      x.fillStyle = (px < tipX) === sunR ? 'rgba(15,15,45,.14)' : 'rgba(255,245,230,.1)';
      x.beginPath();
      x.moveTo(px - w, top + H * 0.04);
      x.lineTo(px + w, top + H * 0.04);
      x.lineTo(px + (tipX - px) * 0.35, top + len);
      x.closePath();
      x.fill();
    }
    // 受光面与背光面
    const lg = x.createLinearGradient(L, 0, Rr, 0);
    const lit = pal.lit || 'rgba(255,230,200,.35)';
    lg.addColorStop(0, sunR ? 'rgba(15,15,50,.22)' : lit);
    lg.addColorStop(0.55, 'rgba(0,0,0,0)');
    lg.addColorStop(1, sunR ? lit : 'rgba(15,15,50,.22)');
    x.fillStyle = lg;
    x.fillRect(0, 0, W, H);
    // 草皮下的阴影
    const ao = x.createLinearGradient(0, top, 0, top + H * 0.08);
    ao.addColorStop(0, 'rgba(10,10,40,.35)');
    ao.addColorStop(1, 'rgba(10,10,40,0)');
    x.fillStyle = ao;
    x.fillRect(0, top, W, H * 0.08);
    x.restore();
    // ---- 垂根
    x.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const u = 0.1 + 0.8 * R();
      const px = L + (Rr - L) * u;
      const len = H * (0.08 + R() * 0.16);
      x.strokeStyle = pal.root || 'rgba(60,70,100,.35)';
      x.lineWidth = Math.max(1, W * (0.003 + R() * 0.003));
      x.beginPath();
      x.moveTo(px, top + H * 0.045);
      x.bezierCurveTo(px + (R() - 0.5) * 18, top + len * 0.4, px + (R() - 0.5) * 22, top + len * 0.7, px + (R() - 0.5) * 10, top + len);
      x.stroke();
    }
    // ---- 草顶
    const cap = () => {
      x.beginPath();
      x.moveTo(L - W * 0.02, top + H * 0.02);
      for (let i = 0; i <= 28; i++) {
        const u = i / 28;
        x.lineTo(L + (Rr - L) * u, top - H * 0.028 * Math.sin(Math.PI * u) - R() * H * 0.007);
      }
      x.lineTo(Rr + W * 0.02, top + H * 0.02);
      x.quadraticCurveTo(W / 2, top + H * 0.085, L - W * 0.02, top + H * 0.02);
      x.closePath();
    };
    cap();
    const tg = x.createLinearGradient(0, top - H * 0.035, 0, top + H * 0.06);
    tg.addColorStop(0, pal.topHi || pal.top);
    tg.addColorStop(0.55, pal.top);
    tg.addColorStop(1, pal.cliff);
    x.fillStyle = tg;
    x.fill();
    // 草沿高光
    x.strokeStyle = pal.topHi || 'rgba(255,255,255,.4)';
    x.globalAlpha = 0.6;
    x.lineWidth = Math.max(1, H * 0.006);
    x.beginPath();
    for (let i = 0; i <= 28; i++) {
      const u = i / 28;
      const px = L + (Rr - L) * u, py = top - H * 0.028 * Math.sin(Math.PI * u);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.stroke();
    x.globalAlpha = 1;
    // ---- 树冠
    const nt = 3 + Math.floor(R() * 4);
    for (let i = 0; i < nt; i++) {
      const u = 0.14 + 0.72 * R();
      const tx = L + (Rr - L) * u, r = H * (0.028 + R() * 0.03);
      const ty = top - H * 0.026 * Math.sin(Math.PI * u) - r * 0.55;
      const blobs = [[0, 0, 1], [r * 0.85, r * 0.3, 0.72], [-r * 0.8, r * 0.35, 0.62], [r * 0.2, -r * 0.55, 0.7]];
      x.fillStyle = pal.tree;
      x.beginPath();
      blobs.forEach(([dx, dy, k]) => { x.moveTo(tx + dx + r * k, ty + dy); x.arc(tx + dx, ty + dy, r * k, 0, TAU); });
      x.fill();
      const hx = tx + (sunR ? r * 0.45 : -r * 0.45), hy = ty - r * 0.45;
      const hg = x.createRadialGradient(hx, hy, 0, hx, hy, r * 1.3);
      hg.addColorStop(0, pal.treeHi || pal.tree);
      hg.addColorStop(1, 'rgba(0,0,0,0)');
      x.save();
      x.beginPath();
      blobs.forEach(([dx, dy, k]) => { x.moveTo(tx + dx + r * k, ty + dy); x.arc(tx + dx, ty + dy, r * k, 0, TAU); });
      x.clip();
      x.fillStyle = hg;
      x.fillRect(tx - r * 2.5, ty - r * 2.5, r * 5, r * 5);
      x.restore();
    }
    // ---- 瀑布
    if (pal.fall) {
      const fx = L + (Rr - L) * (0.2 + R() * 0.15);
      const fw = Math.max(3, W * 0.014);
      const fg = x.createLinearGradient(0, top, 0, H);
      fg.addColorStop(0, pal.fall);
      fg.addColorStop(0.55, 'rgba(255,255,255,.18)');
      fg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = fg;
      x.beginPath();
      x.moveTo(fx, top + H * 0.02);
      x.lineTo(fx + fw, top + H * 0.02);
      x.lineTo(fx + fw * 1.8, H);
      x.lineTo(fx - fw * 0.8, H);
      x.closePath();
      x.fill();
      x.fillStyle = 'rgba(255,255,255,.35)';
      x.fillRect(fx + fw * 0.35, top + H * 0.02, Math.max(1, fw * 0.22), (H - top) * 0.5);
    }
    // ---- 空气透视
    if (pal.haze) {
      x.globalCompositeOperation = 'source-atop';
      x.fillStyle = pal.haze;
      x.fillRect(0, 0, W, H);
    }
    return cv;
  }
  // 云海底：连续的一层柔光云
  function seaBand(ctx, y, h, cTop, cBot) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.35, cTop);
    g.addColorStop(1, cBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, y, 1920, h);
  }

  /* ---------- 画家 ---------- */
  const cache = {};
  function sprites(key, build) {
    if (!cache[key]) cache[key] = build();
    return cache[key];
  }
  function vgrad(ctx, stops, y0 = 0, y1 = 1080) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1920, 1080);
  }
  function glow(ctx, x, y, r, c0, c1 = 'rgba(0,0,0,0)', mid) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c0);
    if (mid) g.addColorStop(mid[0], mid[1]);
    g.addColorStop(1, c1);
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function rays(ctx, x, y, t, n, len, color, spread = 0.07, speed = 0.000018) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * speed);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + Math.sin(i * 7.3) * 0.2;
      const w = spread * (0.6 + 0.6 * G.hash(i + 3));
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.0006 + i * 1.7));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, len, a - w, a + w);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
  // 云层：横向循环漂移
  function cloudLayer(ctx, list, t, speed, y, scale, alpha = 1, span = 2600) {
    ctx.globalAlpha = alpha;
    list.forEach((s, i) => {
      const w = s.width / s._res * scale, h = s.height / s._res * scale;
      let px = (s._x * span + t * speed * 0.001) % span;
      if (px < 0) px += span;
      px -= (span - 1920) / 2 + w / 2;
      const py = y + s._y;
      ctx.drawImage(s, px, py, w, h);
    });
    ctx.globalAlpha = 1;
  }
  function makeClouds(seed0, n, W, H, pal, res, spread) {
    const out = [];
