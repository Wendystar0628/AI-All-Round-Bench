<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天穹圣城</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2133;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container canvas:active {
      cursor: grabbing;
    }

    /* Compact, unobtrusive viewpoint switcher */
    #vp-ui {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #vp-ui.hidden {
      display: none !important;
    }

    #vp-panel {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(126px, 1fr));
      gap: 5px;
      padding: 10px 12px;
      background: rgba(18, 24, 38, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 198, 138, 0.36);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(8, 12, 24, 0.45), inset 0 1px 0 rgba(255, 244, 214, 0.12);
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #vp-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .vp-item {
      appearance: none;
      border: 1px solid rgba(226, 198, 138, 0.14);
      background: rgba(255, 248, 232, 0.05);
      color: rgba(244, 237, 222, 0.88);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.3;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      white-space: nowrap;
    }
    .vp-item:hover {
      background: rgba(226, 198, 138, 0.16);
      border-color: rgba(226, 198, 138, 0.45);
      color: #fffaf0;
    }
    .vp-item.active {
      background: linear-gradient(135deg, rgba(61, 139, 122, 0.52), rgba(206, 168, 92, 0.34));
      border-color: rgba(235, 206, 138, 0.72);
      color: #fff9ec;
    }
    .vp-idx {
      font-size: 10px;
      color: rgba(232, 204, 140, 0.78);
      min-width: 15px;
      font-variant-numeric: tabular-nums;
    }

    #vp-bar {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      background: rgba(18, 24, 38, 0.66);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 198, 138, 0.38);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(8, 12, 24, 0.38), inset 0 1px 0 rgba(255, 244, 214, 0.14);
    }
    .vp-nav-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: rgba(236, 223, 192, 0.85);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .vp-nav-btn:hover {
      background: rgba(226, 198, 138, 0.2);
      color: #fffaf0;
    }
    #vp-toggle {
      appearance: none;
      border: none;
      background: transparent;
      color: #f6eedc;
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: 0.03em;
      padding: 4px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    #vp-toggle:hover {
      background: rgba(226, 198, 138, 0.14);
    }
    #vp-counter {
      font-size: 11px;
      color: rgba(232, 204, 140, 0.85);
      font-variant-numeric: tabular-nums;
    }
    #vp-caret {
      font-size: 9px;
      color: rgba(232, 204, 140, 0.82);
      transition: transform 0.2s ease;
    }
    #vp-toggle.open #vp-caret {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="vp-ui">
    <div id="vp-panel" role="menu" aria-label="观景点列表"></div>
    <div id="vp-bar">
      <button id="vp-prev" class="vp-nav-btn" title="上一个观景点 (←)" aria-label="上一个观景点">&#9664;</button>
      <button id="vp-toggle" title="切换观景点" aria-expanded="false">
        <span id="vp-counter">1/16</span>
        <span id="vp-name">全景</span>
        <span id="vp-caret">&#9650;</span>
      </button>
      <button id="vp-next" class="vp-nav-btn" title="下一个观景点 (→)" aria-label="下一个观景点">&#9654;</button>
    </div>
  </div>
