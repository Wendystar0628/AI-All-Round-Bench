<!DOCTYPE html>
<!--

<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>破浪者德尔塔 · BREAKER DELTA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a12;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Minimalist Jaeger-HUD Viewpoint Switcher */
    #viewpoint-hud {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #viewpoint-hud.hidden {
      display: none !important;
    }
    .vp-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .vp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 11px;
      border-radius: 4px;
      background: rgba(8, 16, 28, 0.72);
      border: 1px solid rgba(118, 178, 224, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #c8e0f4;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }
    .vp-badge:hover {
      background: rgba(16, 32, 54, 0.86);
      border-color: rgba(146, 206, 250, 0.55);
      color: #eef7ff;
    }
    .vp-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff8e36;
      box-shadow: 0 0 8px #ff8e36;
      flex-shrink: 0;
    }
    .vp-badge .caret {
      font-size: 10px;
      opacity: 0.72;
      transition: transform 0.2s ease;
    }
    .vp-badge.collapsed .caret {
      transform: rotate(-90deg);
    }
    .vp-current-label {
      color: #f0f6fc;
      font-weight: 500;
    }
    .vp-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: min(680px, calc(100vw - 36px));
      padding: 7px 8px;
      border-radius: 5px;
      background: rgba(7, 14, 24, 0.68);
      border: 1px solid rgba(110, 166, 214, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .vp-panel.collapsed {
      display: none;
    }
    .vp-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 25px;
      padding: 0 9px;
      border-radius: 3px;
      border: 1px solid rgba(118, 174, 220, 0.18);
      background: rgba(16, 30, 48, 0.52);
      color: rgba(206, 226, 245, 0.82);
      font-family: inherit;
      font-size: 11.5px;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .vp-btn .key-hint {
      font-size: 10px;
      font-family: "Consolas", "SFMono-Regular", monospace;
      color: rgba(145, 188, 222, 0.58);
    }
    .vp-btn:hover {
      background: rgba(28, 56, 86, 0.78);
      border-color: rgba(148, 206, 248, 0.48);
      color: #ffffff;
    }
    .vp-btn.active {
      background: rgba(226, 118, 36, 0.24);
      border-color: rgba(255, 160, 74, 0.78);
      color: #fff3e4;
      box-shadow: inset 0 0 10px rgba(255, 134, 42, 0.16);
    }
    .vp-btn.active .key-hint {
      color: #ffb876;
    }
  </style>
</head>
