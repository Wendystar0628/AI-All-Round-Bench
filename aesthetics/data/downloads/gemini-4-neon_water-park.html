<!DOCTYPE html>
<!--
AI审美全能 · 作品下载：作品目录已打包成这一个网页文件，脚本、样式和素材都内联在里面。

<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晴空水上乐园</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9ee0ff;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 统一全园标牌平面设计风格：圆角白底 + 天蓝/柠檬黄色块 + 粗体编号，极小巧不遮挡画面 */
    #vp-switcher {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 20;
    }
    .vp-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: rgba(251, 253, 255, 0.94);
      border: 2.5px solid #2ab2f4;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(18, 92, 160, 0.18);
      backdrop-filter: blur(8px);
    }
    .vp-arrow {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: #eaf7ff;
      color: #1262a8;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.12s;
    }
    .vp-arrow:hover {
      background: #2ab2f4;
      color: #ffffff;
    }
    .vp-arrow:active {
      transform: scale(0.92);
    }
    .vp-current {
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 10px 3px 4px;
      border-radius: 999px;
      cursor: pointer;
      color: #114b7a;
      transition: background 0.15s;
    }
    .vp-current:hover {
      background: #eef8ff;
    }
    .vp-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 6px;
      border-radius: 999px;
      background: #ffe142;
      color: #114b7a;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }
    .vp-label {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vp-caret {
      font-size: 11px;
      color: #2ab2f4;
      font-weight: 900;
    }

    .vp-panel {
      position: absolute;
      left: 0;
      bottom: 48px;
      width: 370px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 8px;
      background: rgba(251, 253, 255, 0.96);
      border: 2.5px solid #2ab2f4;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(18, 92, 160, 0.22);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .vp-panel[hidden] {
      display: none;
    }
    .vp-item {
      border: none;
      border-radius: 10px;
      background: #f0f8ff;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: left;
      color: #134d7c;
      transition: background 0.14s, color 0.14s;
    }
    .vp-item:hover {
      background: #d8f1ff;
    }
    .vp-item.active {
      background: #2ab2f4;
      color: #ffffff;
    }
    .vp-item-code {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 6px;
      background: #ffe142;
      color: #114b7a;
    }
    .vp-item-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
